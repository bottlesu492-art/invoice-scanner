<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OCR 強化測試 對比1 字加深0 銳化0</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(92vw,460px);padding:22px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 16px 36px rgba(22,33,38,.08)}h1{margin:0 0 10px;font-size:22px}p{margin:0;color:#66757f;line-height:1.6}.error{color:#b91c1c;white-space:pre-wrap}.btn{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:8px;background:#0f766e;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
<main class="box">
  <h1>正在載入 OCR 對比 1 / 字加深 0 / 銳化 0</h1>
  <p id="msg">請稍等...</p>
</main>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    const res=await fetch('ocr-run.html?base=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('讀取 OCR 測試頁失敗 HTTP ' + res.status);
    let html=await res.text();
    html=html.replace('<title>OCR 強化測試</title>','<title>OCR 強化測試 對比1 字加深0 銳化0</title>');
    html=html.replace('<h1>OCR 強化測試</h1>','<h1>OCR 強化測試 對比 1 / 字加深 0 / 銳化 0</h1>');
    html=html.replace('這頁只測紙本發票 OCR，不會改 v9，也不會寫入試算表。','這頁只測紙本發票 OCR，參數改成對比 1、字加深 0、銳化 0，不會改 v9，也不會寫入試算表。');
    html=html.replace('對比 <b>0.8</b><span>淡字不會被吃掉</span>','對比 <b>1</b><span>維持正常對比</span>');
    html=html.replace('字加深 <b>2.8</b><span>讓點陣字更明顯</span>','字加深 <b>0</b><span>不額外加深墨點</span>');
    html=html.replace('銳化 <b>1.6</b><span>加強邊緣</span>','銳化 <b>0</b><span>完全不銳化</span>');
    html=html.replace('const params={scale:1,contrast:.8,ink:2.8,highlight:1,sharp:1.6,local:5};','const params={scale:1,contrast:1,ink:0,highlight:1,sharp:0,local:5};');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    msg.className='error';
    msg.textContent='載入失敗：' + (err && err.message ? err.message : err);
    const a=document.createElement('a');
    a.className='btn';
    a.href='ocr-run.html?fallback=' + Date.now();
    a.textContent='改開原本 OCR 頁';
    document.querySelector('.box').appendChild(a);
  }
})();
</script>
</body>
</html>
