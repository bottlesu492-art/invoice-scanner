<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>發票記帳掃描 v11</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(92vw,460px);padding:22px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 16px 36px rgba(22,33,38,.08)}h1{margin:0 0 10px;font-size:22px}p{margin:0 0 14px;color:#66757f;line-height:1.6}.error{color:#b91c1c;white-space:pre-wrap}.btn{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:8px;background:#0f766e;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <h1>正在載入 v11</h1>
    <p>v11：混合 QR 辨識、每次新掃描清空舊欄位、Gemini 圖片壓縮加速、儲存只送簡化會計欄位。</p>
    <p id="msg">請稍等...</p>
  </main>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    const res=await fetch('v10.html?base=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('讀取 v10 失敗 HTTP ' + res.status);
    let wrapper=await res.text();

    const saveReplacement = "async function saveInvoice(){const payload=buildPayload();if(!payload.invoiceNo&&!payload.totalAmount){setStatus('請至少填發票號碼或含稅總額','error');return;}const url=getGasUrl();const token=getApiToken();if(!url||!token){setStatus('缺少 GAS /exec 網址或 API token，請到第一設定重新貼上並按記住','error');$('setupPanel').classList.remove('hidden-ready');return;}if(!url.startsWith('https://script.google.com/macros/s/')||!url.endsWith('/exec')){setStatus('GAS 網址格式不對，必須是 Apps Script 部署後 /exec 結尾網址','error');$('setupPanel').classList.remove('hidden-ready');return;}const sendPayload={sourceType:payload.sourceType,status:payload.status,invoiceNo:payload.invoiceNo,invoiceDate:payload.invoiceDate,sellerTaxId:payload.sellerTaxId,buyerTaxId:payload.buyerTaxId,totalAmount:payload.totalAmount,untaxedAmount:payload.untaxedAmount,taxAmount:payload.taxAmount,category:payload.category,payer:payload.payer,note:payload.note};const body=JSON.stringify({token,payload:sendPayload});$('saveInvoice').disabled=true;setStatus('正在送到 Apps Script，只送簡化會計欄位...');try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});saveLocal(sendPayload);$('saveHint').textContent='已送出到 Apps Script；試算表只會寫入簡化欄位';setStatus('已送出。若 Google Sheet 沒新增，請檢查 GAS 是否已用新版 Code.gs 重新部署，或 token 是否一致。');renderRecent(loadRecent());}catch(e){setStatus('送出失敗：'+(e.message||e),'error');}finally{$('saveInvoice').disabled=false;}}\nfunction saveLocal";

    const helpersReplacement = "function clearFieldsForNewScanV11(){fieldIds.forEach(id=>{if($(id))$(id).value='';});state.ocrText='';if($('ocrText'))$('ocrText').value='';if(window.recalcInvoiceMoneyV10)window.recalcInvoiceMoneyV10();}\nfunction bindEvents(){";

    const photoReplacement = "async function handlePhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;clearFieldsForNewScanV11();state.imageData=await resizeImage(file,1400,0.82);state.imageName=file.name;$('preview').src=state.imageData;setStatus('照片已載入，按「Gemini 判讀」會送出較小照片，加快辨識');e.target.value='';}\nasync function handleManualPhotoInput";

    const resizeReplacement = "async function resizeImage(file,max=1600,quality=0.85){const src=await readFile(file);const img=await loadImage(src);const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',quality);}\nasync function runVisionOcr";

    const detectReplacement = "async function detectQrCodes(file){const out=[];if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const bitmap=await createImageBitmap(file);const codes=await detector.detect(bitmap);if(bitmap.close)bitmap.close();codes.forEach(c=>{if(c.rawValue)out.push(c.rawValue);});}catch(e){}}if(window.Html5Qrcode){try{const scanner=state.scanner||new Html5Qrcode('reader');state.scanner=scanner;const raw=await scanner.scanFile(file,true);if(raw)out.push(raw);}catch(e){}}return unique(out);}\nfunction handleQrScan";

    const qrReplacement = "function handleQrScan(rawValue){const raw=String(rawValue||'').trim();if(!raw)return;const now=Date.now();if(raw===state.lastQr&&now-state.lastQrAt<1200)return;state.lastQr=raw;state.lastQrAt=now;const isRight=raw.startsWith('**');if(!isRight){const nextNo=raw.slice(0,10).toUpperCase();const currentLeftNo=(state.qrLeft||'').slice(0,10).toUpperCase();if(nextNo&&nextNo!==currentLeftNo){clearFieldsForNewScanV11();state.qrLeft='';state.qrRight='';$('qrLeft').textContent='';$('qrRight').textContent='';$('qrItems').textContent='尚未讀取';}}else if(!state.qrLeft&&!$('invoiceNo').value&&!$('totalAmount').value){clearFieldsForNewScanV11();}if(isRight)state.qrRight=raw;else state.qrLeft=raw;renderQrState();const parsed=parseTaiwanInvoiceQr(state.qrLeft,state.qrRight);if(parsed){applyParsedInvoice(parsed);const item=parseQrItems(state.qrLeft,state.qrRight);if(item)applyQrItemsToNote(item);setStatus(item?'QR 已讀取，主資料與品項已填入備註':'QR 左碼已讀取，主資料已填入；沒有可靠品項');return;}if(isRight)setStatus('已讀到右碼。主資料需要左邊 QR。','warn');else setStatus('已讀到 QR，但格式不像台灣電子發票左碼。','warn');}\nfunction clearQr";

    const patchLines = [];
    patchLines.push("html=html.replace(/async function saveInvoice\\(\\)\\{[\\s\\S]*?\\nfunction saveLocal/, " + JSON.stringify(saveReplacement) + ");");
    patchLines.push("html=html.replace('function bindEvents(){', " + JSON.stringify(helpersReplacement) + ");");
    patchLines.push("html=html.replace(/async function handlePhotoInput\\(e\\)\\{[\\s\\S]*?\\nasync function handleManualPhotoInput/, " + JSON.stringify(photoReplacement) + ");");
    patchLines.push("html=html.replace(/async function resizeImage\\(file\\)\\{[\\s\\S]*?\\nasync function runVisionOcr/, " + JSON.stringify(resizeReplacement) + ");");
    patchLines.push("html=html.replace(/async function detectQrCodes\\(file\\)\\{[\\s\\S]*?\\nfunction handleQrScan/, " + JSON.stringify(detectReplacement) + ");");
    patchLines.push("html=html.replace(/function handleQrScan\\(rawValue\\)\\{[\\s\\S]*?\\nfunction clearQr/, " + JSON.stringify(qrReplacement) + ");");
    patchLines.push("html=html.replace('function applyGeminiInvoiceV10(r){const total=', 'function applyGeminiInvoiceV10(r){clearFieldsForNewScanV11();const total=');");
    patchLines.push("html=html.replace('QR 本機掃描 + Gemini 紙本發票判讀</p>', 'QR 混合掃描 + Gemini 紙本發票判讀 v11</p>');");
    patchLines.push("html=html.replace('電子發票請優先掃左邊 QR。主資料會自動填入；品項會嘗試 Big5 / UTF-8 / Base64 / Shift-JIS 還原，成功時會同步帶到備註欄，儲存前仍可手動修改。', '電子發票請優先掃左邊 QR。v11 會混合 BarcodeDetector 與 html5-qrcode 辨識；掃到新 QR 會先清空舊欄位，品項成功時會帶到備註欄。');");
    patchLines.push("html=html.replace('紙本 OCR 會呼叫 Gemini API；QR 掃描不會使用 Gemini 額度。', '紙本 OCR 會呼叫 Gemini API；QR 掃描不會使用 Gemini 額度。v11 會先縮小照片以加快辨識。');");

    wrapper=wrapper.replace('document.open();', patchLines.join('\n') + '\n    document.open();');
    document.open();
    document.write(wrapper);
    document.close();
  }catch(err){
    msg.className='error';
    msg.textContent='v11 載入失敗：' + (err && err.message ? err.message : err);
    const a=document.createElement('a');
    a.className='btn';
    a.href='v10-savefix.html?fallback=' + Date.now();
    a.textContent='改開 v10';
    document.querySelector('.box').appendChild(a);
  }
})();
</script>
</body>
</html>
