<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描 v57</title>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:760px;margin:40px auto;padding:20px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(22,33,38,.08)}.err{color:#b91c1c;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box" id="loader">正在載入 v57：QR 商家補正 + 發票號碼防呆...</div>
<script>
(async function(){
  const loader=document.getElementById('loader');
  try{
    let page=await fetch('v56.html?base='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀不到 v56.html，HTTP '+r.status);return r.text();});
    page=page.replaceAll('發票記帳掃描 v56','發票記帳掃描 v57');
    page=page.replace('正在載入 v56：POST 讀取商家資料庫...','正在載入 v57：QR 商家補正 + 發票號碼防呆...');
    page=page.replace('v56 用 POST 從 GAS 讀商家資料庫；OCR 後與儲存前都會檢查，所有欄位仍可手改。','v57 掃 QR 後也會用商家資料庫補店名/類別，儲存時會擋同一張發票號碼。');

    const extraPatches = String.raw`
    html=html.replace('applyData(parsed);const item=parseQrItems(state.qrLeft,state.qrRight);','applyData(parsed);setTimeout(handleVendorAfterQr,0);const item=parseQrItems(state.qrLeft,state.qrRight);');
    html=replaceRegex(html,/function setupMoneySync\(\)/,"async function handleVendorAfterQr(){const tax=String($('sellerTaxId').value||'').replace(/\\D/g,'');if(!tax)return;if(!state.vendorLoaded){const loaded=await loadVendors(true);if(!loaded){setStatus('QR 已填資料，但商家資料庫還沒讀到，店名/類別暫不補正','warn');return;}}const match=findVendorMatch();if(match){applyVendor(match);setStatus('QR 已讀取，並已套用商家資料庫：'+(match.sellerName||match.sellerTaxId));}}function postFrame(baseUrl,fields,expectedType){return new Promise((resolve,reject)=>{const id='post_frame_'+Date.now()+'_'+Math.floor(Math.random()*100000);const frame=document.createElement('iframe');frame.name=id;frame.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;border:0;';const form=document.createElement('form');form.method='POST';form.action=baseUrl;form.target=id;form.style.display='none';Object.entries(fields||{}).forEach(([name,value])=>{const el=document.createElement('input');el.type='hidden';el.name=name;el.value=String(value==null?'':value);form.appendChild(el);});const timer=setTimeout(()=>{cleanup();reject(new Error('GAS 回覆逾時，請確認部署版本'));},15000);function cleanup(){clearTimeout(timer);window.removeEventListener('message',onMessage);form.remove();frame.remove();}function onMessage(ev){const data=ev.data;if(!data||data.type!==expectedType)return;cleanup();resolve(data);}window.addEventListener('message',onMessage);document.body.appendChild(frame);document.body.appendChild(form);form.submit();});}function setupMoneySync()",'qr vendor and post helper');
    html=replaceRegex(html,/async function saveInvoice\(\)\{if\(!\(await ensureVendorBeforeSave\(\)\)\)return;const payload=buildPayload\(\);if\(!payload\.invoiceNo&&!payload\.totalAmount\)\{[\s\S]*?finally\{\$\('saveInvoice'\)\.disabled=false;\}\}/,"async function saveInvoice(){if(!(await ensureVendorBeforeSave()))return;const payload=buildPayload();if(!payload.invoiceNo&&!payload.totalAmount){setStatus('請至少填發票號碼或含稅金額','error');return;}const url=getGasUrl();const token=getApiToken();if(!url||!token){setStatus('缺少 GAS /exec 網址或 API token','error');$('setupPanel').classList.remove('hidden-ready');return;}const sendPayload={sourceType:payload.sourceType,status:payload.status,invoiceNo:payload.invoiceNo,invoiceDate:payload.invoiceDate,sellerTaxId:payload.sellerTaxId,buyerTaxId:payload.buyerTaxId,totalAmount:payload.totalAmount,untaxedAmount:payload.untaxedAmount,taxAmount:payload.taxAmount,category:payload.category,payer:payload.payer,note:payload.note};$('saveInvoice').disabled=true;setStatus('正在送到 Apps Script...');try{const res=await postFrame(url,{token,action:'saveInvoiceFrame',targetOrigin:location.origin,payloadJson:JSON.stringify(sendPayload)},'invoice-save');if(!res.ok)throw new Error(res.error||'GAS 拒絕寫入');saveLocal(sendPayload);$('saveHint').textContent='已送出';setStatus('已送出，寫入第 '+res.row+' 列');renderRecent(loadRecent());}catch(e){setStatus('儲存失敗：'+(e.message||e),'error');}finally{$('saveInvoice').disabled=false;}}",'save with response');
`;
    page=page.replace('    html=patchGeminiFunction(html);', extraPatches + '    html=patchGeminiFunction(html);');

    document.open();
    document.write(page);
    document.close();
  }catch(err){
    loader.className='box err';
    loader.textContent=(err&&err.stack)||String(err);
  }
})();
</script>
</body>
</html>
