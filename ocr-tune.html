<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OCR 發票影像強化測試</title>
  <style>
    :root{--ink:#172126;--muted:#66757f;--line:#d9e1e5;--soft:#f4f7f8;--panel:#fff;--primary:#0f766e;--blue:#2563eb;--warn:#92400e;--danger:#b91c1c;--shadow:0 16px 36px rgba(22,33,38,.08)}
    *{box-sizing:border-box}body{margin:0;background:#eef3f4;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}button,input{font:inherit}.app{max-width:980px;margin:0 auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5}.status{min-height:38px;max-width:460px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:14px;line-height:1.4}.status.error{color:var(--danger);border-color:#fecaca;background:#fff7f7}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfd}.panel-head h2{margin:0;font-size:17px}.panel-body{padding:14px}.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{min-height:42px;padding:0 14px;border:0;border-radius:8px;background:#e7eef1;color:var(--ink);font-weight:800}.btn.primary{background:var(--primary);color:#fff}.btn.blue{background:var(--blue);color:#fff}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.shot{border:1px solid var(--line);border-radius:8px;background:#101719;overflow:hidden}.shot h3{margin:0;padding:9px 10px;background:#fbfcfd;color:var(--ink);border-bottom:1px solid var(--line);font-size:15px}.shot canvas{display:block;width:100%;height:auto;background:#fff}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.control{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}.control label{font-size:13px;font-weight:800;color:#35464e}.control .row{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:8px;align-items:center}.control input[type=range]{width:100%}.value{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}.hint{color:var(--muted);font-size:13px;line-height:1.55;margin:0}.note{white-space:pre-wrap;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:10px;color:#33444c;font-size:13px;line-height:1.55}@media(max-width:760px){.top{display:block}.status{max-width:none;margin-top:10px}.grid,.controls{grid-template-columns:1fr}.app{padding:12px}.panel-body{padding:12px}.panel-head{padding:12px}.btn{flex:1 1 auto}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><h1>OCR 發票影像強化測試</h1><p>只測照片前處理，不會寫入試算表，也不會影響 QR 掃描頁。</p></div>
    <div id="status" class="status">請先拍照或選相簿</div>
  </header>

  <section class="panel">
    <div class="panel-head"><h2>照片</h2></div>
    <div class="panel-body">
      <div class="actions">
        <button id="cameraBtn" class="btn primary" type="button">拍照測試</button>
        <button id="albumBtn" class="btn" type="button">選相簿測試</button>
        <button id="resetBtn" class="btn" type="button">重設參數</button>
        <input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment">
        <input id="albumInput" class="hidden" type="file" accept="image/*">
      </div>
      <p class="hint" style="margin-top:10px">建議先拍整張發票，保持垂直、不要閃光過曝。看右邊強化圖，如果淡字被洗掉就降低「亮部保留」或「字加深」。</p>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>強化參數</h2><button id="applyBtn" class="btn blue" type="button">重新套用</button></div>
    <div class="panel-body">
      <div class="controls">
        <div class="control"><label for="scale">放大</label><div class="row"><input id="scale" type="range" min="1" max="2.5" value="1.7" step="0.1"><span class="value" id="scaleVal">1.7</span></div></div>
        <div class="control"><label for="contrast">對比</label><div class="row"><input id="contrast" type="range" min="0.8" max="1.8" value="1.18" step="0.02"><span class="value" id="contrastVal">1.18</span></div></div>
        <div class="control"><label for="ink">字加深</label><div class="row"><input id="ink" type="range" min="0" max="2.8" value="1.35" step="0.05"><span class="value" id="inkVal">1.35</span></div></div>
        <div class="control"><label for="highlight">亮部保留</label><div class="row"><input id="highlight" type="range" min="0" max="1" value="0.72" step="0.02"><span class="value" id="highlightVal">0.72</span></div></div>
        <div class="control"><label for="sharp">銳化</label><div class="row"><input id="sharp" type="range" min="0" max="1.6" value="0.35" step="0.05"><span class="value" id="sharpVal">0.35</span></div></div>
        <div class="control"><label for="local">局部範圍</label><div class="row"><input id="local" type="range" min="1" max="5" value="2" step="1"><span class="value" id="localVal">2</span></div></div>
      </div>
    </div>
  </section>

  <section class="grid">
    <div class="shot"><h3>原圖</h3><canvas id="original"></canvas></div>
    <div class="shot"><h3>強化圖</h3><canvas id="enhanced"></canvas></div>
  </section>

  <section class="panel" style="margin-top:14px">
    <div class="panel-head"><h2>目前參數</h2></div>
    <div class="panel-body"><div id="summary" class="note">尚未載入照片</div></div>
  </section>
</main>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const state={img:null,name:''};
  const ids=['scale','contrast','ink','highlight','sharp','local'];
  document.addEventListener('DOMContentLoaded',init);
  function init(){
    $('cameraBtn').addEventListener('click',()=>$('cameraInput').click());
    $('albumBtn').addEventListener('click',()=>$('albumInput').click());
    $('cameraInput').addEventListener('change',handleFile);
    $('albumInput').addEventListener('change',handleFile);
    $('applyBtn').addEventListener('click',render);
    $('resetBtn').addEventListener('click',resetParams);
    ids.forEach(id=>$(id).addEventListener('input',()=>{syncValues();renderSoon();}));
    syncValues();
  }
  async function handleFile(e){
    const file=e.target.files&&e.target.files[0];
    if(!file)return;
    try{
      setStatus('載入照片中...');
      state.img=await loadImage(await readFile(file));
      state.name=file.name||'';
      drawOriginal();
      render();
      setStatus('已產生強化預覽，可以調參數');
    }catch(err){setStatus('照片載入失敗：'+(err.message||err),'error');}
    finally{e.target.value='';}
  }
  function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
  function loadImage(src){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=src;});}
  function params(){return{scale:+$('scale').value,contrast:+$('contrast').value,ink:+$('ink').value,highlight:+$('highlight').value,sharp:+$('sharp').value,local:+$('local').value};}
  function syncValues(){ids.forEach(id=>$(id+'Val').textContent=$(id).value);}
  function drawOriginal(){
    if(!state.img)return;
    const p=params();
    const c=$('original'), ctx=c.getContext('2d');
    const scale=fitScale(state.img,p.scale);
    c.width=Math.round(state.img.width*scale); c.height=Math.round(state.img.height*scale);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(state.img,0,0,c.width,c.height);
  }
  let timer=null;
  function renderSoon(){clearTimeout(timer);timer=setTimeout(render,120);}
  function render(){
    if(!state.img){$('summary').textContent='尚未載入照片';return;}
    const p=params();
    drawOriginal();
    const c=$('enhanced'), ctx=c.getContext('2d',{willReadFrequently:true});
    const scale=fitScale(state.img,p.scale);
    c.width=Math.round(state.img.width*scale); c.height=Math.round(state.img.height*scale);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(state.img,0,0,c.width,c.height);
    const data=ctx.getImageData(0,0,c.width,c.height);
    enhance(data,p);
    ctx.putImageData(data,0,0);
    $('summary').textContent='檔名: '+(state.name||'未命名')+'\n放大 '+p.scale+' / 對比 '+p.contrast+' / 字加深 '+p.ink+' / 亮部保留 '+p.highlight+' / 銳化 '+p.sharp+' / 局部範圍 '+p.local;
  }
  function fitScale(img,base){
    const long=Math.max(img.width,img.height);
    return Math.min(base,2400/long);
  }
  function enhance(imageData,p){
    const d=imageData.data,w=imageData.width,h=imageData.height,len=w*h;
    const gray=new Uint8ClampedArray(len);
    const hist=new Uint32Array(256);
    for(let i=0,px=0;i<d.length;i+=4,px++){
      const g=Math.round(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
      gray[px]=g; hist[g]++;
    }
    const lo=percentile(hist,len,0.01);
    const hi=Math.max(lo+50,percentile(hist,len,0.995));
    const norm=new Uint8ClampedArray(len);
    for(let px=0;px<len;px++){
      let v=(gray[px]-lo)*245/(hi-lo)+8;
      v=(v-128)*p.contrast+128;
      norm[px]=clamp(v);
    }
    const r=p.local;
    const sharp=p.sharp;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const idx=y*w+x;
        let sum=0,count=0;
        for(let yy=-r;yy<=r;yy++){
          const ny=y+yy; if(ny<0||ny>=h)continue;
          for(let xx=-r;xx<=r;xx++){
            const nx=x+xx; if(nx<0||nx>=w)continue;
            sum+=norm[ny*w+nx]; count++;
          }
        }
        const local=sum/count;
        let v=norm[idx];
        const darkerThanBg=Math.max(0,local-v);
        if(darkerThanBg>3)v-=darkerThanBg*p.ink;
        if(x>0&&x<w-1&&y>0&&y<h-1&&sharp>0){
          const blur=(norm[idx-1]+norm[idx+1]+norm[idx-w]+norm[idx+w])/4;
          v+= (norm[idx]-blur)*sharp;
        }
        if(v>235)v=235+(v-235)*p.highlight;
        v=clamp(v);
        const i=idx*4; d[i]=v; d[i+1]=v; d[i+2]=v; d[i+3]=255;
      }
    }
  }
  function percentile(hist,total,pct){let target=Math.max(1,Math.floor(total*pct)),sum=0;for(let i=0;i<hist.length;i++){sum+=hist[i];if(sum>=target)return i;}return 255;}
  function clamp(v){return v<0?0:v>255?255:Math.round(v);}
  function resetParams(){const defaults={scale:'1.7',contrast:'1.18',ink:'1.35',highlight:'0.72',sharp:'0.35',local:'2'};ids.forEach(id=>$(id).value=defaults[id]);syncValues();render();}
  function setStatus(msg,type){const el=$('status');el.textContent=msg;el.classList.toggle('error',type==='error');}
})();
</script>
</body>
</html>
