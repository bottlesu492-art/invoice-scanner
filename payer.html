<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描</title>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:760px;margin:40px auto;padding:20px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(22,33,38,.08)}.err{color:#b91c1c;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box" id="loader">正在載入付款人名單版本...</div>
<script>
(async function(){
  const loader=document.getElementById('loader');
  try{
    let page=await fetch('index.html?base='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀不到 index.html，HTTP '+r.status);return r.text();});
    const payerPatches = String.raw`
    html=html.replace('vendors:[],vendorLoaded:false,ocrStream:null','vendors:[],vendorLoaded:false,payers:[],buyerTaxIds:[],settingsLoaded:false,ocrStream:null');
    html=html.replace('loadVendors();bindSaveHintRefresh();','loadVendors();loadInvoiceSettings();bindSaveHintRefresh();');
    html=html.replace("setStatus('已記住 GAS 與 Gemini 設定');","setStatus('已記住 GAS 與 Gemini 設定');loadVendors(true);loadInvoiceSettings(true);");
    html=html.replace('applyData(parsed);setTimeout(handleVendorAfterQr,0);const item','applyData(parsed);autoFillBuyerTaxIdFromText(state.qrLeft+"\\n"+state.qrRight);setTimeout(handleVendorAfterQr,0);const item');
    html=html.replace("'你是台灣公司記帳助理。請讀取照片中的台灣發票或收銀機統一發票，只輸出 JSON。'","'你是台灣公司記帳助理。請讀取照片中的台灣發票或收銀機統一發票，只輸出 JSON。',((state.buyerTaxIds&&state.buyerTaxIds.length)?'已知買方統編清單：'+state.buyerTaxIds.join('、')+'。如果照片中出現其中任一組 8 碼，buyerTaxId 請填入該組統編。':'' )");
    html=html.replace('});;setTimeout(handleVendorAfterOcr,0);','});autoFillBuyerTaxIdFromText(state.ocrText);setTimeout(handleVendorAfterOcr,0);');
    html=html.replace("const candidates=model==='auto'?['gemini-3.1-flash-lite-preview','gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-2.5-flash']:[model];","const candidates=model==='auto'?['gemini-3.1-flash-lite-preview']:[model];");
    html=html.replace("throw new Error(lastError||'所有 Gemini 模型都失敗');","throw new Error(lastError||'Gemini 3.1 Flash Lite Preview 失敗，已停止，不會改用 2.5 額度');");
    html=html.replace('function setupMoneySync(){',"function loadInvoiceSettings(force=false){const url=getGasUrl();const token=getApiToken();if(!url||!token){return Promise.resolve(false);}if(state.settingsLoading&&!force)return state.settingsLoading;state.settingsLoading=postFrame(url,{token,action:'settingsFrame',targetOrigin:location.origin},'invoice-settings').then(res=>{if(res&&res.ok){state.payers=Array.isArray(res.payers)?res.payers:[];state.buyerTaxIds=Array.isArray(res.buyerTaxIds)?res.buyerTaxIds.map(v=>String(v||'').replace(/\\D/g,'')).filter(v=>v.length===8):[];state.settingsLoaded=true;setupPayerInput();autoFillBuyerTaxIdFromText(collectKnownText());return true;}state.settingsLoaded=false;setStatus('付款人/買方統編名單讀取失敗：'+((res&&res.error)||'GAS 沒有回傳 settings'),'warn');return false;}).catch(err=>{state.settingsLoaded=false;setStatus('付款人/買方統編名單讀取失敗：'+(err.message||err),'warn');return false;}).finally(()=>{state.settingsLoading=null;});return state.settingsLoading;}function setupPayerInput(){const payer=$('payer');if(!payer)return;let list=$('payerOptions');if(!list){list=document.createElement('datalist');list.id='payerOptions';document.body.appendChild(list);}payer.setAttribute('list','payerOptions');list.innerHTML='';state.payers.forEach(name=>{const opt=document.createElement('option');opt.value=name;list.appendChild(opt);});}function collectKnownText(){return [state.qrLeft,state.qrRight,state.ocrText,$('note')&&$('note').value,$('buyerTaxId')&&$('buyerTaxId').value].join('\\n');}function autoFillBuyerTaxIdFromText(text){const current=String($('buyerTaxId').value||'').replace(/\\D/g,'');if(current.length===8)return;const hay=String(text||'');const hit=(state.buyerTaxIds||[]).find(id=>id&&hay.includes(id));if(hit){$('buyerTaxId').value=hit;if(window.recalcMoney)window.recalcMoney();setSaveStatus('確認後寫入試算表');}}function setupMoneySync(){");
`;
    const marker="    page=page.replace('    html=patchGeminiFunction(html);', extraPatches + '    html=patchGeminiFunction(html);');";
    if(!page.includes(marker)) throw new Error('找不到正式頁補丁插入點');
    page=page.replace(marker,"    page=page.replace('    html=patchGeminiFunction(html);', extraPatches + payerPatches + '    html=patchGeminiFunction(html);');");
    document.open();
    document.write(page);
    document.close();
  }catch(err){
    loader.className='box err';
    loader.textContent=(err&&err.stack)||String(err);
  }
})();
</script>
</body>
</html>
