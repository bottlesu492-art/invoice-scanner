<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描 v37</title>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:760px;margin:40px auto;padding:20px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(22,33,38,.08)}.err{color:#b91c1c;white-space:pre-wrap}</style>
</head>
<body>
<div class="box" id="loader">正在載入 v37：只縮圖保原色，不灰階不壓黑...</div>
<script>
(async function(){
  const loader=document.getElementById('loader');
  function patch(html,from,to,label){const next=html.replace(from,to);if(next===html)throw new Error('v37 補丁失敗：'+label);return next;}
  function patchGeminiFunction(html){
    const start=html.indexOf('async function callGeminiInvoice(dataUrl,key){');
    const end=html.indexOf('\nfunction applyGeminiInvoice',start);
    if(start<0||end<0)throw new Error('找不到 Gemini 函式區塊');
    const original=html.slice(start,end);
    const cut=original.indexOf('const res=await fetch(');
    if(cut<0)throw new Error('找不到 Gemini fetch 區塊');
    const prefix=original.slice(0,cut).replace('async function callGeminiInvoice(dataUrl,key){const base64=',"async function callGeminiInvoice(dataUrl,key,model){model=model||'auto';const base64=");
    const fallback="const candidates=model==='auto'?['gemini-3.1-flash-lite-preview','gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-2.5-flash']:[model];let text='';let used='';let lastError='';for(const m of candidates){try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=`+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.error){lastError=(json.error&&json.error.message)||('HTTP '+res.status);continue;}text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;if(text){used=m;break;}lastError='Gemini 沒有回傳文字';}catch(err){lastError=err.message||String(err);}}if(!text)throw new Error(lastError||'所有 Gemini 模型都失敗');setStatus('Gemini 使用模型：'+used);return JSON.parse(String(text).replace(/^\\x60\\x60\\x60(?:json)?\\s*/,'').replace(/\\s*\\x60\\x60\\x60$/,'').trim());}";
    return html.slice(0,start)+prefix+fallback+html.slice(end);
  }
  try{
    let html=await fetch('v36.html?base='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀不到 v36.html，HTTP '+r.status);return r.text();});
    html=html.replaceAll('發票記帳掃描 v36','發票記帳掃描 v37');
    html=html.replace('v36 只轉灰階並保留白底，不銳化、不壓黑，讓 0 的淡斜線盡量保留下來。','v37 只縮圖保原色，不做灰階、不銳化、不壓黑，讓 Gemini 直接看最接近原圖的照片。');
    html=patch(html,'<div class="box" id="loader">正在載入 v36：灰階保白底，不銳化不壓黑...</div>','<div class="box" id="loader">正在載入 v37：只縮圖保原色，不灰階不壓黑...</div>','loader text');
    html=patch(html,'if(mode===\'tuned\')applyGrayKeepWhite(ctx,c.width,c.height);else if(mode===\'mono\')makeCrispMono(ctx,c.width,c.height);else if(mode)softSharpenCanvas(ctx,c.width,c.height);','if(mode===\'tuned\')applyGrayKeepWhite(ctx,c.width,c.height);else if(mode===\'mono\')makeCrispMono(ctx,c.width,c.height);else if(mode)softSharpenCanvas(ctx,c.width,c.height);','resize flow');
    html=patch(html,'function applyGrayKeepWhite(ctx,w,h){const src=ctx.getImageData(0,0,w,h);const data=src.data;for(let i=0;i<data.length;i+=4){let g=data[i]*.299+data[i+1]*.587+data[i+2]*.114;if(g>188)g=222+(g-188)*.72;else if(g<95)g=g*.96;else g=95+(g-95)*.98;g=Math.max(0,Math.min(255,g));data[i]=data[i+1]=data[i+2]=g;data[i+3]=255;}ctx.putImageData(src,0,0);}function applyTunedOcr(ctx,w,h){','function applyGrayKeepWhite(ctx,w,h){}function applyTunedOcr(ctx,w,h){','gray noop');
    html=patch(html,'<div class="hint">v36 灰階保白底，不銳化不壓黑。需要重設時，在網址後加 <code>?setup=1</code>。QR 掃描不花 Gemini 額度。</div>','<div class="hint">v37 只縮圖保原色，不做灰階、不銳化、不壓黑。需要重設時，在網址後加 <code>?setup=1</code>。QR 掃描不花 Gemini 額度。</div>','hint');
    html=patchGeminiFunction(html);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    loader.className='box err';
    loader.textContent=(err&&err.stack)||String(err);
  }
})();
</script>
</body>
</html>
