<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描 v41</title>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:760px;margin:40px auto;padding:20px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(22,33,38,.08)}.err{color:#b91c1c;white-space:pre-wrap}</style>
</head>
<body>
<div class="box" id="loader">正在載入 v41：OCR 拍照改用網頁相機...</div>
<script>
(async function(){
  const loader=document.getElementById('loader');
  function fail(label){throw new Error('v41 補丁失敗：'+label);}
  function replaceChecked(html,from,to,label){const next=html.replace(from,to);if(next===html)fail(label);return next;}
  function replaceRegex(html,re,to,label){const next=html.replace(re,to);if(next===html)fail(label);return next;}
  function patchGeminiFunction(html){
    const start=html.indexOf('async function callGeminiInvoice(dataUrl,key){');
    const end=html.indexOf('\nfunction applyGeminiInvoice',start);
    if(start<0||end<0)fail('找不到 Gemini 函式區塊');
    const original=html.slice(start,end);
    const cut=original.indexOf('const res=await fetch(');
    if(cut<0)fail('找不到 Gemini fetch 區塊');
    const prefix=original.slice(0,cut).replace('async function callGeminiInvoice(dataUrl,key){const base64=',"async function callGeminiInvoice(dataUrl,key,model){model=model||'auto';const base64=");
    const fallback="const candidates=model==='auto'?['gemini-3.1-flash-lite-preview','gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-2.5-flash']:[model];let text='';let used='';let lastError='';for(const m of candidates){try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=`+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.error){lastError=(json.error&&json.error.message)||('HTTP '+res.status);continue;}text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;if(text){used=m;break;}lastError='Gemini 沒有回傳文字';}catch(err){lastError=err.message||String(err);}}if(!text)throw new Error(lastError||'所有 Gemini 模型都失敗');setStatus('Gemini 使用模型：'+used);return JSON.parse(String(text).replace(/^\\x60\\x60\\x60(?:json)?\\s*/,'').replace(/\\s*\\x60\\x60\\x60$/,'').trim());}";
    return html.slice(0,start)+prefix+fallback+html.slice(end);
  }
  try{
    let html=await fetch('v28.html?base='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀不到 v28.html，HTTP '+r.status);return r.text();});
    html=html.replaceAll('發票記帳掃描 v28','發票記帳掃描 v41');
    html=html.replace('v28 將偏暗點陣字再壓黑，背景與銳化沿用 v27。','v41 拍照辨識改用網頁相機，不會開手機相機 App；照片只做基本灰白化。');
    html=replaceChecked(html,
      '<section id="mode-ocr" class="mode"><div class="hint">v28 將偏暗點陣字再壓黑，背景與銳化沿用 v27。</div><div class="actions"><button id="ocrCamera" class="btn primary" type="button">拍照辨識</button><button id="ocrAlbum" class="btn ghost" type="button">選相簿辨識</button><button id="runOcr" class="btn blue" type="button">Gemini 判讀</button><input id="ocrCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="ocrAlbumInput" class="hidden" type="file" accept="image/*"></div><div class="progress hidden" id="ocrProgress"><span></span></div><div class="preview-wrap" style="margin-top:14px"><img id="preview" class="preview" alt=""><textarea id="ocrText" class="ocr-text" placeholder="Gemini 回傳 JSON"></textarea></div></section>',
      '<section id="mode-ocr" class="mode"><div class="hint">v41 拍照辨識使用網頁相機，不會開手機相機 App。按一次開相機，再按一次拍下發票。</div><div class="actions"><button id="ocrCamera" class="btn primary" type="button">拍照辨識</button><button id="ocrAlbum" class="btn ghost" type="button">選相簿辨識</button><button id="runOcr" class="btn blue" type="button">Gemini 判讀</button><input id="ocrCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="ocrAlbumInput" class="hidden" type="file" accept="image/*"></div><div class="progress hidden" id="ocrProgress"><span></span></div><div class="preview-wrap" style="margin-top:14px"><div><video id="ocrVideo" class="preview hidden" playsinline muted></video><img id="preview" class="preview" alt=""></div><textarea id="ocrText" class="ocr-text" placeholder="Gemini 回傳 JSON"></textarea></div></section>',
      'OCR section');
    html=replaceChecked(html,"$('ocrCamera').addEventListener('click',()=>$('ocrCameraInput').click());","$('ocrCamera').addEventListener('click',handleWebOcrCamera);",'OCR camera binding');
    html=replaceRegex(html,/async function prepareOcrImage\(file\)\{[^}]+\}/,"async function prepareOcrImage(file){return resizeImage(file,2200,0.95,'grayPlain');}",'prepareOcrImage');
    html=replaceChecked(html,"if(mode==='tuned')applyTunedOcr(ctx,c.width,c.height);else if(mode==='mono')makeCrispMono(ctx,c.width,c.height);else if(mode)softSharpenCanvas(ctx,c.width,c.height);","if(mode==='grayPlain')applyPlainGray(ctx,c.width,c.height);else if(mode==='tuned')applyTunedOcr(ctx,c.width,c.height);else if(mode==='mono')makeCrispMono(ctx,c.width,c.height);else if(mode)softSharpenCanvas(ctx,c.width,c.height);",'resize gray branch');
    html=replaceChecked(html,"function applyTunedOcr(ctx,w,h){","function applyPlainGray(ctx,w,h){const src=ctx.getImageData(0,0,w,h);const data=src.data;for(let i=0;i<data.length;i+=4){const g=data[i]*.299+data[i+1]*.587+data[i+2]*.114;data[i]=data[i+1]=data[i+2]=Math.max(0,Math.min(255,g));data[i+3]=255;}ctx.putImageData(src,0,0);}function applyTunedOcr(ctx,w,h){",'plain gray function');
    html=replaceChecked(html,"async function handlePhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;clearFieldsForNewScan();state.imageData=await prepareOcrImage(file);state.imageName=file.name;$('preview').src=state.imageData;setStatus('照片已載入，已套用溫和文字加深參數');e.target.value='';}","async function handlePhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;stopWebOcrCamera();clearFieldsForNewScan();state.imageData=await prepareOcrImage(file);state.imageName=file.name;$('preview').classList.remove('hidden');$('preview').src=state.imageData;setStatus('照片已載入，已套用基本灰白化');e.target.value='';}async function handleWebOcrCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('這個瀏覽器不支援網頁相機，請改用選相簿辨識','error');return;}const video=$('ocrVideo');const preview=$('preview');try{if(!state.ocrStream){const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:2560}},audio:false});state.ocrStream=stream;video.srcObject=stream;video.classList.remove('hidden');preview.classList.add('hidden');await video.play();$('ocrCamera').textContent='拍下發票';setStatus('網頁相機已開啟，對準發票後再按一次拍照辨識');return;}if(!video.videoWidth||!video.videoHeight){setStatus('相機還在準備中，請再等一下','warn');return;}clearFieldsForNewScan();const canvas=document.createElement('canvas');canvas.width=video.videoWidth;canvas.height=video.videoHeight;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,0,0,canvas.width,canvas.height);applyPlainGray(ctx,canvas.width,canvas.height);state.imageData=canvas.toDataURL('image/jpeg',0.95);state.imageName='web-camera.jpg';preview.src=state.imageData;preview.classList.remove('hidden');stopWebOcrCamera();setStatus('網頁相機已拍下發票，已套用基本灰白化');}catch(e){stopWebOcrCamera();setStatus('網頁相機失敗：'+(e.message||e),'error');}}function stopWebOcrCamera(){if(state.ocrStream){state.ocrStream.getTracks().forEach(t=>t.stop());state.ocrStream=null;}const video=$('ocrVideo');if(video){video.pause();video.srcObject=null;video.classList.add('hidden');}$('ocrCamera').textContent='拍照辨識';}", 'web OCR camera functions');
    html=replaceChecked(html,"if(mode!=='qr')stopQrScanner();setStatus(mode==='qr'?'QR 模式：本機掃描，不花 Gemini 額度':mode==='ocr'?'OCR 模式：使用 Gemini':'手動模式');","if(mode!=='qr')stopQrScanner();if(mode!=='ocr')stopWebOcrCamera();setStatus(mode==='qr'?'QR 模式：本機掃描，不花 Gemini 額度':mode==='ocr'?'OCR 模式：使用 Gemini':'手動模式');",'mode camera cleanup');
    html=replaceChecked(html,"function resetAll(){fieldIds.forEach(id=>$(id).value='');state.imageData='';state.imageName='';state.ocrText='';$('ocrText').value='';$('preview').removeAttribute('src');$('manualPreview').removeAttribute('src');clearQr();if(window.recalcMoney)window.recalcMoney();setStatus('已清空');}","function resetAll(){fieldIds.forEach(id=>$(id).value='');state.imageData='';state.imageName='';state.ocrText='';$('ocrText').value='';$('preview').removeAttribute('src');$('manualPreview').removeAttribute('src');stopWebOcrCamera();clearQr();if(window.recalcMoney)window.recalcMoney();setStatus('已清空');}",'reset cleanup');
    html=replaceChecked(html,
      '<div class="setup-row" style="margin-top:10px"><input id="apiToken" placeholder="GAS API token"><input id="visionKey" placeholder="Gemini API key"></div><div class="hint">需要重設時，在網址後加 <code>?setup=1</code>。QR 掃描不花 Gemini 額度。</div>',
      '<div class="setup-row" style="margin-top:10px"><input id="apiToken" placeholder="GAS API token"><input id="visionKey" placeholder="Gemini API key"></div><div class="setup-row" style="margin-top:10px"><select id="geminiModel"><option value="auto">自動：3.1 Preview → 3.1 → 2.5 Lite → 2.5 Flash</option><option value="gemini-3.1-flash-lite-preview">Gemini 3.1 Flash Lite Preview</option><option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option><option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite：備用</option><option value="gemini-2.5-flash">Gemini 2.5 Flash：備用較準</option></select></div><div class="hint">v41 OCR 拍照使用網頁相機，不會開手機相機 App。QR 掃描不花 Gemini 額度。</div>',
      '設定區模型選單');
    html=replaceChecked(html,"function loadSettings(){const url=localStorage.getItem('gas-url')||'';const token=localStorage.getItem('invoice-api-token')||'';const gemini=localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';$('gasUrl').value=url;$('apiToken').value=token;$('visionKey').value=gemini;const forceSetup=new URLSearchParams(location.search).has('setup');$('setupPanel').classList.toggle('hidden-ready',Boolean(url&&token&&gemini&&!forceSetup));}","function loadSettings(){const url=localStorage.getItem('gas-url')||'';const token=localStorage.getItem('invoice-api-token')||'';const gemini=localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';const model=localStorage.getItem('gemini-model')||'auto';$('gasUrl').value=url;$('apiToken').value=token;$('visionKey').value=gemini;$('geminiModel').value=model;const forceSetup=new URLSearchParams(location.search).has('setup');$('setupPanel').classList.toggle('hidden-ready',Boolean(url&&token&&gemini&&!forceSetup));}",'loadSettings');
    html=replaceChecked(html,"function saveSettings(){const url=$('gasUrl').value.trim();const token=$('apiToken').value.trim();const gemini=$('visionKey').value.trim();if(!(url.startsWith('https://script.google.com/macros/s/')&&url.endsWith('/exec'))){setStatus('請貼上 Apps Script /exec 結尾網址','error');return;}if(token.length<20){setStatus('請貼上 GAS API token','error');return;}if(gemini.length<20){setStatus('請貼上 Gemini API key','error');return;}localStorage.setItem('gas-url',url);localStorage.setItem('invoice-api-token',token);localStorage.setItem('gemini-api-key',gemini);localStorage.removeItem('vision-api-key');$('setupPanel').classList.add('hidden-ready');setStatus('已記住 GAS 與 Gemini 設定');}","function saveSettings(){const url=$('gasUrl').value.trim();const token=$('apiToken').value.trim();const gemini=$('visionKey').value.trim();const model=$('geminiModel').value||'auto';if(!(url.startsWith('https://script.google.com/macros/s/')&&url.endsWith('/exec'))){setStatus('請貼上 Apps Script /exec 結尾網址','error');return;}if(token.length<20){setStatus('請貼上 GAS API token','error');return;}if(gemini.length<20){setStatus('請貼上 Gemini API key','error');return;}localStorage.setItem('gas-url',url);localStorage.setItem('invoice-api-token',token);localStorage.setItem('gemini-api-key',gemini);localStorage.setItem('gemini-model',model);localStorage.removeItem('vision-api-key');$('setupPanel').classList.add('hidden-ready');setStatus('已記住 GAS 與 Gemini 設定');}",'saveSettings');
    html=replaceChecked(html,"function getGasUrl(){return localStorage.getItem('gas-url')||'';}function getApiToken(){return localStorage.getItem('invoice-api-token')||'';}function getGeminiKey(){return localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';}","function getGasUrl(){return localStorage.getItem('gas-url')||'';}function getApiToken(){return localStorage.getItem('invoice-api-token')||'';}function getGeminiKey(){return localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';}function getGeminiModel(){return localStorage.getItem('gemini-model')||'auto';}",'getGeminiModel');
    html=replaceChecked(html,"const key=getGeminiKey();if(!key){setStatus('請先到設定填 Gemini API key','error');$('setupPanel').classList.remove('hidden-ready');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setProgress(12);setStatus('Gemini 正在看發票...');try{const result=await callGeminiInvoice(state.imageData,key);","const key=getGeminiKey();const model=getGeminiModel();if(!key){setStatus('請先到設定填 Gemini API key','error');$('setupPanel').classList.remove('hidden-ready');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setProgress(12);setStatus(`Gemini 正在用 ${model==='auto'?'自動模式':model} 看發票...`);try{const result=await callGeminiInvoice(state.imageData,key,model);",'runGeminiOcr model');
    html=patchGeminiFunction(html);
    document.open();document.write(html);document.close();
  }catch(err){loader.className='box err';loader.textContent=(err&&err.stack)||String(err);}
})();
</script>
</body>
</html>
