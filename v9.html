<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>發票記帳掃描 v9</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .box{width:min(92vw,460px);padding:22px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 16px 36px rgba(22,33,38,.08)}
    h1{margin:0 0 10px;font-size:22px}
    p{margin:0 0 14px;color:#66757f;line-height:1.6}
    .error{color:#b91c1c;white-space:pre-wrap}
    .btn{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:8px;background:#0f766e;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <h1>正在載入 v9</h1>
    <p>手機修復版：直接載入主程式，不再套第二層補丁，避免 Android Chrome 卡在載入畫面。</p>
    <p id="msg">請稍等...</p>
  </main>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    const res=await fetch('index.html?v9phonefix=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('讀取主程式失敗 HTTP ' + res.status);
    let html=await res.text();
    html=html.replace('<title>發票記帳掃描</title>','<title>發票記帳掃描 v9</title>');
    html=html.replace('發票記帳掃描</h1><p>QR 本機掃描 + Cloud Vision OCR</p>','發票記帳掃描 v9</h1><p>QR 本機掃描 + Cloud Vision OCR</p>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    msg.className='error';
    msg.textContent='v9 載入失敗：' + (err && err.message ? err.message : err);
    const a=document.createElement('a');
    a.className='btn';
    a.href='index.html?fallback=' + Date.now();
    a.textContent='改開主程式';
    document.querySelector('.box').appendChild(a);
  }
})();
</script>
</body>
</html>
