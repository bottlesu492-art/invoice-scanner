<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>發票記帳掃描 v9</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(92vw,460px);padding:22px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 16px 36px rgba(22,33,38,.08)}h1{margin:0 0 10px;font-size:22px}p{margin:0 0 14px;color:#66757f;line-height:1.6}.error{color:#b91c1c;white-space:pre-wrap}
  </style>
</head>
<body>
  <main id="loader" class="box">
    <h1>正在載入 v9</h1>
    <p>同一個網址，套用 QR 改良、OCR 發票影像強化、含稅總額自動計算未稅與稅額。</p>
    <p id="msg">請稍等...</p>
  </main>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    const stamp=Date.now();
    const [baseRes, patchRes]=await Promise.all([
      fetch('index.html?base='+stamp,{cache:'no-store'}),
      fetch('v9-patch.js?patch='+stamp,{cache:'no-store'})
    ]);
    if(!baseRes.ok) throw new Error('讀取主程式失敗 HTTP '+baseRes.status);
    if(!patchRes.ok) throw new Error('讀取 v9 修補程式失敗 HTTP '+patchRes.status);
    let html=await baseRes.text();
    const patchCode=await patchRes.text();
    (0,eval)(patchCode);
    if(typeof window.applyInvoiceV9Patch!=='function') throw new Error('v9 修補程式沒有載入成功');
    html=window.applyInvoiceV9Patch(html);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    msg.className='error';
    msg.textContent='v9 載入失敗：'+(err&&err.message?err.message:err);
  }
})();
</script>
</body>
</html>
