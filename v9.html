<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>發票記帳掃描 v9</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(92vw,460px);padding:22px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 16px 36px rgba(22,33,38,.08)}h1{margin:0 0 10px;font-size:22px}p{margin:0 0 14px;color:#66757f;line-height:1.6}.error{color:#b91c1c;white-space:pre-wrap}
  </style>
</head>
<body>
  <main id="loader" class="box">
    <h1>正在載入 v9</h1>
    <p>這版會套用：QR 拍照備用解碼、雙 QR 優先抓完整左碼、較清楚的掃描框、QR 品項帶入備註、含稅總額自動算未稅/稅額。</p>
    <p id="msg">請稍等...</p>
  </main>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    const response=await fetch('index.html?base=' + Date.now(), {cache:'no-store'});
    if(!response.ok) throw new Error('讀取主程式失敗 HTTP ' + response.status);
    let html=await response.text();

    html=html.replace('</head>','<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"><\/script></head>');
    html=html.replace('品項只顯示在下方，會嘗試 Big5 / UTF-8 / Base64 / Shift-JIS 還原，不自動寫入備註。','品項會嘗試 Big5 / UTF-8 / Base64 / Shift-JIS 還原，成功時會同步帶到備註欄，儲存前仍可手動修改。');
    html=html.replace('電子發票請優先掃左邊 QR。','電子發票請優先掃左邊 QR。v9 會盡量避開右碼，拍照掃描會把照片分區重試。');
    html=html.replace('<option value="">未分類</option><option>交通</option><option>餐費</option><option>文具</option><option>郵資</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option>','<option value="">未分類</option><option>五金用品</option><option>加油</option><option>停車費</option><option>餐費</option><option>文具</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option>');
    html=html.replace('<label for="totalAmount">總金額</label>','<label for="totalAmount">含稅總額</label>');
    html=html.replace('<div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" inputmode="decimal"></div>','<div class="field"><label for="untaxedAmount">未稅金額</label><input id="untaxedAmount" inputmode="decimal" readonly></div><div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" inputmode="decimal" readonly></div>');
    html=html.replace(/'totalAmount',\s*'taxAmount'/,"'totalAmount','untaxedAmount','taxAmount'");
    html=html.replace('function init(){bindEvents();loadSettings();renderRecent(loadRecent());}', 'function init(){bindEvents();loadSettings();setupMoneySyncV9();renderRecent(loadRecent());}');
    html=html.replace('function bindEvents(){', "function setupMoneySyncV9(){const total=$('totalAmount'),untaxed=$('untaxedAmount'),tax=$('taxAmount');if(!total||!untaxed||!tax)return;untaxed.readOnly=true;tax.readOnly=true;untaxed.tabIndex=-1;tax.tabIndex=-1;window.recalcInvoiceMoneyV9=function(){const n=Number(String(total.value||'').replace(/,/g,'').trim());if(!Number.isFinite(n)||n<=0){untaxed.value='';tax.value='';return;}const beforeTax=Math.floor(n/1.05);untaxed.value=String(beforeTax);tax.value=String(n-beforeTax);};total.addEventListener('input',window.recalcInvoiceMoneyV9);total.addEventListener('change',window.recalcInvoiceMoneyV9);setTimeout(window.recalcInvoiceMoneyV9,0);}function bindEvents(){");

    const startQrScanner=String.raw`async function startQrScanner(){if(!window.Html5Qrcode){setStatus('QR 套件還沒載入，請重新整理網頁','error');return;}if(state.scanning)return;try{const opt=window.Html5QrcodeSupportedFormats?{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]}:undefined;state.scanner=state.scanner||new Html5Qrcode('reader',opt);setStatus('正在開啟相機...');$('liveQr').disabled=true;$('stopQr').disabled=true;await state.scanner.start({facingMode:'environment'},{fps:14,qrbox:(w,h)=>{const width=Math.floor(Math.min(w*0.9,420));const height=Math.floor(Math.min(h*0.46,260));return{width:Math.max(220,width),height:Math.max(170,height)};},aspectRatio:1.333},handleQrScan,()=>{});state.scanning=true;$('stopQr').disabled=false;setStatus('掃描中：把左邊 QR 放在白框中間；若兩碼太近，先遮住右碼會更穩。');}catch(e){$('liveQr').disabled=false;$('stopQr').disabled=true;setStatus('無法啟動相機：'+(e.message||e),'error');}}`;
    html=html.replace(/async function startQrScanner\(\)\{[\s\S]*?\nasync function stopQrScanner/, startQrScanner+'\nasync function stopQrScanner');

    const qrPhoto=String.raw`async function scanQrFromPhoto(e){const file=e.target.files&&e.target.files[0];if(!file)return;try{await stopQrScanner();state.imageData=await resizeImage(file);state.imageName=file.name;setStatus('照片 QR 辨識中：會先找完整左碼，再補右碼');const raws=sortQrCodesV9(await detectQrCodes(file));if(!raws.length)throw new Error('沒有讀到 QR');raws.forEach(raw=>handleQrScan(raw));if(state.qrLeft)setStatus('照片 QR 已讀到完整左碼，主資料已填入');else setStatus('照片只讀到右碼或不完整碼，請把左邊 QR 拍大一點再試','warn');}catch(err){setStatus('照片 QR 仍沒讀到。請只拍 QR 區域，讓左邊 QR 佔畫面 1/3 以上；如果兩碼太近，先遮住右碼再拍。'+(err.message?' ('+err.message+')':''),'warn');}finally{e.target.value='';}}
async function detectQrCodes(file){let out=[];if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const bitmap=await createImageBitmap(file);const codes=await detector.detect(bitmap);if(bitmap.close)bitmap.close();out=out.concat(codes.map(c=>c.rawValue).filter(Boolean));}catch(e){}}
out=out.concat(await detectQrCodesWithJsQrV9(file));if(out.length)return sortQrCodesV9(unique(out));if(!window.Html5Qrcode)throw new Error('QR 套件未載入');const scanner=state.scanner||new Html5Qrcode('reader');state.scanner=scanner;const raw=await scanner.scanFile(file,true);return raw?[raw]:[];}
async function detectQrCodesWithJsQrV9(file){await waitForJsQrV9();if(!window.jsQR)return[];const src=await readFile(file);const img=await loadImage(src);const base=document.createElement('canvas');const max=2200;const scale=Math.min(1,max/Math.max(img.width,img.height));base.width=Math.max(1,Math.round(img.width*scale));base.height=Math.max(1,Math.round(img.height*scale));const ctx=base.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,base.width,base.height);ctx.drawImage(img,0,0,base.width,base.height);const zones=qrZonesV9(base.width,base.height);const found=[];for(const z of zones){const c=document.createElement('canvas');c.width=z.w;c.height=z.h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(base,z.x,z.y,z.w,z.h,0,0,z.w,z.h);const data=x.getImageData(0,0,z.w,z.h);const code=jsQR(data.data,z.w,z.h,{inversionAttempts:'attemptBoth'});if(code&&code.data)found.push(code.data);}return sortQrCodesV9(unique(found));}
function qrZonesV9(w,h){const zones=[{x:0,y:0,w:w,h:h},{x:0,y:0,w:Math.ceil(w*0.58),h:h},{x:Math.floor(w*0.42),y:0,w:Math.ceil(w*0.58),h:h},{x:0,y:0,w:w,h:Math.ceil(h*0.62)},{x:0,y:Math.floor(h*0.18),w:w,h:Math.ceil(h*0.64)},{x:0,y:Math.floor(h*0.38),w:w,h:Math.ceil(h*0.62)}];return zones.filter(z=>z.w>80&&z.h>80);}
function waitForJsQrV9(){if(window.jsQR)return Promise.resolve();return new Promise(resolve=>{let tries=0;const t=setInterval(()=>{tries++;if(window.jsQR||tries>40){clearInterval(t);resolve();}},100);});}
function sortQrCodesV9(list){return unique(list).sort((a,b)=>qrScoreV9(b)-qrScoreV9(a));}
function qrScoreV9(v){const s=String(v||'').trim();let score=0;if(isTaiwanLeftQrV9(s))score+=1000;if(s.startsWith('**'))score+=200;if(/^[A-Z]{2}[0-9]{8}/.test(s))score+=120;score+=Math.min(s.length,220);return score;}
function isTaiwanLeftQrV9(raw){const s=String(raw||'').trim();return !s.startsWith('**')&&s.length>=77&&/^[A-Z]{2}[0-9]{8}/.test(s.slice(0,10));}`;
    html=html.replace(/async function scanQrFromPhoto\(e\)\{[\s\S]*?\nfunction handleQrScan/, qrPhoto+'\nfunction handleQrScan');

    const handleQr=String.raw`function handleQrScan(rawValue){const raw=String(rawValue||'').trim();if(!raw)return;const now=Date.now();if(raw===state.lastQr&&now-state.lastQrAt<1200)return;state.lastQr=raw;state.lastQrAt=now;if(raw.startsWith('**'))state.qrRight=raw;else if(isTaiwanLeftQrV9(raw)||!state.qrLeft)state.qrLeft=raw;renderQrState();const parsed=parseTaiwanInvoiceQr(state.qrLeft,state.qrRight);if(parsed){applyParsedInvoice(parsed);setStatus('QR 左碼已讀取，發票主資料已填入');return;}if(raw.startsWith('**'))setStatus('已讀到右碼。主資料需要左邊 QR。','warn');else setStatus('已讀到 QR，但還不是完整的台灣電子發票左碼。','warn');}`;
    html=html.replace(/function handleQrScan\(rawValue\)\{[\s\S]*?\nfunction clearQr/, handleQr+'\nfunction clearQr');

    const renderQr=String.raw`function renderQrState(){ $('qrLeft').textContent=state.qrLeft; $('qrRight').textContent=state.qrRight; const item=parseQrItems(state.qrLeft,state.qrRight); if(item){$('qrItems').textContent=item;applyQrItemsToNoteV9(item);}else if(state.qrLeft){$('qrItems').textContent='已讀取左碼；沒有可靠品項或品項未完整。';}else if(state.qrRight){$('qrItems').textContent='已讀取右碼；請再掃左碼。';}else{$('qrItems').textContent='尚未讀取';} }
function applyQrItemsToNoteV9(item){const note=$('note');if(!note||!item)return;const block='QR品項:\n'+item;const current=note.value.trim();const cleaned=current.replace(/(?:^|\n)QR品項:\n[\s\S]*$/,'').trim();note.value=cleaned?cleaned+'\n\n'+block:block;}`;
    html=html.replace(/function renderQrState\(\)\{[\s\S]*?\nfunction parseTaiwanInvoiceQr/, renderQr+'\nfunction parseTaiwanInvoiceQr');

    const qrParser=String.raw`function parseTaiwanInvoiceQr(left,right){if(!left||left.startsWith('**')||left.length<77)return null;const invoiceNo=left.slice(0,10).toUpperCase();if(!/^[A-Z]{2}[0-9]{8}$/.test(invoiceNo))return null;const total=hexAmount(left.slice(29,37));const money=moneyFromTaxIncludedV9(total);return{invoiceNo:invoiceNo,invoiceDate:rocToIso(left.slice(10,17)),sellerTaxId:cleanTaxId(left.slice(45,53)),buyerTaxId:cleanTaxId(left.slice(37,45)),totalAmount:money.totalAmount,untaxedAmount:money.untaxedAmount,taxAmount:money.taxAmount};}
function moneyFromTaxIncludedV9(total){const n=Number(total);if(!Number.isFinite(n)||n<=0)return{totalAmount:'',untaxedAmount:'',taxAmount:''};const untaxed=Math.floor(n/1.05);return{totalAmount:String(n),untaxedAmount:String(untaxed),taxAmount:String(n-untaxed)};}`;
    html=html.replace(/function parseTaiwanInvoiceQr\(left,right\)\{[\s\S]*?\nfunction parseQrItems/, qrParser+'\nfunction parseQrItems');

    const ocrParser=String.raw`function parseOcrText(text){const n=normalizeText(cleanOcrOutput(text));const lines=toLines(n);const invoiceNo=findInvoiceNo(n,lines);const sellerTaxId=parseSellerTaxIdV9(n,lines);const totalAmount=parseTotalV9(lines);const money=moneyFromTaxIncludedV9(totalAmount);return{invoiceNo:invoiceNo,invoiceDate:parseDateV9(lines),sellerName:parseSellerNameV9(lines,sellerTaxId),sellerTaxId:sellerTaxId,buyerTaxId:parseBuyerTaxIdV9(lines,sellerTaxId,invoiceNo),totalAmount:money.totalAmount,untaxedAmount:money.untaxedAmount,taxAmount:money.taxAmount};}
function parseSellerTaxIdV9(text,lines){for(const line of lines){if(/(NO|統編|統一編號|營業人|賣方|銷售人)/.test(line)){const ids=idsIn(line);if(ids.length)return ids[0];}}const all=idsIn(text);return all[0]||'';}
function parseBuyerTaxIdV9(lines,sellerTaxId,invoiceNo){for(const line of lines){if(/(買方|買受人|買受統編|客戶統編|客戶)/.test(line)){const ids=idsIn(line).filter(id=>id!==sellerTaxId&&id!==invoiceNo.slice(2));if(ids.length)return ids[0];}}return'';}
function parseDateV9(lines){for(const line of lines){const m=line.match(/([0-9]{3})\s*[\/.-]\s*([0-9]{1,2})\s*[\/.-]\s*([0-9]{1,2})/);if(m)return fmtDate(Number(m[1])+1911,m[2],m[3]);}return'';}
function parseSellerNameV9(lines,sellerTaxId){const banned=/(中華民國|收銀機|統一發票|電子發票|證明聯|收執聯|收據|明細|日期|發票號碼|隨機碼|統編|統一編號|總計|合計|金額|稅額|時間|TEL|電話|地址|QR|APP|NO)/;const idx=lines.findIndex(l=>sellerTaxId&&l.includes(sellerTaxId));if(idx>0){for(let i=idx-1;i>=0;i--){const l=lines[i];if(hasCjk(l)&&!banned.test(l)&&l.length>=2&&l.length<=30)return l;}}for(const l of lines){if(hasCjk(l)&&!banned.test(l)&&l.length>=2&&l.length<=30)return l;}return'';}
function parseTotalV9(lines){const labels=['總計','總金額','總額','合計','應付金額','應付','應收','實收','稅計','税計'];for(const line of lines){if(/(找零|累計|本次點|點數|投票|統編|統一編號|TEL|電話|NO)/.test(line)&&!/(總計|總金額|總額|合計|稅計|税計)/.test(line))continue;for(const label of labels){const idx=line.indexOf(label);if(idx<0)continue;let tail=line.slice(idx+label.length);const zero=tail.search(/找零/);if(zero>=0)tail=tail.slice(0,zero);const nums=moneyNumbers(tail).filter(n=>n>0&&n<1000000);if(nums.length)return String(nums[0]);}}const itemNums=[];for(const line of lines){if(hasCjk(line)&&!/(中華民國|發票|商行|TEL|時間|現金|找零|累計|本次點|點數|投票|稅計|税計|統編|NO)/.test(line)){const nums=moneyNumbers(line).filter(n=>n>0&&n<10000);if(nums.length)itemNums.push(nums[nums.length-1]);}}return itemNums.length?String(itemNums.reduce((a,b)=>a+b,0)):'';}`;
    html=html.replace(/function parseOcrText\(text\)\{[\s\S]*?\nfunction normalizeText/, ocrParser+'\nfunction normalizeText');
    html=html.replace(/function applyParsedInvoice\(parsed\)\{Object\.entries\(parsed\)\.forEach\(\(\[k,v\]\)=>\{if\(v!==''&&\$\(k\)\)\$\(k\)\.value=v;\}\);\}/,"function applyParsedInvoice(parsed){Object.entries(parsed).forEach(([k,v])=>{if($(k))$(k).value=v;});if(window.recalcInvoiceMoneyV9)window.recalcInvoiceMoneyV9();}");

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    msg.className='error';
    msg.textContent='v9 載入失敗：' + (err && err.message ? err.message : err);
  }
})();
</script>
</body>
</html>
