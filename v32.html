<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描 v32</title>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:760px;margin:40px auto;padding:20px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(22,33,38,.08)}.err{color:#b91c1c;white-space:pre-wrap}</style>
</head>
<body>
<div class="box" id="loader">正在載入 v32：先試 Gemini 3.1 Flash Lite Preview...</div>
<script>
(async function(){
  const loader=document.getElementById('loader');
  function mustReplace(html,from,to,label){const next=html.replace(from,to);if(next===html)throw new Error('v32 補丁失敗：'+label);return next;}
  try{
    let html=await fetch('v28.html?base='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀不到 v28.html，HTTP '+r.status);return r.text();});
    html=html.replaceAll('發票記帳掃描 v28','發票記帳掃描 v32');
    html=html.replace('v28 將偏暗點陣字再壓黑，背景與銳化沿用 v27。','v32 自動先試 Gemini 3.1 Flash Lite Preview；若 API 還不能用，會自動退回其他可用模型。');
    html=mustReplace(html,
      '<div class="setup-row" style="margin-top:10px"><input id="apiToken" placeholder="GAS API token"><input id="visionKey" placeholder="Gemini API key"></div><div class="hint">需要重設時，在網址後加 <code>?setup=1</code>。QR 掃描不花 Gemini 額度。</div>',
      '<div class="setup-row" style="margin-top:10px"><input id="apiToken" placeholder="GAS API token"><input id="visionKey" placeholder="Gemini API key"></div><div class="setup-row" style="margin-top:10px"><select id="geminiModel"><option value="auto">自動：3.1 Preview → 3.1 → 2.5 Lite → 2.5 Flash</option><option value="gemini-3.1-flash-lite-preview">Gemini 3.1 Flash Lite Preview</option><option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option><option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite：備用</option><option value="gemini-2.5-flash">Gemini 2.5 Flash：備用較準</option></select></div><div class="hint">v32 會優先使用 <code>gemini-3.1-flash-lite-preview</code>。不需要新增模型或換金鑰。需要重設時，在網址後加 <code>?setup=1</code>。QR 掃描不花 Gemini 額度。</div>',
      '設定區模型選單');
    html=mustReplace(html,
      "function loadSettings(){const url=localStorage.getItem('gas-url')||'';const token=localStorage.getItem('invoice-api-token')||'';const gemini=localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';$('gasUrl').value=url;$('apiToken').value=token;$('visionKey').value=gemini;const forceSetup=new URLSearchParams(location.search).has('setup');$('setupPanel').classList.toggle('hidden-ready',Boolean(url&&token&&gemini&&!forceSetup));}",
      "function loadSettings(){const url=localStorage.getItem('gas-url')||'';const token=localStorage.getItem('invoice-api-token')||'';const gemini=localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';const model=localStorage.getItem('gemini-model')||'auto';$('gasUrl').value=url;$('apiToken').value=token;$('visionKey').value=gemini;$('geminiModel').value=model;const forceSetup=new URLSearchParams(location.search).has('setup');$('setupPanel').classList.toggle('hidden-ready',Boolean(url&&token&&gemini&&!forceSetup));}",
      'loadSettings');
    html=mustReplace(html,
      "function saveSettings(){const url=$('gasUrl').value.trim();const token=$('apiToken').value.trim();const gemini=$('visionKey').value.trim();if(!(url.startsWith('https://script.google.com/macros/s/')&&url.endsWith('/exec'))){setStatus('請貼上 Apps Script /exec 結尾網址','error');return;}if(token.length<20){setStatus('請貼上 GAS API token','error');return;}if(gemini.length<20){setStatus('請貼上 Gemini API key','error');return;}localStorage.setItem('gas-url',url);localStorage.setItem('invoice-api-token',token);localStorage.setItem('gemini-api-key',gemini);localStorage.removeItem('vision-api-key');$('setupPanel').classList.add('hidden-ready');setStatus('已記住 GAS 與 Gemini 設定');}",
      "function saveSettings(){const url=$('gasUrl').value.trim();const token=$('apiToken').value.trim();const gemini=$('visionKey').value.trim();const model=$('geminiModel').value||'auto';if(!(url.startsWith('https://script.google.com/macros/s/')&&url.endsWith('/exec'))){setStatus('請貼上 Apps Script /exec 結尾網址','error');return;}if(token.length<20){setStatus('請貼上 GAS API token','error');return;}if(gemini.length<20){setStatus('請貼上 Gemini API key','error');return;}localStorage.setItem('gas-url',url);localStorage.setItem('invoice-api-token',token);localStorage.setItem('gemini-api-key',gemini);localStorage.setItem('gemini-model',model);localStorage.removeItem('vision-api-key');$('setupPanel').classList.add('hidden-ready');setStatus('已記住 GAS 與 Gemini 設定');}",
      'saveSettings');
    html=mustReplace(html,
      "function getGasUrl(){return localStorage.getItem('gas-url')||'';}function getApiToken(){return localStorage.getItem('invoice-api-token')||'';}function getGeminiKey(){return localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';}",
      "function getGasUrl(){return localStorage.getItem('gas-url')||'';}function getApiToken(){return localStorage.getItem('invoice-api-token')||'';}function getGeminiKey(){return localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';}function getGeminiModel(){return localStorage.getItem('gemini-model')||'auto';}",
      'getGeminiModel');
    html=mustReplace(html,
      "const key=getGeminiKey();if(!key){setStatus('請先到設定填 Gemini API key','error');$('setupPanel').classList.remove('hidden-ready');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setProgress(12);setStatus('Gemini 正在看發票...');try{const result=await callGeminiInvoice(state.imageData,key);",
      "const key=getGeminiKey();const model=getGeminiModel();if(!key){setStatus('請先到設定填 Gemini API key','error');$('setupPanel').classList.remove('hidden-ready');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setProgress(12);setStatus(`Gemini 正在用 ${model==='auto'?'自動模式':model} 看發票...`);try{const result=await callGeminiInvoice(state.imageData,key,model);",
      'runGeminiOcr model');
    html=mustReplace(html,
      'async function callGeminiInvoice(dataUrl,key){const base64=',
      "async function callGeminiInvoice(dataUrl,key,model){model=model||'auto';const base64=",
      'callGeminiInvoice signature');
    html=mustReplace(html,
      "const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.error)throw new Error((json.error&&json.error.message)||('HTTP '+res.status));const text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;if(!text)throw new Error('Gemini 沒有回傳文字');return JSON.parse(String(text).replace(/^\x60\x60\x60(?:json)?\s*/,'').replace(/\s*\x60\x60\x60$/,'').trim());",
      "const candidates=model==='auto'?['gemini-3.1-flash-lite-preview','gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-2.5-flash']:[model];let text='';let used='';let lastError='';for(const m of candidates){try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=`+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.error){lastError=(json.error&&json.error.message)||('HTTP '+res.status);continue;}text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;if(text){used=m;break;}lastError='Gemini 沒有回傳文字';}catch(err){lastError=err.message||String(err);}}if(!text)throw new Error(lastError||'所有 Gemini 模型都失敗');setStatus('Gemini 使用模型：'+used);return JSON.parse(String(text).replace(/^\x60\x60\x60(?:json)?\s*/,'').replace(/\s*\x60\x60\x60$/,'').trim());",
      'Gemini fallback loop');
    document.open();document.write(html);document.close();
  }catch(err){loader.className='box err';loader.textContent=(err&&err.stack)||String(err);}
})();
</script>
</body>
</html>
