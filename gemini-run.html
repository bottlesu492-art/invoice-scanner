<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gemini 發票判讀測試</title>
  <style>
    :root{--ink:#172126;--muted:#66757f;--line:#d9e1e5;--soft:#f4f7f8;--panel:#fff;--primary:#0f766e;--blue:#2563eb;--warn:#92400e;--danger:#b91c1c;--shadow:0 16px 36px rgba(22,33,38,.08)}
    *{box-sizing:border-box}body{margin:0;background:#eef3f4;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit}.app{max-width:980px;margin:0 auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}h1{margin:0;font-size:24px}.sub{margin:5px 0 0;color:var(--muted);line-height:1.5}.status{min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);line-height:1.45}.status.error{color:var(--danger);border-color:#fecaca;background:#fff7f7}.status.warn{color:var(--warn);border-color:#fde68a;background:#fffbeb}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:#fbfcfd}.head h2{margin:0;font-size:18px}.body{padding:15px}.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{min-height:44px;padding:0 15px;border:0;border-radius:8px;background:#e7eef1;color:var(--ink);font-weight:800;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}.btn:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.grid{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}.photo{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--soft);object-fit:contain}.raw{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfd;resize:vertical}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:800;color:#35464e}input,select,textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}input[readonly]{background:#f5f7f8;color:#40515a}.hint{color:var(--muted);line-height:1.6;margin:0 0 12px}.progress{height:8px;border-radius:999px;background:#dde7ea;overflow:hidden;margin-top:12px}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));transition:width .16s}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e7f5f2;color:#0f766e;font-size:12px;font-weight:800}@media(max-width:820px){.top,.grid{display:block}.status{margin-top:10px}.app{padding:12px}.body{padding:12px}.head{padding:12px}.fields{grid-template-columns:1fr}.actions .btn{flex:1 1 150px}.photo{margin-bottom:14px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><h1>Gemini 發票判讀測試</h1><p class="sub">直接把原色照片交給 Gemini 看圖判斷欄位。這頁不會改 v9，也不會寫入試算表。</p></div>
    <div id="status" class="status">先設定 Gemini API key，然後拍照或選照片。</div>
  </header>

  <section id="setupPanel" class="panel">
    <div class="head"><h2>Gemini API key</h2><button id="clearKey" class="btn ghost" type="button">清除</button></div>
    <div class="body">
      <p class="hint">這個 key 只存在這台手機/電腦的瀏覽器 localStorage，不會寫進 GitHub。請用 Google AI Studio / Gemini API 的 key。</p>
      <div class="actions"><input id="geminiKey" placeholder="貼上 Gemini API key"><button id="saveKey" class="btn primary" type="button">記住</button></div>
    </div>
  </section>

  <section class="panel">
    <div class="head"><h2>照片</h2><span class="pill">使用原圖</span></div>
    <div class="body">
      <p class="hint">你說原色照片給 Gemini 很準，所以這頁預設完全不做灰階、加深、銳化。Gemini 會自己看版面並回傳固定 JSON 欄位。</p>
      <div class="actions">
        <button id="cameraBtn" class="btn primary" type="button">拍照</button>
        <button id="albumBtn" class="btn" type="button">選相簿</button>
        <button id="runBtn" class="btn blue" type="button">Gemini 判讀</button>
        <input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment">
        <input id="albumInput" class="hidden" type="file" accept="image/*">
      </div>
      <div id="progress" class="progress hidden"><span></span></div>
    </div>
  </section>

  <section class="grid">
    <section class="panel"><div class="head"><h2>原圖</h2></div><div class="body"><img id="preview" class="photo" alt="發票照片"></div></section>
    <section class="panel">
      <div class="head"><h2>自動整理</h2></div>
      <div class="body fields">
        <div class="field"><label for="invoiceNo">發票號碼</label><input id="invoiceNo"></div>
        <div class="field"><label for="invoiceDate">日期</label><input id="invoiceDate"></div>
        <div class="field full"><label for="sellerName">賣方名稱</label><input id="sellerName"></div>
        <div class="field"><label for="sellerTaxId">賣方統編</label><input id="sellerTaxId"></div>
        <div class="field"><label for="buyerTaxId">買方統編</label><input id="buyerTaxId"></div>
        <div class="field"><label for="totalAmount">含稅總額</label><input id="totalAmount"></div>
        <div class="field"><label for="untaxedAmount">未稅金額</label><input id="untaxedAmount" readonly></div>
        <div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" readonly></div>
        <div class="field"><label for="category">費用類別</label><select id="category"><option value="">未分類</option><option>五金用品</option><option>加油</option><option>停車費</option><option>餐費</option><option>文具</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option></select></div>
        <div class="field"><label for="confidence">信心</label><input id="confidence" readonly></div>
        <div class="field full"><label for="note">備註</label><textarea id="note"></textarea></div>
      </div>
    </section>
  </section>

  <section class="panel">
    <div class="head"><h2>Gemini 回傳 JSON</h2></div>
    <div class="body"><textarea id="rawJson" class="raw" placeholder="Gemini JSON"></textarea></div>
  </section>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);
const state={file:null,imageData:'',mimeType:'image/jpeg'};
const fields=['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','untaxedAmount','taxAmount','category','confidence','note'];
$('cameraBtn').addEventListener('click',()=>$('cameraInput').click());
$('albumBtn').addEventListener('click',()=>$('albumInput').click());
$('cameraInput').addEventListener('change',loadPhoto);
$('albumInput').addEventListener('change',loadPhoto);
$('runBtn').addEventListener('click',runGemini);
$('saveKey').addEventListener('click',saveKey);
$('clearKey').addEventListener('click',clearKey);
$('totalAmount').addEventListener('input',recalcMoney);
loadKey();

function loadKey(){const key=localStorage.getItem('gemini-api-key')||'';$('geminiKey').value=key;$('setupPanel').classList.toggle('hidden',Boolean(key)&&!new URLSearchParams(location.search).has('setup'));}
function saveKey(){const key=$('geminiKey').value.trim();if(key.length<20){setStatus('請貼上 Gemini API key。','error');return;}localStorage.setItem('gemini-api-key',key);$('setupPanel').classList.add('hidden');setStatus('Gemini API key 已記住。');}
function clearKey(){localStorage.removeItem('gemini-api-key');$('geminiKey').value='';$('setupPanel').classList.remove('hidden');setStatus('已清除 Gemini API key。');}
async function loadPhoto(e){const file=e.target.files&&e.target.files[0];if(!file)return;state.file=file;state.mimeType=file.type||'image/jpeg';state.imageData=await resizeForGemini(file);$('preview').src=state.imageData;setStatus('照片已載入，按「Gemini 判讀」。');e.target.value='';}
async function resizeForGemini(file){const src=await readFile(file);const img=await loadImage(src);const max=1800;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,c.width,c.height);state.mimeType='image/jpeg';return c.toDataURL('image/jpeg',0.92);}
async function runGemini(){
  const key=localStorage.getItem('gemini-api-key')||'';
  if(!key){$('setupPanel').classList.remove('hidden');setStatus('請先貼上 Gemini API key。','error');return;}
  if(!state.imageData){setStatus('請先拍照或選照片。','error');return;}
  $('runBtn').disabled=true;showProgress(10);setStatus('Gemini 正在看發票...');
  try{
    const result=await callGemini(key,state.imageData,state.mimeType);
    showProgress(80);
    $('rawJson').value=JSON.stringify(result,null,2);
    applyResult(result);
    showProgress(100);
    setStatus('Gemini 判讀完成。請檢查欄位，錯的先手改。');
  }catch(err){setStatus('Gemini 失敗：'+(err&&err.message?err.message:err),'error');}
  finally{$('runBtn').disabled=false;setTimeout(()=>showProgress(0),600);}
}
async function callGemini(key,dataUrl,mimeType){
  const base64=String(dataUrl).replace(/^data:image\/[a-zA-Z0-9.+-]+;base64,/,'');
  const prompt=[
    '你是台灣公司記帳助理。請仔細閱讀照片中的台灣發票、收銀機統一發票、傳統紙本發票或電子發票列印紙。',
    '請只根據照片可見資訊填欄位，不要編造。看不清楚或沒有標示就填空字串。',
    '日期若是民國年，請轉成西元 YYYY/MM/DD。例：115/02/15 轉 2026/02/15。',
    '發票號碼格式為兩個英文字母加八個數字，例如 VW32017096。',
    '賣方統編通常在 NO、統編、營業人附近。買方統編只有明確標示買方、買受人、客戶統編時才填；不要把交易流水號、隨機碼、時間旁數字填成買方統編。',
    '含稅總額請抓實際交易總計/合計/總計/稅計後面的金額，不要抓現金、找零、累計點、本次點、電話、地址、流水號。',
    '未稅金額與稅額可依含稅總額用台灣 5% 營業稅反推：未稅=floor(含稅總額/1.05)，稅額=含稅總額-未稅。',
    '費用類別只能選：五金用品、加油、停車費、餐費、文具、設備、軟體、交際、其他、未分類。',
    '備註請放品項摘要，每行一個品項，含單價或金額更好。'
  ].join('\n');
  const schema={
    type:'OBJECT',
    properties:{
      invoiceNo:{type:'STRING'}, invoiceDate:{type:'STRING'}, sellerName:{type:'STRING'}, sellerTaxId:{type:'STRING'}, buyerTaxId:{type:'STRING'},
      totalAmount:{type:'INTEGER'}, untaxedAmount:{type:'INTEGER'}, taxAmount:{type:'INTEGER'}, category:{type:'STRING'}, note:{type:'STRING'}, confidence:{type:'STRING'}, warnings:{type:'ARRAY',items:{type:'STRING'}}
    },
    required:['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','untaxedAmount','taxAmount','category','note','confidence','warnings'],
    propertyOrdering:['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','untaxedAmount','taxAmount','category','note','confidence','warnings']
  };
  const body={contents:[{parts:[{text:prompt},{inlineData:{mimeType:mimeType||'image/jpeg',data:base64}}]}],generationConfig:{temperature:0,responseMimeType:'application/json',responseSchema:schema}};
  const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const json=await res.json().catch(()=>({}));
  if(!res.ok||json.error)throw new Error((json.error&&json.error.message)||('HTTP '+res.status));
  const text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;
  if(!text)throw new Error('Gemini 沒有回傳文字');
  return JSON.parse(stripCodeFence(text));
}
function applyResult(r){
  const total=Number(r.totalAmount)||0;
  const untaxed=total>0?Math.floor(total/1.05):(Number(r.untaxedAmount)||0);
  const tax=total>0?total-untaxed:(Number(r.taxAmount)||0);
  const data={...r,totalAmount:total||'',untaxedAmount:untaxed||'',taxAmount:tax||'',note:buildNote(r)};
  fields.forEach(id=>{if($(id))$(id).value=data[id]==null?'':String(data[id]);});
}
function buildNote(r){const lines=[];if(r.note)lines.push(String(r.note).trim());if(Array.isArray(r.warnings)&&r.warnings.length)lines.push('提醒:\n'+r.warnings.join('\n'));return lines.filter(Boolean).join('\n\n');}
function recalcMoney(){const n=Number(String($('totalAmount').value||'').replace(/,/g,'').trim());if(!Number.isFinite(n)||n<=0){$('untaxedAmount').value='';$('taxAmount').value='';return;}const untaxed=Math.floor(n/1.05);$('untaxedAmount').value=String(untaxed);$('taxAmount').value=String(n-untaxed);}
function stripCodeFence(text){return String(text||'').replace(/^```(?:json)?\s*/,'').replace(/\s*```$/,'').trim();}
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function setStatus(msg,type){const el=$('status');el.textContent=msg;el.classList.remove('error','warn');if(type)el.classList.add(type);}
function showProgress(v){const box=$('progress');const bar=box.querySelector('span');if(v<=0){box.classList.add('hidden');bar.style.width='0';return;}box.classList.remove('hidden');bar.style.width=Math.max(0,Math.min(100,v))+'%';}
})();
</script>
</body>
</html>
