<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OCR 強化測試</title>
  <style>
    :root{--ink:#172126;--muted:#66757f;--line:#d9e1e5;--soft:#f4f7f8;--panel:#fff;--primary:#0f766e;--blue:#2563eb;--warn:#92400e;--danger:#b91c1c;--shadow:0 16px 36px rgba(22,33,38,.08)}
    *{box-sizing:border-box}body{margin:0;background:#eef3f4;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}button,input,textarea{font:inherit}.app{max-width:900px;margin:0 auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}h1{margin:0;font-size:24px}.sub{margin:5px 0 0;color:var(--muted);line-height:1.5}.status{min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);line-height:1.45}.status.error{color:var(--danger);border-color:#fecaca;background:#fff7f7}.status.warn{color:var(--warn);border-color:#fde68a;background:#fffbeb}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}.head{padding:13px 15px;border-bottom:1px solid var(--line);background:#fbfcfd}.head h2{margin:0;font-size:18px}.body{padding:15px}.actions{display:flex;flex-wrap:wrap;gap:10px}.btn{min-height:44px;padding:0 15px;border:0;border-radius:8px;background:#e7eef1;color:var(--ink);font-weight:800;cursor:pointer}.btn.primary{background:var(--primary);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.photo{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--soft);object-fit:contain}.raw{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfd;resize:vertical}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:800;color:#35464e}input,textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}input[readonly]{background:#f5f7f8;color:#40515a}.params{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.param{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}.param span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.hint{color:var(--muted);line-height:1.6;margin:0 0 12px}.progress{height:8px;border-radius:999px;background:#dde7ea;overflow:hidden;margin-top:12px}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));transition:width .16s}@media(max-width:720px){.top{display:block}.status{margin-top:10px}.grid,.fields,.params{grid-template-columns:1fr}.app{padding:12px}.body{padding:12px}.head{padding:12px}.actions .btn{flex:1 1 150px}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><h1>OCR 強化測試</h1><p class="sub">這頁只測紙本發票 OCR，不會改 v9，也不會寫入試算表。</p></div>
    <div id="status" class="status">先拍照或選照片。</div>
  </header>

  <section class="panel">
    <div class="head"><h2>照片</h2></div>
    <div class="body">
      <p class="hint">按「強化並辨識」時，送到 Cloud Vision 的是右邊強化圖，不是原圖。API key 會沿用 v9 裡已經存過的 Cloud Vision key。</p>
      <div class="actions">
        <button id="cameraBtn" class="btn primary" type="button">拍照</button>
        <button id="albumBtn" class="btn" type="button">選相簿</button>
        <button id="runBtn" class="btn blue" type="button">強化並辨識</button>
        <input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment">
        <input id="albumInput" class="hidden" type="file" accept="image/*">
      </div>
      <div id="progress" class="progress hidden"><span></span></div>
    </div>
  </section>

  <section class="grid">
    <section class="panel"><div class="head"><h2>原圖</h2></div><div class="body"><img id="original" class="photo" alt="原圖"></div></section>
    <section class="panel"><div class="head"><h2>強化圖</h2></div><div class="body"><img id="enhanced" class="photo" alt="強化圖"></div></section>
  </section>

  <section class="panel">
    <div class="head"><h2>目前參數</h2></div>
    <div class="body">
      <div class="params">
        <div class="param">放大 <b>1</b><span>避免手機處理太慢</span></div>
        <div class="param">對比 <b>0.8</b><span>淡字不會被吃掉</span></div>
        <div class="param">字加深 <b>2.8</b><span>讓點陣字更明顯</span></div>
        <div class="param">亮部保留 <b>1</b><span>白底保留細節</span></div>
        <div class="param">銳化 <b>1.6</b><span>加強邊緣</span></div>
        <div class="param">局部範圍 <b>5</b><span>看附近亮度調字</span></div>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="head"><h2>OCR 原文</h2></div>
    <div class="body"><textarea id="ocrText" class="raw" placeholder="Cloud Vision 回傳文字"></textarea></div>
  </section>

  <section class="panel">
    <div class="head"><h2>自動整理</h2></div>
    <div class="body fields">
      <div class="field"><label for="invoiceNo">發票號碼</label><input id="invoiceNo"></div>
      <div class="field"><label for="invoiceDate">日期</label><input id="invoiceDate"></div>
      <div class="field full"><label for="sellerName">賣方名稱</label><input id="sellerName"></div>
      <div class="field"><label for="sellerTaxId">賣方統編</label><input id="sellerTaxId"></div>
      <div class="field"><label for="buyerTaxId">買方統編</label><input id="buyerTaxId"></div>
      <div class="field"><label for="totalAmount">含稅總額</label><input id="totalAmount"></div>
      <div class="field"><label for="untaxedAmount">未稅金額</label><input id="untaxedAmount" readonly></div>
      <div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" readonly></div>
      <div class="field full"><label for="note">備註</label><textarea id="note"></textarea></div>
    </div>
  </section>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);
const state={file:null,originalData:'',enhancedData:''};
const params={scale:1,contrast:.8,ink:2.8,highlight:1,sharp:1.6,local:5};
$('cameraBtn').addEventListener('click',()=>$('cameraInput').click());
$('albumBtn').addEventListener('click',()=>$('albumInput').click());
$('cameraInput').addEventListener('change',loadPhoto);
$('albumInput').addEventListener('change',loadPhoto);
$('runBtn').addEventListener('click',runOcr);
$('totalAmount').addEventListener('input',recalcMoney);

async function loadPhoto(e){
  const file=e.target.files&&e.target.files[0];
  if(!file)return;
  state.file=file;
  state.originalData=await readFile(file);
  $('original').src=state.originalData;
  $('enhanced').removeAttribute('src');
  state.enhancedData='';
  setStatus('照片已載入，按「強化並辨識」。');
  e.target.value='';
}
async function runOcr(){
  if(!state.file){setStatus('請先拍照或選照片。','error');return;}
  const key=localStorage.getItem('vision-api-key')||'';
  if(!key){setStatus('找不到 Cloud Vision API key。請先回 v9 的設定貼上 key 並按記住。','error');return;}
  $('runBtn').disabled=true;showProgress(10);
  try{
    setStatus('正在產生強化圖...');
    state.enhancedData=await enhanceReceiptImage(state.file);
    $('enhanced').src=state.enhancedData;
    showProgress(35);
    setStatus('正在送 Cloud Vision OCR...');
    const text=await callVisionApi(state.enhancedData,key);
    showProgress(80);
    const cleaned=cleanOcrOutput(text);
    $('ocrText').value=cleaned;
    const parsed=parseOcrText(cleaned);
    applyParsed(parsed);
    showProgress(100);
    setStatus('OCR 完成。請看自動整理欄位，錯的先手改，之後我們再調規則。');
  }catch(err){
    setStatus('OCR 失敗：'+(err&&err.message?err.message:err),'error');
  }finally{
    $('runBtn').disabled=false;
    setTimeout(()=>showProgress(0),600);
  }
}
async function enhanceReceiptImage(file){
  const src=await readFile(file);
  const img=await loadImage(src);
  const scale=fitScale(img,params.scale);
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.width*scale));
  c.height=Math.max(1,Math.round(img.height*scale));
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(img,0,0,c.width,c.height);
  const data=ctx.getImageData(0,0,c.width,c.height);
  enhancePixels(data);
  ctx.putImageData(data,0,0);
  return c.toDataURL('image/jpeg',0.92);
}
function fitScale(img,base){const long=Math.max(img.width,img.height);return Math.min(base,2400/long)||1;}
function enhancePixels(imageData){
  const d=imageData.data,w=imageData.width,h=imageData.height,len=w*h;
  const gray=new Uint8ClampedArray(len),hist=new Uint32Array(256);
  for(let i=0,px=0;i<d.length;i+=4,px++){const g=Math.round(d[i]*.299+d[i+1]*.587+d[i+2]*.114);gray[px]=g;hist[g]++;}
  const lo=percentile(hist,len,.01),hi=Math.max(lo+50,percentile(hist,len,.995));
  const norm=new Uint8ClampedArray(len);
  for(let px=0;px<len;px++){let v=(gray[px]-lo)*245/(hi-lo)+8;v=(v-128)*params.contrast+128;norm[px]=clamp(v);}
  const r=params.local;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const idx=y*w+x;let sum=0,count=0;
    for(let yy=-r;yy<=r;yy++){const ny=y+yy;if(ny<0||ny>=h)continue;for(let xx=-r;xx<=r;xx++){const nx=x+xx;if(nx<0||nx>=w)continue;sum+=norm[ny*w+nx];count++;}}
    const local=sum/count;let v=norm[idx];const darker=Math.max(0,local-v);
    if(darker>3)v-=darker*params.ink;
    if(x>0&&x<w-1&&y>0&&y<h-1){const blur=(norm[idx-1]+norm[idx+1]+norm[idx-w]+norm[idx+w])/4;v+=(norm[idx]-blur)*params.sharp;}
    if(v>235)v=235+(v-235)*params.highlight;
    v=clamp(v);const i=idx*4;d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255;
  }
}
function percentile(hist,total,pct){let target=Math.max(1,Math.floor(total*pct)),sum=0;for(let i=0;i<hist.length;i++){sum+=hist[i];if(sum>=target)return i;}return 255;}
function clamp(v){return v<0?0:v>255?255:Math.round(v);}
async function callVisionApi(dataUrl,key){
  const content=String(dataUrl).replace(/^data:image\/[a-zA-Z0-9.+-]+;base64,/,'');
  const body={requests:[{image:{content},features:[{type:'DOCUMENT_TEXT_DETECTION',maxResults:1}],imageContext:{languageHints:['zh-Hant','en']}}]};
  const res=await fetch('https://vision.googleapis.com/v1/images:annotate?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const json=await res.json().catch(()=>({}));
  if(!res.ok||json.error)throw new Error((json.error&&json.error.message)||('HTTP '+res.status));
  const one=json.responses&&json.responses[0];
  if(!one)throw new Error('沒有 OCR 回傳');
  if(one.error)throw new Error(one.error.message||'Vision 回傳錯誤');
  return (one.fullTextAnnotation&&one.fullTextAnnotation.text)||(one.textAnnotations&&one.textAnnotations[0]&&one.textAnnotations[0].description)||'';
}
function parseOcrText(text){
  const n=normalizeText(text),lines=toLines(n);
  const invoiceNo=findInvoiceNo(n,lines);
  const sellerTaxId=findSellerTaxId(n,lines,invoiceNo);
  const totalAmount=findTotalAmount(lines);
  const money=moneyFromTaxIncluded(totalAmount);
  return {invoiceNo,invoiceDate:findDate(lines),sellerName:findSellerName(lines,sellerTaxId),sellerTaxId,buyerTaxId:findBuyerTaxId(lines,sellerTaxId,invoiceNo),totalAmount:money.totalAmount,untaxedAmount:money.untaxedAmount,taxAmount:money.taxAmount,note:makeNote(lines)};
}
function applyParsed(p){Object.entries(p).forEach(([k,v])=>{if($(k))$(k).value=v||'';});recalcMoney();}
function recalcMoney(){const n=Number(String($('totalAmount').value||'').replace(/,/g,'').trim());if(!Number.isFinite(n)||n<=0){$('untaxedAmount').value='';$('taxAmount').value='';return;}const untaxed=Math.floor(n/1.05);$('untaxedAmount').value=String(untaxed);$('taxAmount').value=String(n-untaxed);}
function moneyFromTaxIncluded(v){const n=Number(v);if(!Number.isFinite(n)||n<=0)return{totalAmount:'',untaxedAmount:'',taxAmount:''};const untaxed=Math.floor(n/1.05);return{totalAmount:String(n),untaxedAmount:String(untaxed),taxAmount:String(n-untaxed)};}
function findInvoiceNo(text,lines){for(const line of lines){const m=line.match(/([A-Z]{2})\s*([0-9]{8})/);if(m)return m[1]+m[2];}const m=removeSpaces(text).match(/([A-Z]{2})([0-9]{8})/);return m?m[1]+m[2]:'';}
function findDate(lines){for(const line of lines){const m=line.match(/([0-9]{3})\s*[\/.-]\s*([0-9]{1,2})\s*[\/.-]\s*([0-9]{1,2})/);if(m)return fmtDate(Number(m[1])+1911,m[2],m[3]);}return'';}
function findSellerTaxId(text,lines,invoiceNo){for(const line of lines){if(/(NO|統編|統一編號|營業人|賣方|銷售人)/.test(line)){const ids=idsIn(line,invoiceNo);if(ids.length)return ids[0];}}const all=idsIn(text,invoiceNo);return all[0]||'';}
function findBuyerTaxId(lines,sellerTaxId,invoiceNo){for(const line of lines){if(/(買方|買受人|買受統編|客戶統編|客戶)/.test(line)){const ids=idsIn(line,invoiceNo).filter(id=>id!==sellerTaxId);if(ids.length)return ids[0];}}return'';}
function findSellerName(lines,sellerTaxId){const banned=/(中華民國|收銀機|統一發票|電子發票|證明聯|收執聯|日期|發票號碼|統編|統一編號|總計|合計|金額|稅額|時間|TEL|電話|地址|NO|QR|APP)/;const idx=lines.findIndex(l=>sellerTaxId&&l.includes(sellerTaxId));if(idx>0){for(let i=idx-1;i>=0;i--){const l=lines[i];if(hasCjk(l)&&!banned.test(l)&&l.length>=2&&l.length<=30)return l;}}
  for(const l of lines){if(hasCjk(l)&&!banned.test(l)&&l.length>=2&&l.length<=30)return l;}return'';}
function findTotalAmount(lines){
  const labels=['總計','總金額','總額','合計','應付金額','應付','應收','實收','稅計','稅後'];
  for(const line of lines){
    const hasTotal=/(總計|總金額|總額|合計|稅計|稅後|應付|應收|實收)/.test(line);
    if(!hasTotal)continue;
    let cut=line.replace(/找零.*/,'');
    const nums=moneyNumbers(cut).filter(n=>n>0&&n<1000000);
    if(nums.length)return String(nums[0]);
  }
  const itemNums=[];
  for(const line of lines){
    if(/(中華民國|發票|商行|TEL|時間|現金|找零|累計|本次點|點數|投票|統編|NO)/.test(line))continue;
    if(!hasCjk(line))continue;
    const nums=moneyNumbers(line).filter(n=>n>0&&n<10000);
    if(nums.length)itemNums.push(nums[nums.length-1]);
  }
  return itemNums.length?String(itemNums.reduce((a,b)=>a+b,0)):'';
}
function makeNote(lines){const items=[];for(const line of lines){if(/(元|個|包|盒|瓶|罐|張|本)/.test(line)&&!/(中華民國|發票|時間|現金|找零|總計|稅計|累計|本次點)/.test(line))items.push(line);}return items.length?'OCR品項:\n'+items.join('\n'):'';}
function cleanOcrOutput(text){return toLines(normalizeText(text)).map(l=>l.trim()).filter(l=>l&&!isNoiseLine(l)).join('\n');}
function normalizeText(t){return String(t||'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[：]/g,':').replace(/[－]/g,'-').toUpperCase();}
function isNoiseLine(line){const compact=removeSpaces(line);if(compact.length<=1)return true;if(/^[A-Z ]{4,}$/.test(line)&&!hasCjk(line)&&!/[0-9]/.test(line))return true;return false;}
function toLines(t){return String(t||'').replace(/\r/g,'\n').split('\n').map(s=>s.trim()).filter(Boolean);}
function idsIn(t,invoiceNo){const out=[];const re=/[0-9]{8}/g;let m;while((m=re.exec(t))){const id=m[0];if(id==='00000000')continue;if(invoiceNo&&id===invoiceNo.slice(2))continue;out.push(id);}return [...new Set(out)];}
function moneyNumbers(t){const out=[];const re=/[0-9][0-9,]{0,8}/g;let m;while((m=re.exec(t))){const n=Number(m[0].replace(/,/g,''));if(Number.isFinite(n))out.push(n);}return out;}
function removeSpaces(s){return String(s||'').replace(/\s/g,'');}
function hasCjk(s){return /[\u4e00-\u9fff]/.test(String(s||''));}
function fmtDate(y,m,d){return y+'/'+String(m).padStart(2,'0')+'/'+String(d).padStart(2,'0');}
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function setStatus(msg,type){const el=$('status');el.textContent=msg;el.classList.remove('error','warn');if(type)el.classList.add(type);}
function showProgress(v){const box=$('progress');const bar=box.querySelector('span');if(v<=0){box.classList.add('hidden');bar.style.width='0';return;}box.classList.remove('hidden');bar.style.width=Math.max(0,Math.min(100,v))+'%';}
})();
</script>
</body>
</html>
