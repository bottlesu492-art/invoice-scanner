<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描</title>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:760px;margin:40px auto;padding:20px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(22,33,38,.08)}.err{color:#b91c1c;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box" id="loader">正在載入發票記帳掃描...</div>
<script>
(async function(){
  const loader=document.getElementById('loader');
  try{
    let page=await fetch('v49.html?base='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀不到 v49.html，HTTP '+r.status);return r.text();});
    page=page.replaceAll('發票記帳掃描 v49','發票記帳掃描');
    page=page.replace('正在載入 v49：商家記憶 + 超廣角 OCR...','正在載入發票記帳掃描...');
    page=page.replace('v49 會記住常用商家，辨識後可自動補正店名、統編與類別；所有欄位仍可手改。','');

    const payerPatches = String.raw`
    html=html.replace('vendors:[],vendorLoaded:false,ocrStream:null','vendors:[],vendorLoaded:false,payers:[],buyerTaxIds:[],settingsLoaded:false,ocrStream:null');
    html=html.replace('document.addEventListener(\'DOMContentLoaded\',init);',"if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();");
    html=html.replace('loadVendors();bindSaveHintRefresh();','loadVendors();loadInvoiceSettings();bindSaveHintRefresh();');
    html=html.replace("setStatus('已記住 GAS 與 Gemini 設定');","setStatus('已記住 GAS 與 Gemini 設定');loadVendors(true);loadInvoiceSettings(true);");
    html=html.replace('<label for="payer">付款人</label><input id="payer">','<label for="payer">付款人</label><select id="payer"><option value="">未選擇</option></select>');
    html=html.replace('applyData(parsed);setTimeout(handleVendorAfterQr,0);const item','applyData(parsed);autoFillBuyerTaxIdFromText(state.qrLeft+"\\n"+state.qrRight);setTimeout(handleVendorAfterQr,0);const item');
    html=html.replace("'你是台灣公司記帳助理。請讀取照片中的台灣發票或收銀機統一發票，只輸出 JSON。'","'你是台灣公司記帳助理。請讀取照片中的台灣發票或收銀機統一發票，只輸出 JSON。',((state.buyerTaxIds&&state.buyerTaxIds.length)?'已知買方統編清單：'+state.buyerTaxIds.join('、')+'。如果照片中出現其中任一組 8 碼，buyerTaxId 請填入該組統編。':'' )");
    html=html.replace("const candidates=model==='auto'?['gemini-3.1-flash-lite-preview','gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-2.5-flash']:[model];","const candidates=model==='auto'?['gemini-3.1-flash-lite-preview']:[model];");
    html=html.replace("throw new Error(lastError||'所有 Gemini 模型都失敗');","throw new Error(lastError||'Gemini 3.1 Flash Lite Preview 失敗，已停止，不會改用 2.5 額度');");
    html=html.replace('function setupMoneySync(){',"function loadInvoiceSettings(force=false){const url=getGasUrl();const token=getApiToken();if(!url||!token){return Promise.resolve(false);}if(state.settingsLoading&&!force)return state.settingsLoading;state.settingsLoading=postFrame(url,{token,action:'settingsFrame',targetOrigin:location.origin},'invoice-settings').then(res=>{if(res&&res.ok){state.payers=Array.isArray(res.payers)?res.payers:[];state.buyerTaxIds=Array.isArray(res.buyerTaxIds)?res.buyerTaxIds.map(v=>String(v||'').replace(/\\D/g,'')).filter(v=>v.length===8):[];state.settingsLoaded=true;setupPayerInput();autoFillBuyerTaxIdFromText(collectKnownText());return true;}state.settingsLoaded=false;setStatus('付款人/買方統編名單讀取失敗：'+((res&&res.error)||'GAS 沒有回傳 settings'),'warn');return false;}).catch(err=>{state.settingsLoaded=false;setStatus('付款人/買方統編名單讀取失敗：'+(err.message||err),'warn');return false;}).finally(()=>{state.settingsLoading=null;});return state.settingsLoading;}function setupPayerInput(){const payer=$('payer');if(!payer)return;const current=payer.value;payer.innerHTML='<option value=\"\">未選擇</option>';state.payers.forEach(name=>{const opt=document.createElement('option');opt.value=name;opt.textContent=name;payer.appendChild(opt);});payer.value=state.payers.includes(current)?current:'';}function collectKnownText(){return [state.qrLeft,state.qrRight,state.ocrText,$('note')&&$('note').value,$('buyerTaxId')&&$('buyerTaxId').value].join('\\n');}function autoFillBuyerTaxIdFromText(text){const current=String($('buyerTaxId').value||'').replace(/\\D/g,'');if(current.length===8)return;const hay=String(text||'');const hit=(state.buyerTaxIds||[]).find(id=>id&&hay.includes(id));if(hit){$('buyerTaxId').value=hit;if(window.recalcMoney)window.recalcMoney();setSaveStatus('確認後寫入試算表');}}function setupMoneySync(){");
`;
    const extraPatches = String.raw`
    html=html.replace(/<h1>發票記帳掃描 v49<\/h1><p>[\s\S]*?<\/p>/,'<h1>發票記帳掃描</h1>');
    html=html.replace(/<div class="brand"><h1>([\s\S]*?)<\/h1><p>[\s\S]*?<\/p><\/div>/,'<div class="brand"><h1>$1</h1></div>');
    html=html.replace(/<div class="hint">[\s\S]*?<\/div>/g,'');
    html=html.replace('</style>','.confirm-status{margin:0 0 12px 0;max-width:none}.save-status{margin:0 0 10px;color:#64727a;font-size:13px;line-height:1.45}.save-status.error{color:#b91c1c}.save-status.ok{color:#0f766e}</style>');
    html=replaceRegex(html,/<header class="topbar"><div class="brand">([\s\S]*?)<\/div><div id="status" class="status">待命<\/div><\/header>/,"<header class=\"topbar\"><div class=\"brand\">$1</div></header>",'move status header');
    html=replaceRegex(html,/(<aside class="panel"><div class="panel-head"><h2>確認資料<\/h2><button[^>]*>清空<\/button><\/div><div class="panel-body">)<form/,"$1<div id=\"status\" class=\"status confirm-status\">待命</div><form",'insert status near form');
    html=html.replace('<div class="savebar"><span id="saveHint">確認後寫入試算表</span><button id="saveInvoice" class="btn primary" type="button">儲存</button></div>','<div id="saveStatus" class="save-status">確認後寫入試算表</div><div class="savebar"><span id="saveHint"></span><button id="saveInvoice" class="btn primary" type="button">儲存</button></div>');
    html=replaceRegex(html,/function init\(\)\{bindEvents\(\);loadSettings\(\);setupMoneySync\(\);renderRecent\(loadRecent\(\)\);loadVendors\(\);\}/,"function init(){bindEvents();loadSettings();setupMoneySync();renderRecent(loadRecent());loadVendors();bindSaveHintRefresh();}",'init save hint refresh');
    html=replaceRegex(html,/function loadVendors\(\)\{[\s\S]*?\}function jsonp/,"function bindSaveHintRefresh(){const form=$('invoiceForm');if(!form)return;form.querySelectorAll('input,select,textarea').forEach(el=>{el.addEventListener('input',()=>{setSaveStatus('確認後寫入試算表');});el.addEventListener('change',()=>{setSaveStatus('確認後寫入試算表');});});}function loadVendors(force=false){const url=getGasUrl();const token=getApiToken();if(!url||!token){state.vendorLoaded=false;setStatus('尚未設定 GAS 或 token，無法讀商家資料庫','warn');return Promise.resolve(false);}if(state.vendorLoading&&!force)return state.vendorLoading;state.vendorLoading=postFrame(url,{token,action:'vendorsFrame',targetOrigin:location.origin},'invoice-vendors').then(res=>{if(res&&res.ok&&Array.isArray(res.vendors)){state.vendors=res.vendors;state.vendorLoaded=true;setStatus('已讀取商家資料庫：'+state.vendors.length+' 筆');return true;}state.vendorLoaded=false;setStatus('商家資料庫讀取失敗：'+((res&&res.error)||'GAS 沒有回傳 vendors'),'warn');return false;}).catch(err=>{state.vendorLoaded=false;setStatus('商家資料庫讀取失敗：'+(err.message||err),'warn');return false;}).finally(()=>{state.vendorLoading=null;});return state.vendorLoading;}function postFrame(baseUrl,fields,expectedType){return new Promise((resolve,reject)=>{const id='post_frame_'+Date.now()+'_'+Math.floor(Math.random()*100000);const frame=document.createElement('iframe');frame.name=id;frame.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;border:0;';const form=document.createElement('form');form.method='POST';form.action=baseUrl;form.target=id;form.style.display='none';Object.entries(fields||{}).forEach(([name,value])=>{const el=document.createElement('input');el.type='hidden';el.name=name;el.value=String(value==null?'':value);form.appendChild(el);});const timer=setTimeout(()=>{cleanup();reject(new Error('GAS 回覆逾時，請確認部署版本'));},15000);function cleanup(){clearTimeout(timer);window.removeEventListener('message',onMessage);form.remove();frame.remove();}function onMessage(ev){const data=ev.data;if(!data||data.type!==expectedType)return;cleanup();resolve(data);}window.addEventListener('message',onMessage);document.body.appendChild(frame);document.body.appendChild(form);form.submit();});}function jsonp",'post vendor loader');
    html=html.replace('applyData(parsed);const item=parseQrItems(state.qrLeft,state.qrRight);','applyData(parsed);setTimeout(handleVendorAfterQr,0);const item=parseQrItems(state.qrLeft,state.qrRight);');
    html=replaceRegex(html,/function handleVendorAfterOcr\(\)\{[\s\S]*?\}function offerAddVendor/,"async function handleVendorAfterOcr(){if(!($('sellerName').value||$('sellerTaxId').value))return;if(!state.vendorLoaded){const loaded=await loadVendors(true);if(!loaded){setStatus('商家資料庫還沒讀到，這次先不做常用商家判斷','warn');return;}}const match=findVendorMatch();if(match){applyVendor(match);return;}offerAddVendor();}async function handleVendorAfterQr(){const tax=String($('sellerTaxId').value||'').replace(/\\D/g,'');if(!tax)return;if(!state.vendorLoaded){const loaded=await loadVendors(true);if(!loaded){setStatus('QR 已填資料，但商家資料庫還沒讀到，店名/類別暫不補正','warn');return;}}const match=findVendorMatch();if(match){applyVendor(match);setStatus('QR 已讀取，並已套用商家資料庫：'+(match.sellerName||match.sellerTaxId));}}function offerAddVendor",'ocr qr vendor reload');
    html=replaceRegex(html,/function setupMoneySync\(\)/,"async function ensureVendorBeforeSave(){const tax=String($('sellerTaxId').value||'').replace(/\\D/g,'');const name=String($('sellerName').value||'').trim();if(!tax&&!name)return true;if(!state.vendorLoaded){const loaded=await loadVendors(true);if(!loaded){setStatus('商家資料庫還沒讀到，先只儲存發票，不新增常用商家','warn');return true;}}if(tax&&state.vendors&&state.vendors.length){const byTax=state.vendors.find(v=>String(v.sellerTaxId||'').replace(/\\D/g,'')===tax);if(byTax){applyVendor(byTax);return true;}}const match=findVendorMatch();if(match){applyVendor(match);return true;}return confirmAddVendorBeforeSave();}function confirmAddVendorBeforeSave(){const currentName=$('sellerName').value.trim();const currentTax=$('sellerTaxId').value.trim();const ok=confirm('商家資料庫沒有目前這組店名/統編。要加入常用商家嗎？\\n\\n你可以先改正店名、統編和費用類別，之後同店家會自動帶入。');if(!ok)return true;const sellerName=prompt('正確賣方名稱',currentName)||'';const sellerTaxId=prompt('正確賣方統編',currentTax)||'';const category=prompt('預設費用類別',$('category').value||'')||'';const keywords=prompt('店名關鍵字，用逗號分隔',sellerName||currentName)||'';const vendor={sellerName:sellerName.trim(),sellerTaxId:sellerTaxId.replace(/\\D/g,''),category:category.trim(),keywords:keywords.trim()};if(!vendor.sellerName&&!vendor.sellerTaxId)return true;applyVendor(vendor);state.vendors.push(vendor);state.vendorLoaded=true;addVendorRemote(vendor);return true;}function setupMoneySync()",'vendor before save helpers');
    html=replaceRegex(html,/async function saveInvoice\(\)\{const payload=buildPayload\(\);[\s\S]*?finally\{\$\('saveInvoice'\)\.disabled=false;\}\}/,"function setSaveStatus(msg,type){const el=$('saveStatus')||$('saveHint');if(!el)return;el.textContent=msg;el.classList&&el.classList.remove('error','ok');if(type&&el.classList)el.classList.add(type);}async function saveInvoice(){if(!(await ensureVendorBeforeSave()))return;const payload=buildPayload();if(!payload.invoiceNo&&!payload.totalAmount){setSaveStatus('請至少填發票號碼或含稅金額','error');return;}const url=getGasUrl();const token=getApiToken();if(!url||!token){setSaveStatus('缺少 GAS /exec 網址或 API token','error');$('setupPanel').classList.remove('hidden-ready');return;}const sendPayload={sourceType:payload.sourceType,status:payload.status,invoiceNo:payload.invoiceNo,invoiceDate:payload.invoiceDate,sellerTaxId:payload.sellerTaxId,buyerTaxId:payload.buyerTaxId,totalAmount:payload.totalAmount,untaxedAmount:payload.untaxedAmount,taxAmount:payload.taxAmount,category:payload.category,payer:payload.payer,note:payload.note};$('saveInvoice').disabled=true;setSaveStatus('正在送到 Apps Script...');try{const res=await postFrame(url,{token,action:'saveInvoiceFrame',targetOrigin:location.origin,payloadJson:JSON.stringify(sendPayload)},'invoice-save');if(!res.ok)throw new Error(res.error||'GAS 拒絕寫入');saveLocal(sendPayload);setSaveStatus('已送出，寫入第 '+res.row+' 列','ok');renderRecent(loadRecent());}catch(e){setSaveStatus('儲存失敗：'+(e.message||e),'error');}finally{$('saveInvoice').disabled=false;}}",'save with response');
`;
    page=page.replace('    html=patchGeminiFunction(html);', extraPatches + payerPatches + '    html=patchGeminiFunction(html);');

    document.open();
    document.write(page);
    document.close();
  }catch(err){
    loader.className='box err';
    loader.textContent=(err&&err.stack)||String(err);
  }
})();
</script>
</body>
</html>
