<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>發票記帳掃描</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    :root{--ink:#172126;--muted:#66757f;--line:#d9e1e5;--soft:#f4f7f8;--panel:#fff;--primary:#0f766e;--blue:#2563eb;--danger:#b91c1c;--shadow:0 16px 36px rgba(22,33,38,.08)}
    *{box-sizing:border-box}body{margin:0;background:#eef3f4;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:1120px;margin:0 auto;padding:16px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}.status{max-width:520px;min-height:38px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:#fbfcfd}.panel-head h2{margin:0;font-size:17px}.panel-body{padding:15px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#dfe8eb;border-radius:8px;margin-bottom:14px}.tab{min-height:40px;border-radius:6px;background:transparent;color:#39505a;font-weight:700}.tab.active{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(22,33,38,.08)}.mode{display:none}.mode.active{display:block}.reader{min-height:310px;border:1px dashed #aebdc5;border-radius:8px;background:#0f171a;overflow:hidden}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.btn{min-height:42px;padding:0 14px;border-radius:8px;background:#e7eef1;color:var(--ink);font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.warn{background:#fef3c7;color:#7c2d12}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.raw{min-height:38px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:#33444c;font-family:Consolas,Menlo,monospace;font-size:12px;overflow-wrap:anywhere}.small-label{margin-top:12px;color:var(--muted);font-size:13px;font-weight:750}.preview-wrap{display:grid;grid-template-columns:160px minmax(0,1fr);gap:14px;align-items:start}.preview{width:100%;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;background:var(--soft);object-fit:contain}.ocr-text{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfd}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:750;color:#35464e}input,select,textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.16)}.savebar{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;margin:15px -15px -15px;padding:13px 15px;border-top:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}.savebar span{color:var(--muted);font-size:13px}.recent-list{display:grid;gap:8px}.recent-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}.recent-title{font-weight:800;overflow-wrap:anywhere}.recent-meta{color:var(--muted);font-size:12px}.amount{color:#115e59;font-weight:850;white-space:nowrap}.progress{height:8px;border-radius:999px;background:#dde7ea;overflow:hidden;margin-top:10px}.progress span{display:block;width:0%;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));transition:width .16s}.hidden{display:none!important}@media(max-width:920px){.layout{grid-template-columns:1fr}.topbar{display:block}.status{max-width:none;margin-top:10px}}@media(max-width:560px){.app{padding:12px}.brand h1{font-size:21px}.panel-body{padding:12px}.panel-head{padding:12px}.reader{min-height:260px}.preview-wrap,.form-grid{grid-template-columns:1fr}.savebar{align-items:stretch;flex-direction:column;margin:14px -12px -12px;padding:12px}.savebar .btn{width:100%}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><h1>發票記帳掃描</h1><p>GitHub Pages + Google Apps Script</p></div><div id="status" class="status">待命</div></header>
    <section class="layout"><div class="panel"><div class="panel-head"><h2>輸入來源</h2></div><div class="panel-body"><nav class="tabs"><button class="tab active" data-mode="qr" type="button">QR</button><button class="tab" data-mode="ocr" type="button">OCR</button><button class="tab" data-mode="manual" type="button">手動</button></nav><section id="mode-qr" class="mode active"><div id="reader" class="reader"></div><div class="actions"><button id="liveQr" class="btn primary" type="button">即時掃描</button><button id="qrCamera" class="btn ghost" type="button">拍照掃 QR</button><button id="qrAlbum" class="btn ghost" type="button">選相簿 QR</button><button id="stopQr" class="btn ghost" type="button" disabled>停止</button><input id="qrCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="qrAlbumInput" class="hidden" type="file" accept="image/*"><button id="clearQr" class="btn warn" type="button">清除 QR</button></div><div class="small-label">左碼</div><div id="qrLeft" class="raw"></div><div class="small-label">右碼</div><div id="qrRight" class="raw"></div><div class="small-label">品項</div><div id="qrItems" class="raw"></div></section><section id="mode-ocr" class="mode"><div class="actions"><button id="ocrCamera" class="btn primary" type="button">拍照辨識</button><button id="ocrAlbum" class="btn ghost" type="button">選相簿辨識</button><button id="runOcr" class="btn blue" type="button">辨識文字</button><input id="ocrCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="ocrAlbumInput" class="hidden" type="file" accept="image/*"></div><div class="progress hidden" id="ocrProgress"><span></span></div><div class="preview-wrap" style="margin-top:14px"><img id="preview" class="preview" alt=""><textarea id="ocrText" class="ocr-text" placeholder="OCR 原文"></textarea></div></section><section id="mode-manual" class="mode"><div class="actions"><button id="manualCamera" class="btn primary" type="button">拍照附圖</button><button id="manualAlbum" class="btn ghost" type="button">選相簿附圖</button><input id="manualCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="manualAlbumInput" class="hidden" type="file" accept="image/*"></div><div class="preview-wrap" style="margin-top:14px"><img id="manualPreview" class="preview" alt=""><div class="raw">手動建立資料時，也可以附上發票照片。</div></div></section></div></div><aside class="panel"><div class="panel-head"><h2>確認資料</h2><button id="resetForm" class="btn ghost" type="button">清空</button></div><div class="panel-body"><form id="invoiceForm" class="form-grid"><div class="field"><label for="invoiceNo">發票號碼</label><input id="invoiceNo" maxlength="10" placeholder="AB12345678"></div><div class="field"><label for="invoiceDate">日期</label><input id="invoiceDate" type="date"></div><div class="field full"><label for="sellerName">賣方名稱</label><input id="sellerName"></div><div class="field"><label for="sellerTaxId">賣方統編</label><input id="sellerTaxId" inputmode="numeric" maxlength="8"></div><div class="field"><label for="buyerTaxId">買方統編</label><input id="buyerTaxId" inputmode="numeric" maxlength="8"></div><div class="field"><label for="totalAmount">總金額</label><input id="totalAmount" inputmode="decimal"></div><div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" inputmode="decimal"></div><div class="field"><label for="category">費用類別</label><select id="category"><option value="">未分類</option><option>交通</option><option>餐費</option><option>文具</option><option>郵資</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option></select></div><div class="field"><label for="payer">付款人</label><input id="payer"></div><div class="field full"><label for="project">專案 / 部門</label><input id="project"></div><div class="field full"><label for="note">備註</label><textarea id="note"></textarea></div></form><div class="savebar"><span id="saveHint">確認後寫入試算表</span><button id="saveInvoice" class="btn primary" type="button">儲存</button></div></div></aside></section><section class="panel" style="margin-top:16px"><div class="panel-head"><h2>最近儲存</h2><button id="refreshRecent" class="btn ghost" type="button">重新整理</button></div><div class="panel-body"><div id="recentList" class="recent-list"></div></div></section>
  </main>
<script>
const DEFAULT_GAS_URL='https://script.google.com/macros/s/AKfycbzzMQAZGkKTLwQfVctseKg7lFSY2TJBiyKL2tVNwIG74ZFJxOs78f6L0yDbmM4I6wXl/exec';
const state={mode:'qr',sourceType:'QR',qrLeft:'',qrRight:'',imageData:'',imageName:'',ocrText:'',scanner:null,scanning:false,lastQr:'',lastQrAt:0};
const fieldIds=['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','taxAmount','category','payer','project','note'];
const $=id=>document.getElementById(id);
document.addEventListener('DOMContentLoaded',()=>{bindEvents();renderRecent(loadRecent());});
function bindEvents(){document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('liveQr').addEventListener('click',startQrScanner);$('qrCamera').addEventListener('click',()=>$('qrCameraInput').click());$('qrAlbum').addEventListener('click',()=>$('qrAlbumInput').click());$('stopQr').addEventListener('click',stopQrScanner);$('qrCameraInput').addEventListener('change',scanQrFromPhoto);$('qrAlbumInput').addEventListener('change',scanQrFromPhoto);$('clearQr').addEventListener('click',clearQr);$('ocrCamera').addEventListener('click',()=>$('ocrCameraInput').click());$('ocrAlbum').addEventListener('click',()=>$('ocrAlbumInput').click());$('ocrCameraInput').addEventListener('change',handlePhotoInput);$('ocrAlbumInput').addEventListener('change',handlePhotoInput);$('manualCamera').addEventListener('click',()=>$('manualCameraInput').click());$('manualAlbum').addEventListener('click',()=>$('manualAlbumInput').click());$('manualCameraInput').addEventListener('change',handleManualPhotoInput);$('manualAlbumInput').addEventListener('change',handleManualPhotoInput);$('runOcr').addEventListener('click',runOcr);$('ocrText').addEventListener('input',()=>state.ocrText=$('ocrText').value);$('saveInvoice').addEventListener('click',saveInvoice);$('resetForm').addEventListener('click',resetAll);$('refreshRecent').addEventListener('click',()=>renderRecent(loadRecent()));}
function setMode(mode){state.mode=mode;state.sourceType=mode==='qr'?'QR':mode==='ocr'?'OCR':'手動';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.mode').forEach(s=>s.classList.remove('active'));$(`mode-${mode}`).classList.add('active');if(mode!=='qr')stopQrScanner();setStatus(mode==='qr'?'QR 模式':mode==='ocr'?'OCR 模式':'手動模式');}
async function startQrScanner(){if(!window.Html5Qrcode){setStatus('QR 套件未載入','error');return;}if(state.scanning)return;try{const opt=window.Html5QrcodeSupportedFormats?{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]}:undefined;state.scanner=state.scanner||new Html5Qrcode('reader',opt);setStatus('正在開啟相機...');$('liveQr').disabled=true;$('stopQr').disabled=true;await state.scanner.start({facingMode:'environment'},{fps:8,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*.72);return{width:s,height:s};}},handleQrScan,()=>{});state.scanning=true;$('stopQr').disabled=false;setStatus('掃描中');}catch(e){$('liveQr').disabled=false;$('stopQr').disabled=true;setStatus(`無法啟動相機：${e.message||e}`,'error');}}
async function stopQrScanner(){if(!state.scanner||!state.scanning)return;try{await state.scanner.stop();}catch(e){setStatus(`停止掃描失敗：${e.message||e}`,'error');}finally{state.scanning=false;$('liveQr').disabled=false;$('stopQr').disabled=true;}}
async function scanQrFromPhoto(e){const file=e.target.files&&e.target.files[0];if(!file)return;if(!window.Html5Qrcode){setStatus('QR 套件未載入','error');return;}try{await stopQrScanner();state.imageData=await resizeImage(file);state.imageName=file.name;const scanner=state.scanner||new Html5Qrcode('reader');state.scanner=scanner;setStatus('照片 QR 辨識中');const raw=await scanner.scanFile(file,true);handleQrScan(raw);setStatus('已從照片讀取 QR');}catch(err){setStatus(`照片裡沒有讀到 QR：${err.message||err}`,'error');}finally{e.target.value='';}}
function handleQrScan(raw){const now=Date.now();if(raw===state.lastQr&&now-state.lastQrAt<1200)return;state.lastQr=raw;state.lastQrAt=now;if(raw.startsWith('**'))state.qrRight=raw;else state.qrLeft=raw;renderQrState();const parsed=parseTaiwanInvoiceQr(state.qrLeft,state.qrRight);if(parsed){applyParsedInvoice(parsed);setStatus(state.qrRight?'QR 左右碼已讀取':'QR 左碼已讀取');}else setStatus('已讀取 QR，等待另一個碼或手動確認');}
function clearQr(){state.qrLeft='';state.qrRight='';$('qrLeft').textContent='';$('qrRight').textContent='';$('qrItems').textContent='';setStatus('QR 已清除');}
function renderQrState(){$('qrLeft').textContent=state.qrLeft;$('qrRight').textContent=state.qrRight;}
function parseTaiwanInvoiceQr(left,right){if(!left||left.length<77||left.startsWith('**'))return null;const sales=hexAmount(left.slice(21,29));const total=hexAmount(left.slice(29,37));const item=parseQrItems(left,right);return{invoiceNo:left.slice(0,10),invoiceDate:rocToIso(left.slice(10,17)),sellerTaxId:left.slice(45,53).replace(/^0{8}$/,''),buyerTaxId:left.slice(37,45).replace(/^0{8}$/,''),totalAmount:total,taxAmount:sales&&total?Math.max(0,total-sales):'',itemSummary:item};}
function parseQrItems(left,right){let tail=left.slice(77);if(right)tail+=right.startsWith('**')?right.slice(2):right;const m=tail.match(/^:?([^:]*):([^:]*):([^:]*):([^:]*):(.*)$/s);if(!m)return'';let txt=m[5]||'';if(m[4]==='2')txt=decodeBase64Utf8(txt);const p=txt.replace(/^:/,'').split(':').filter(Boolean);const out=[];for(let i=0;i+2<p.length;i+=3)out.push(`${p[i]} x${p[i+1]} $${p[i+2]}`);return out.join('；');}
function hexAmount(v){return/^[0-9a-f]{8}$/i.test(v)?parseInt(v,16):'';}function rocToIso(v){if(!/^\d{7}$/.test(v))return'';return`${Number(v.slice(0,3))+1911}-${v.slice(3,5)}-${v.slice(5,7)}`;}function decodeBase64Utf8(v){try{const b=atob(v.replace(/\s/g,''));return new TextDecoder('utf-8').decode(Uint8Array.from(b,c=>c.charCodeAt(0)));}catch(e){return v;}}
async function handlePhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;state.imageData=await resizeImage(file);state.imageName=file.name;$('preview').src=state.imageData;setStatus('照片已載入');e.target.value='';}
async function handleManualPhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;state.imageData=await resizeImage(file);state.imageName=file.name;$('manualPreview').src=state.imageData;setStatus('照片已載入');e.target.value='';}
async function resizeImage(file){const src=await readFile(file);const img=await loadImage(src);const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.84);}function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function runOcr(){if(!state.imageData){setStatus('請先拍照或選相簿照片','error');return;}if(!window.Tesseract){setStatus('OCR 套件未載入','error');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setStatus('OCR 辨識中');try{const r=await Tesseract.recognize(state.imageData,'chi_tra+eng',{logger:m=>{if(m.status==='recognizing text')setProgress(m.progress||0);}});state.ocrText=r.data.text||'';$('ocrText').value=state.ocrText;applyParsedInvoice(parseOcrText(state.ocrText));setStatus(`OCR 完成，信心值 ${Math.round(r.data.confidence||0)}%`);}catch(e){setStatus(`OCR 失敗：${e.message||e}`,'error');}finally{$('runOcr').disabled=false;setProgress(0);$('ocrProgress').classList.add('hidden');}}
function setProgress(v){$('ocrProgress').querySelector('span').style.width=`${Math.max(0,Math.min(100,Math.round(v*100)))}%`;}
function parseOcrText(text){const n=normalizeText(text);const lines=n.split(/\n+/).map(s=>s.trim()).filter(Boolean);const inv=n.match(/([A-Z]{2})\s*-?\s*(\d{8})/i);const roc=n.match(/(\d{3})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/);const ad=n.match(/(20\d{2})\s*[年\/.\-]\s*(\d{1,2})\s*[月\/.\-]\s*(\d{1,2})/);const ids=[...n.matchAll(/\b\d{8}\b/g)].map(m=>m[0]);return{invoiceNo:inv?`${inv[1]}${inv[2]}`.toUpperCase():'',invoiceDate:roc?fmtDate(Number(roc[1])+1911,roc[2],roc[3]):ad?fmtDate(ad[1],ad[2],ad[3]):'',sellerName:findSeller(lines),sellerTaxId:ids[0]||'',buyerTaxId:ids[1]||'',totalAmount:findTotal(n)};}
function normalizeText(t){return String(t||'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xfee0)).replace(/[，]/g,',').replace(/[：]/g,':').replace(/[－]/g,'-');}
function findTotal(t){const ps=[/(?:總計|總額|總金額|合計|應付金額|應付)\D{0,12}([0-9][0-9,]*)/g,/(?:NT\$|NTD|\$)\s*([0-9][0-9,]*)/gi];for(const p of ps){const ms=[...t.matchAll(p)].map(m=>Number(m[1].replace(/,/g,''))).filter(Number.isFinite);if(ms.length)return Math.max(...ms);}return'';}function findSeller(lines){const b=/(電子發票|統一發票|證明聯|收據|明細|日期|發票號碼|隨機碼|統編|總計|合計|金額)/;return lines.find(l=>/[\u4e00-\u9fff]/.test(l)&&!b.test(l)&&l.length<=28)||'';}function fmtDate(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function applyParsedInvoice(parsed){Object.entries(parsed).forEach(([k,v])=>{if(k==='itemSummary'){if(v){$('qrItems').textContent=v;if(!$('note').value)$('note').value=v;}return;}if(v!==''&&$(k))$(k).value=v;});}
function buildPayload(){const p={};fieldIds.forEach(id=>p[id]=$(id).value.trim());p.sourceType=state.sourceType;p.status='已確認';p.qrLeft=state.qrLeft;p.qrRight=state.qrRight;p.ocrText=state.ocrText||$('ocrText').value;p.imageData=state.imageData;p.imageName=state.imageName;return p;}
async function saveInvoice(){const payload=buildPayload();if(!payload.invoiceNo&&!payload.totalAmount){setStatus('請至少填發票號碼或總金額','error');return;}$('saveInvoice').disabled=true;setStatus('儲存中');try{await fetch(DEFAULT_GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({payload})});saveLocal(payload);$('saveHint').textContent='已送出到 Apps Script';setStatus('已送出。請到 Google Sheet 確認資料。');renderRecent(loadRecent());}catch(e){setStatus(`送出失敗：${e.message||e}`,'error');}finally{$('saveInvoice').disabled=false;}}
function saveLocal(p){const rows=loadRecent();rows.unshift({createdAt:new Date().toLocaleString('zh-TW'),...p});localStorage.setItem('invoice-recent',JSON.stringify(rows.slice(0,50)));}function loadRecent(){try{return JSON.parse(localStorage.getItem('invoice-recent')||'[]');}catch(e){return[];}}
function renderRecent(rows){const list=$('recentList');list.innerHTML='';if(!rows.length){list.innerHTML='<div class="raw">尚無資料</div>';return;}rows.slice(0,8).forEach(r=>{const d=document.createElement('div');d.className='recent-item';d.innerHTML=`<div><div class="recent-title">${esc(r.invoiceNo||'未填發票號碼')}</div><div class="recent-meta">${esc(r.invoiceDate||r.createdAt||'')} ${esc(r.sellerName||r.sellerTaxId||'')}</div></div><div class="amount">$${esc(r.totalAmount||'')}</div>`;list.appendChild(d);});}
function resetAll(){fieldIds.forEach(id=>$(id).value='');state.imageData='';state.imageName='';state.ocrText='';$('ocrText').value='';$('preview').removeAttribute('src');$('manualPreview').removeAttribute('src');clearQr();setStatus('已清空');}
function setStatus(msg,type){$('status').textContent=msg;$('status').style.color=type==='error'?'var(--danger)':'var(--muted)';}function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
</script>
</body>
</html>
