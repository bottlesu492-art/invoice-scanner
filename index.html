<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>發票記帳掃描</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script><style>body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1120px;margin:auto;padding:16px}.topbar{margin-bottom:14px}.brand h1{margin:0;font-size:24px}.panel{background:#fff;border:1px solid #d9e1e5;border-radius:8px;box-shadow:0 14px 34px rgba(22,33,38,.08);overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #d9e1e5;background:#fbfcfd}.panel-head h2{margin:0;font-size:17px}.panel-body{padding:15px}.setup{margin-bottom:16px}.setup.hidden-ready{display:none}.setup-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#dfe8eb;border-radius:8px;margin-bottom:14px}.tab{min-height:40px;border:0;border-radius:6px;background:transparent;color:#39505a;font-weight:700}.tab.active{background:#fff;color:#172126;box-shadow:0 4px 12px rgba(22,33,38,.08)}.mode{display:none}.mode.active{display:block}.reader{min-height:300px;border:1px dashed #aebdc5;border-radius:8px;background:#0f171a;overflow:hidden}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;justify-content:flex-end}.btn{min-height:42px;padding:0 14px;border:0;border-radius:8px;background:#e7eef1;color:#172126;font-weight:700}.btn.primary{background:#0f766e;color:#fff}.btn.blue{background:#2563eb;color:#fff}.btn.warn{background:#fef3c7;color:#7c2d12}.btn.ghost{background:#fff;color:#64727a;border:1px solid #d9e1e5}.raw{min-height:38px;padding:9px 10px;border:1px solid #d9e1e5;border-radius:8px;background:#f4f7f8;color:#33444c;font-family:Consolas,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}.small-label{margin-top:12px;color:#64727a;font-size:13px;font-weight:750}.preview-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:14px}.preview{width:100%;max-width:460px;margin-left:auto;aspect-ratio:3/4;border:1px solid #d9e1e5;border-radius:8px;background:#f4f7f8;object-fit:contain}.ocr-text{display:none}.doc-type{display:flex;gap:8px;margin-bottom:12px}.doc-type label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;color:#39505a}.doc-type input{width:auto;min-height:auto}.split-panel{display:none;grid-column:1/-1;border:1px solid #d9e1e5;border-radius:8px;background:#fbfcfd;overflow:hidden}.split-panel.active{display:block}.split-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #d9e1e5;font-weight:800}.split-list{display:grid;gap:8px;padding:10px 12px}.split-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.split-row button{min-height:38px;padding:0}.split-summary{padding:9px 12px;border-top:1px solid #d9e1e5;color:#64727a;font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:750;color:#35464e}input,select,textarea{width:100%;min-height:42px;border:1px solid #d9e1e5;border-radius:8px;padding:9px 10px;background:#fff;color:#172126;box-sizing:border-box}textarea{min-height:82px;resize:vertical}input[readonly]{background:#f4f7f8;color:#61717a}.status{min-height:38px;margin:0 0 12px;padding:9px 12px;border:1px solid #d9e1e5;border-radius:8px;background:#fff}.status.error{color:#b91c1c;background:#fff7f7;border-color:#fecaca}.status.warn{color:#92400e;background:#fffbeb;border-color:#fde68a}.save-status{margin:0 0 10px;color:#64727a;font-size:13px}.save-status.error{color:#b91c1c}.save-status.ok{color:#0f766e}.savebar{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;margin:15px -15px -15px;padding:13px 15px;border-top:1px solid #d9e1e5;background:rgba(255,255,255,.94)}.recent-list{display:grid;gap:8px}.recent-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px;border:1px solid #d9e1e5;border-radius:8px;background:#fbfcfd}.recent-title{font-weight:800;overflow-wrap:anywhere}.recent-meta{color:#64727a}.amount{color:#115e59;font-weight:850}.progress{height:8px;border-radius:999px;background:#dde7ea;overflow:hidden;margin-top:10px}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#0f766e,#2563eb)}.hidden{display:none!important}@media(max-width:920px){.layout{grid-template-columns:1fr}}@media(max-width:560px){.app{padding:12px}.form-grid,.setup-row{grid-template-columns:1fr}.savebar{flex-direction:column}.reader{min-height:250px}.savebar .btn,.setup-row .btn{width:100%}}</style></head><body><main class="app"><header class="topbar"><div class="brand"><h1>發票記帳掃描</h1></div></header><section id="setupPanel" class="panel setup"><div class="panel-head"><h2>管理員啟用</h2></div><div class="panel-body"><div class="setup-row"><input id="apiToken" placeholder="請輸入管理員 token"><button id="saveBackend" class="btn primary" type="button">啟用</button></div><input id="gasUrl" class="hidden" type="hidden"></div></section><section class="layout"><div class="panel"><div class="panel-head"><h2>輸入來源</h2></div><div class="panel-body"><nav class="tabs"><button class="tab active" data-mode="qr" type="button">QR</button><button class="tab" data-mode="ocr" type="button">OCR</button><button class="tab" data-mode="manual" type="button">手動</button></nav><section id="mode-qr" class="mode active"><div id="reader" class="reader"></div><div class="actions"><button id="clearQr" class="btn warn" type="button">清除 QR</button><button id="stopQr" class="btn ghost" type="button" disabled>停止</button><button id="liveQr" class="btn primary" type="button">即時掃描</button></div><div class="small-label">左碼</div><div id="qrLeft" class="raw"></div><div class="small-label">右碼</div><div id="qrRight" class="raw"></div><div class="small-label">QR 品項 / 狀態</div><div id="qrItems" class="raw">尚未讀取</div></section><section id="mode-ocr" class="mode"><div class="doc-type"><label><input type="radio" name="documentType" value="invoice" checked>有發票號碼</label><label><input type="radio" name="documentType" value="noInvoice">無發票號碼</label></div><div class="progress hidden" id="ocrProgress"><span></span></div><div class="preview-wrap"><video id="ocrVideo" class="preview hidden" playsinline muted style="object-fit:cover;background:#111;cursor:pointer"></video><img id="preview" class="preview" alt=""><textarea id="ocrText" class="ocr-text"></textarea></div><div class="actions"><button id="ocrAlbum" class="btn ghost" type="button">選相簿辨識</button><button id="runOcr" class="btn blue" type="button">Gemini 判讀</button><button id="ocrCamera" class="btn primary" type="button">拍照辨識</button><input id="ocrCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="ocrAlbumInput" class="hidden" type="file" accept="image/*"></div></section><section id="mode-manual" class="mode"><div class="actions"><button id="manualCamera" class="btn primary" type="button">拍照附圖</button><button id="manualAlbum" class="btn ghost" type="button">選相簿附圖</button><input id="manualCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="manualAlbumInput" class="hidden" type="file" accept="image/*"></div><div class="preview-wrap"><img id="manualPreview" class="preview" alt=""></div></section></div></div><aside class="panel"><div class="panel-head"><h2>確認資料</h2><button id="resetForm" class="btn ghost" type="button">清空</button></div><div class="panel-body"><div id="status" class="status warn">尚未輸入 token</div><form id="invoiceForm" class="form-grid"><div class="field"><label for="invoiceNo">發票號碼</label><input id="invoiceNo" maxlength="10"></div><div class="field"><label for="invoiceType">發票類別</label><select id="invoiceType"><option value="">未選擇</option><option>二聯</option><option>三聯</option><option>其他</option></select></div><div class="field"><label for="invoiceDate">日期</label><input id="invoiceDate" type="date"></div><div class="field full"><label for="sellerName">賣方名稱</label><input id="sellerName"></div><div class="field"><label for="sellerTaxId">賣方統編</label><input id="sellerTaxId" inputmode="numeric" maxlength="8"></div><div class="field"><label for="buyerTaxId">買方統編</label><input id="buyerTaxId" inputmode="numeric" maxlength="8"></div><div class="field"><label for="totalAmount">含稅金額</label><input id="totalAmount" inputmode="decimal"></div><div class="field"><label for="untaxedAmount">未稅金額</label><input id="untaxedAmount" inputmode="decimal"></div><div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" inputmode="decimal"></div><div class="field"><label for="category">費用類別</label><select id="category"><option value="">未分類</option><option>五金用品</option><option>加油</option><option>停車費</option><option>餐費</option><option>茶水雜支</option><option>文具</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option></select></div><div class="field"><label for="payer">付款人</label><select id="payer"><option value="">未選擇</option></select></div><div class="field full"><label for="note">備註</label><textarea id="note"></textarea></div><div id="splitPanel" class="split-panel"><div class="split-head"><span>費用細分</span><button id="addSplit" class="btn ghost" type="button">新增</button></div><div id="splitList" class="split-list"></div><div id="splitSummary" class="split-summary">無細分</div></div></form><div id="saveStatus" class="save-status">確認後寫入試算表</div><div class="savebar"><span id="saveHint"></span><button id="saveInvoice" class="btn primary" type="button">儲存</button></div></div></aside></section><section class="panel" style="margin-top:16px"><div class="panel-head"><h2>最近儲存</h2><button id="refreshRecent" class="btn ghost" type="button">重新整理</button></div><div class="panel-body"><div id="recentList" class="recent-list"><div class="raw">尚無資料</div></div></div></section></main><script>(()=>{const GAS='https://script.google.com/macros/s/AKfycbxskzCq2FB86DinsxashH3AWRfvc0qVtrzLUa35RyE37z7j2YU4uAj7Sy2kX6OxLhzT/exec';const $=id=>document.getElementById(id);const fields=['invoiceNo','invoiceType','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','untaxedAmount','taxAmount','category','payer','note'];const state={mode:'qr',sourceType:'QR',qrLeft:'',qrRight:'',imageData:'',imageName:'',ocrText:'',scanner:null,scanning:false,lastQr:'',lastQrAt:0,vendors:[],vendorLoaded:false,payers:[],buyerTaxIds:[],ocrStream:null,documentType:'invoice',splits:[]};document.addEventListener('DOMContentLoaded',init);function init(){bind();loadSettings();setupMoney();renderRecent(loadRecent());loadVendors();loadSettingsList();bindDirty()}function bind(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll('input[name="documentType"]').forEach(r=>r.onchange=()=>setDocumentType(r.value));$('addSplit').onclick=()=>{state.splits.push({invoiceDate:$('invoiceDate').value||'',category:'',amount:'',note:''});renderSplits()};$('saveBackend').onclick=saveSettings;$('liveQr').onclick=startQr;$('stopQr').onclick=stopQr;$('clearQr').onclick=clearQr;$('ocrCamera').onclick=webOcrCamera;$('ocrAlbum').onclick=()=>$('ocrAlbumInput').click();$('ocrCameraInput').onchange=photoInput;$('ocrAlbumInput').onchange=photoInput;$('manualCamera').onclick=()=>$('manualCameraInput').click();$('manualAlbum').onclick=()=>$('manualAlbumInput').click();$('manualCameraInput').onchange=manualPhoto;$('manualAlbumInput').onchange=manualPhoto;$('runOcr').onclick=runGemini;$('saveInvoice').onclick=saveInvoice;$('resetForm').onclick=resetAll;$('refreshRecent').onclick=()=>renderRecent(loadRecent())}function loadSettings(){const token=localStorage.getItem('invoice-api-token')||'';$('gasUrl').value=GAS;$('apiToken').value=token;localStorage.setItem('gas-url',GAS);localStorage.removeItem('gemini-api-key');localStorage.removeItem('vision-api-key');$('setupPanel').classList.toggle('hidden-ready',!!token&&!new URLSearchParams(location.search).has('setup'))}function saveSettings(){const token=$('apiToken').value.trim();if(token.length<20){setStatus('請輸入管理員 token','error');return}localStorage.setItem('invoice-api-token',token);$('setupPanel').classList.add('hidden-ready');setStatus('已啟用');loadVendors(true);loadSettingsList(true)}function token(){return localStorage.getItem('invoice-api-token')||''}function bindDirty(){const f=$('invoiceForm');f.querySelectorAll('input,select,textarea').forEach(el=>{el.oninput=el.onchange=()=>setSaveStatus('確認後寫入試算表')})}function postFrame(fields,type,timeout=20000){return new Promise((resolve,reject)=>{const id='f'+Date.now()+Math.random().toString(16).slice(2);const frame=document.createElement('iframe');const form=document.createElement('form');frame.name=id;frame.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;border:0';form.method='POST';form.action=GAS;form.target=id;form.style.display='none';Object.entries(fields).forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=String(v==null?'':v);form.appendChild(i)});const timer=setTimeout(()=>done(null,new Error('GAS 回覆逾時，請確認部署版本')),timeout);function done(data,err){clearTimeout(timer);window.removeEventListener('message',on);form.remove();frame.remove();err?reject(err):resolve(data)}function on(ev){const d=ev.data;if(d&&d.type===type)done(d)}window.addEventListener('message',on);document.body.append(frame,form);form.submit()})}async function loadVendors(force=false){if(!token()){state.vendorLoaded=false;setStatus('尚未輸入 token，無法讀商家資料庫','warn');return false}if(state.vendorLoading&&!force)return state.vendorLoading;state.vendorLoading=postFrame({token:token(),action:'vendorsFrame',targetOrigin:location.origin},'invoice-vendors').then(r=>{if(r.ok&&Array.isArray(r.vendors)){state.vendors=r.vendors;state.vendorLoaded=true;setStatus('已讀取商家資料庫：'+r.vendors.length+' 筆');return true}throw new Error(r.error||'GAS 沒有回傳 vendors')}).catch(e=>{state.vendorLoaded=false;setStatus('商家資料庫讀取失敗：'+(e.message||e),'warn');return false}).finally(()=>state.vendorLoading=null);return state.vendorLoading}async function loadSettingsList(force=false){if(!token())return false;if(state.settingsLoading&&!force)return state.settingsLoading;state.settingsLoading=postFrame({token:token(),action:'settingsFrame',targetOrigin:location.origin},'invoice-settings').then(r=>{if(r.ok){state.payers=Array.isArray(r.payers)?r.payers:[];state.buyerTaxIds=Array.isArray(r.buyerTaxIds)?r.buyerTaxIds.map(x=>String(x).replace(/\D/g,'')).filter(x=>x.length===8):[];setupPayer();autoBuyer(knownText());return true}return false}).catch(()=>false).finally(()=>state.settingsLoading=null);return state.settingsLoading}function setupPayer(){const p=$('payer'),cur=p.value;p.innerHTML='<option value="">未選擇</option>';state.payers.forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;p.appendChild(o)});if(state.payers.includes(cur))p.value=cur}function setMode(m){state.mode=m;state.sourceType=m==='qr'?'QR':m==='ocr'?(state.documentType==='noInvoice'?'OCR無發票':'Gemini OCR'):'手動';renderSplits();document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));document.querySelectorAll('.mode').forEach(s=>s.classList.remove('active'));$('mode-'+m).classList.add('active');if(m!=='qr')stopQr();if(m!=='ocr')stopWebCam();setStatus(m==='qr'?'QR 模式：本機掃描，不花 Gemini 額度':m==='ocr'?'OCR 模式：使用 GAS 後端 Gemini':'手動模式')}async function startQr(){if(!window.Html5Qrcode){setStatus( ,' ').trim();return numbered?c:`${i+1}. ${c.replace(/^\d+[.)、]\s*/,'')}`}).join('；')}function clean(s){let out='';for(const c of String(s||''))out+=isBad(c)?' ':isAllowed(c)?c:' ';return out.replace(/\s+/g,' ').trim()}function isBad(c){const n=c.charCodeAt(0);return(n>=0x3040&&n<=0x30ff)||(n>=0x31f0&&n<=0x31ff)||(n>=0xac00&&n<=0xd7af)}function isAllowed(c){const n=c.charCodeAt(0);return(n>=0x4e00&&n<=0x9fff)||/[A-Za-z0-9]/.test(c)||' .,:;/-_$%()（）*#&+'.includes(c)}function score(s){let x=0;for(const c of String(s||'')){const n=c.charCodeAt(0);if(c==='�')x-=20;else if(isBad(c))x-=8;else if(n>=0x4e00&&n<=0x9fff)x+=5;else if(/[A-Za-z0-9]/.test(c))x+=2;else x+=1}return x}function setStatus(m,t){const e=$('status');e.textContent=m;e.classList.remove('error','warn');if(t)e.classList.add(t)}function setSaveStatus(m,t){const e=$('saveStatus');e.textContent=m;e.classList.remove('error','ok');if(t)e.classList.add(t)}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}})();</script></body></html>
