<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'><title>發票記帳掃描</title><script src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'></script><script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script><style>:root{--ink:#172126;--muted:#66757f;--line:#d9e1e5;--soft:#f4f7f8;--panel:#fff;--primary:#0f766e;--blue:#2563eb;--danger:#b91c1c;--warn:#92400e;--shadow:0 16px 36px rgba(22,33,38,.08)}*{box-sizing:border-box}body{margin:0;background:#eef3f4;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;letter-spacing:0}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:1120px;margin:0 auto;padding:16px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.brand h1{margin:0;font-size:24px}.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}.status{max-width:560px;min-height:38px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);font-size:14px;line-height:1.4}.status.error{color:var(--danger);border-color:#fecaca;background:#fff7f7}.status.warn{color:var(--warn);border-color:#fde68a;background:#fffbeb}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:#fbfcfd}.panel-head h2{margin:0;font-size:17px}.panel-body{padding:15px}.setup{margin-bottom:16px}.setup.hidden-ready{display:none}.setup-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.hint{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.55}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#dfe8eb;border-radius:8px;margin-bottom:14px}.tab{min-height:40px;border-radius:6px;background:transparent;color:#39505a;font-weight:700}.tab.active{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(22,33,38,.08)}.mode{display:none}.mode.active{display:block}.reader{min-height:310px;border:1px dashed #aebdc5;border-radius:8px;background:#0f171a;overflow:hidden}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.btn{min-height:42px;padding:0 14px;border-radius:8px;background:#e7eef1;color:var(--ink);font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.warn{background:#fef3c7;color:#7c2d12}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.raw{min-height:38px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:#33444c;font-family:Consolas,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}.small-label{margin-top:12px;color:var(--muted);font-size:13px;font-weight:750}.preview-wrap{display:grid;grid-template-columns:160px minmax(0,1fr);gap:14px;align-items:start}.preview{width:100%;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;background:var(--soft);object-fit:contain}.ocr-text{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfd}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:750;color:#35464e}input,select,textarea{width:100%;min-height:42px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{outline:none;border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.16)}.savebar{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;margin:15px -15px -15px;padding:13px 15px;border-top:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(10px)}.savebar span{color:var(--muted);font-size:13px}.recent-list{display:grid;gap:8px}.recent-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}.recent-title{font-weight:800;overflow-wrap:anywhere}.recent-meta{color:var(--muted);font-size:12px}.amount{color:#115e59;font-weight:850;white-space:nowrap}.progress{height:8px;border-radius:999px;background:#dde7ea;overflow:hidden;margin-top:10px}.progress span{display:block;width:0%;height:100%;background:linear-gradient(90deg,var(--primary),var(--blue));transition:width .16s}.hidden{display:none!important}@media(max-width:920px){.layout{grid-template-columns:1fr}.topbar{display:block}.status{max-width:none;margin-top:10px}}@media(max-width:560px){.app{padding:12px}.brand h1{font-size:21px}.panel-body{padding:12px}.panel-head{padding:12px}.reader{min-height:260px}.preview-wrap,.form-grid{grid-template-columns:1fr}.savebar{align-items:stretch;flex-direction:column;margin:14px -12px -12px;padding:12px}.savebar .btn,.setup-row .btn{width:100%}.setup-row{grid-template-columns:1fr}}</style></head><body><main class='app'><header class='topbar'><div class='brand'><h1>發票記帳掃描</h1><p>GitHub Pages + Google Apps Script</p></div><div id='status' class='status'>待命</div></header><section id='setupPanel' class='panel setup'><div class='panel-head'><h2>第一次設定</h2></div><div class='panel-body'><label for='gasUrl'>GAS /exec 網址</label><div class='setup-row'><input id='gasUrl' autocomplete='off' placeholder='貼上 Apps Script /exec 網址'><button id='saveBackend' class='btn primary' type='button'>記住</button></div><label for='apiToken' style='margin-top:12px;display:block'>API token</label><input id='apiToken' autocomplete='off' placeholder='貼上 setupInvoiceBackend 產生的 token'><div class='hint'>GAS 網址和 token 只會存在這台裝置的瀏覽器，不會寫在公開 GitHub 程式碼裡。需要重設時，在網址後加 <code>?setup=1</code>。</div></div></section><section class='layout'><div class='panel'><div class='panel-head'><h2>輸入來源</h2></div><div class='panel-body'><nav class='tabs'><button class='tab active' data-mode='qr' type='button'>QR</button><button class='tab' data-mode='ocr' type='button'>OCR</button><button class='tab' data-mode='manual' type='button'>手動</button></nav><section id='mode-qr' class='mode active'><div class='hint'>電子發票請優先掃「左邊 QR」。右邊 QR 通常用來補品項，讀到 <b>**</b> 開頭是正常；如果只剩 <b>**</b>，代表畫面太遠、太糊或只拍到開頭。</div><div id='reader' class='reader'></div><div class='actions'><button id='liveQr' class='btn primary' type='button'>即時掃描</button><button id='qrCamera' class='btn ghost' type='button'>拍照掃 QR</button><button id='qrAlbum' class='btn ghost' type='button'>選相簿 QR</button><button id='stopQr' class='btn ghost' type='button' disabled>停止</button><input id='qrCameraInput' class='hidden' type='file' accept='image/*' capture='environment'><input id='qrAlbumInput' class='hidden' type='file' accept='image/*'><button id='clearQr' class='btn warn' type='button'>清除 QR</button></div><div class='small-label'>左碼</div><div id='qrLeft' class='raw'></div><div class='small-label'>右碼</div><div id='qrRight' class='raw'></div><div class='small-label'>品項</div><div id='qrItems' class='raw'></div></section><section id='mode-ocr' class='mode'><div class='hint'>免費 OCR 對傳統發票只能先填草稿。程式會避免把統一編號當成發票號碼，但儲存前仍要人工確認。</div><div class='actions'><button id='ocrCamera' class='btn primary' type='button'>拍照辨識</button><button id='ocrAlbum' class='btn ghost' type='button'>選相簿辨識</button><button id='runOcr' class='btn blue' type='button'>辨識文字</button><input id='ocrCameraInput' class='hidden' type='file' accept='image/*' capture='environment'><input id='ocrAlbumInput' class='hidden' type='file' accept='image/*'></div><div class='progress hidden' id='ocrProgress'><span></span></div><div class='preview-wrap' style='margin-top:14px'><img id='preview' class='preview' alt=''><textarea id='ocrText' class='ocr-text' placeholder='OCR 原文'></textarea></div></section><section id='mode-manual' class='mode'><div class='actions'><button id='manualCamera' class='btn primary' type='button'>拍照附圖</button><button id='manualAlbum' class='btn ghost' type='button'>選相簿附圖</button><input id='manualCameraInput' class='hidden' type='file' accept='image/*' capture='environment'><input id='manualAlbumInput' class='hidden' type='file' accept='image/*'></div><div class='preview-wrap' style='margin-top:14px'><img id='manualPreview' class='preview' alt=''><div class='raw'>手動建立資料時，也可以附上發票照片。</div></div></section></div></div><aside class='panel'><div class='panel-head'><h2>確認資料</h2><button id='resetForm' class='btn ghost' type='button'>清空</button></div><div class='panel-body'><form id='invoiceForm' class='form-grid'><div class='field'><label for='invoiceNo'>發票號碼</label><input id='invoiceNo' maxlength='10' placeholder='AB12345678'></div><div class='field'><label for='invoiceDate'>日期</label><input id='invoiceDate' type='date'></div><div class='field full'><label for='sellerName'>賣方名稱</label><input id='sellerName'></div><div class='field'><label for='sellerTaxId'>賣方統編</label><input id='sellerTaxId' inputmode='numeric' maxlength='8'></div><div class='field'><label for='buyerTaxId'>買方統編</label><input id='buyerTaxId' inputmode='numeric' maxlength='8'></div><div class='field'><label for='totalAmount'>總金額</label><input id='totalAmount' inputmode='decimal'></div><div class='field'><label for='taxAmount'>稅額</label><input id='taxAmount' inputmode='decimal'></div><div class='field'><label for='category'>費用類別</label><select id='category'><option value=''>未分類</option><option>交通</option><option>餐費</option><option>文具</option><option>郵資</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option></select></div><div class='field'><label for='payer'>付款人</label><input id='payer'></div><div class='field full'><label for='project'>專案 / 部門</label><input id='project'></div><div class='field full'><label for='note'>備註</label><textarea id='note'></textarea></div></form><div class='savebar'><span id='saveHint'>確認後寫入試算表</span><button id='saveInvoice' class='btn primary' type='button'>儲存</button></div></div></aside></section><section class='panel' style='margin-top:16px'><div class='panel-head'><h2>最近儲存</h2><button id='refreshRecent' class='btn ghost' type='button'>重新整理</button></div><div class='panel-body'><div id='recentList' class='recent-list'></div></div></section></main><script>const state={mode:'qr',sourceType:'QR',qrLeft:'',qrRight:'',imageData:'',imageName:'',ocrText:'',scanner:null,scanning:false,lastQr:'',lastQrAt:0};const fieldIds=['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','taxAmount','category','payer','project','note'];const $=id=>document.getElementById(id);document.addEventListener('DOMContentLoaded',()=>{bindEvents();loadBackendSettings();renderRecent(loadRecent());});function bindEvents(){document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('saveBackend').addEventListener('click',saveBackendSettings);$('liveQr').addEventListener('click',startQrScanner);$('qrCamera').addEventListener('click',()=>$('qrCameraInput').click());$('qrAlbum').addEventListener('click',()=>$('qrAlbumInput').click());$('stopQr').addEventListener('click',stopQrScanner);$('qrCameraInput').addEventListener('change',scanQrFromPhoto);$('qrAlbumInput').addEventListener('change',scanQrFromPhoto);$('clearQr').addEventListener('click',clearQr);$('ocrCamera').addEventListener('click',()=>$('ocrCameraInput').click());$('ocrAlbum').addEventListener('click',()=>$('ocrAlbumInput').click());$('ocrCameraInput').addEventListener('change',handlePhotoInput);$('ocrAlbumInput').addEventListener('change',handlePhotoInput);$('manualCamera').addEventListener('click',()=>$('manualCameraInput').click());$('manualAlbum').addEventListener('click',()=>$('manualAlbumInput').click());$('manualCameraInput').addEventListener('change',handleManualPhotoInput);$('manualAlbumInput').addEventListener('change',handleManualPhotoInput);$('runOcr').addEventListener('click',runOcr);$('ocrText').addEventListener('input',()=>state.ocrText=$('ocrText').value);$('saveInvoice').addEventListener('click',saveInvoice);$('resetForm').addEventListener('click',resetAll);$('refreshRecent').addEventListener('click',()=>renderRecent(loadRecent()));}function loadBackendSettings(){const url=localStorage.getItem('gas-url')||'';const token=localStorage.getItem('invoice-api-token')||'';$('gasUrl').value=url;$('apiToken').value=token;const forceSetup=new URLSearchParams(location.search).has('setup');$('setupPanel').classList.toggle('hidden-ready',Boolean(url&&token&&!forceSetup));}function saveBackendSettings(){const url=$('gasUrl').value.trim();const token=$('apiToken').value.trim();if(!(url.startsWith('https://script.google.com/macros/s/')&&url.endsWith('/exec'))){setStatus('請貼上 Apps Script /exec 結尾網址','error');return;}if(token.length<20){setStatus('請貼上 setupInvoiceBackend 產生的 API token','error');return;}localStorage.setItem('gas-url',url);localStorage.setItem('invoice-api-token',token);$('setupPanel').classList.add('hidden-ready');setStatus('已記住 GAS 後端網址與 token');}function getGasUrl(){return localStorage.getItem('gas-url')||'';}function getApiToken(){return localStorage.getItem('invoice-api-token')||'';}function setMode(mode){state.mode=mode;state.sourceType=mode==='qr'?'QR':mode==='ocr'?'OCR':'手動';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.mode').forEach(s=>s.classList.remove('active'));$(`mode-${mode}`).classList.add('active');if(mode!=='qr')stopQrScanner();setStatus(mode==='qr'?'QR 模式：優先掃左碼':mode==='ocr'?'OCR 模式：辨識後請確認欄位':'手動模式');}async function startQrScanner(){if(!window.Html5Qrcode){setStatus('QR 套件還沒載入，請重新整理網頁','error');return;}if(state.scanning)return;try{const opt=window.Html5QrcodeSupportedFormats?{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]}:undefined;state.scanner=state.scanner||new Html5Qrcode('reader',opt);setStatus('正在開啟相機...');$('liveQr').disabled=true;$('stopQr').disabled=true;await state.scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*0.72);return{width:s,height:s};},aspectRatio:1.333},handleQrScan,()=>{});state.scanning=true;$('stopQr').disabled=false;setStatus('掃描中：請先對準左邊 QR');}catch(e){$('liveQr').disabled=false;$('stopQr').disabled=true;setStatus(`無法啟動相機：${e.message||e}`,'error');}}async function stopQrScanner(){if(!state.scanner||!state.scanning)return;try{await state.scanner.stop();}catch(e){setStatus(`停止掃描失敗：${e.message||e}`,'error');}finally{state.scanning=false;$('liveQr').disabled=false;$('stopQr').disabled=true;}}async function scanQrFromPhoto(e){const file=e.target.files&&e.target.files[0];if(!file)return;try{await stopQrScanner();state.imageData=await resizeImage(file);state.imageName=file.name;setStatus('照片 QR 辨識中，請稍等');const raws=await detectQrCodes(file);if(!raws.length)throw new Error('沒有讀到 QR');raws.forEach(raw=>handleQrScan(raw));setStatus(raws.length>1?'照片讀到左右 QR':'照片讀到 1 個 QR');}catch(err){setStatus(`照片裡沒有讀到 QR。請只拍 QR 區域，讓單一 QR 佔畫面 1/3 以上，或先掃左碼。${err.message?` (${err.message})`:''}`,'warn');}finally{e.target.value='';}}async function detectQrCodes(file){const out=[];if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const bitmap=await createImageBitmap(file);const codes=await detector.detect(bitmap);if(bitmap.close)bitmap.close();codes.forEach(c=>{if(c.rawValue)out.push(c.rawValue);});}catch(e){}}if(out.length)return unique(out);if(!window.Html5Qrcode)throw new Error('QR 套件未載入');const scanner=state.scanner||new Html5Qrcode('reader');state.scanner=scanner;const raw=await scanner.scanFile(file,true);return raw?[raw]:[];}function unique(list){return [...new Set(list.map(v=>String(v||'').trim()).filter(Boolean))];}function handleQrScan(rawValue){const raw=String(rawValue||'').trim();if(!raw)return;const now=Date.now();if(raw===state.lastQr&&now-state.lastQrAt<1200)return;state.lastQr=raw;state.lastQrAt=now;if(raw.startsWith('**'))state.qrRight=raw;else state.qrLeft=raw;renderQrState();const parsed=parseTaiwanInvoiceQr(state.qrLeft,state.qrRight);if(parsed){applyParsedInvoice(parsed);setStatus(state.qrRight&&state.qrRight.length>2?'QR 已讀取，左碼主資料已填入':'已讀到左碼，發票主資料可先儲存');return;}if(raw==='**'||raw.length<=3){setStatus('右碼只讀到 **，內容太糊或太遠。請改掃左碼，或把右邊 QR 拍大一點。','warn');return;}if(raw.startsWith('**')){setStatus('已讀到右碼，還需要左邊 QR 才能抓發票號碼、日期和金額。','warn');return;}setStatus('已讀到 QR，但格式不像台灣電子發票左碼。請確認是否掃到發票左邊 QR。','warn');}function clearQr(){state.qrLeft='';state.qrRight='';$('qrLeft').textContent='';$('qrRight').textContent='';$('qrItems').textContent='';setStatus('QR 已清除');}function renderQrState(){$('qrLeft').textContent=state.qrLeft;$('qrRight').textContent=state.qrRight;$('qrItems').textContent=parseQrItems(state.qrLeft,state.qrRight)||'';}function parseTaiwanInvoiceQr(left,right){if(!left||left.startsWith('**')||left.length<77)return null;const invoiceNo=left.slice(0,10).toUpperCase();if(!/^[A-Z]{2}[0-9]{8}$/.test(invoiceNo))return null;const sales=hexAmount(left.slice(21,29));const total=hexAmount(left.slice(29,37));const item=parseQrItems(left,right);return{invoiceNo:invoiceNo,invoiceDate:rocToIso(left.slice(10,17)),sellerTaxId:cleanTaxId(left.slice(45,53)),buyerTaxId:cleanTaxId(left.slice(37,45)),totalAmount:total,taxAmount:sales&&total?Math.max(0,total-sales):'',itemSummary:item};}function parseQrItems(left,right){if(!left||left.length<78)return'';let tail=left.slice(77);if(right&&right.length>2)tail+=right.startsWith('**')?right.slice(2):right;const parts=tail.split(':');if(parts.length<6)return'';let itemText=parts.slice(5).join(':');if(parts[4]==='2')itemText=decodeBase64Utf8(itemText);const p=itemText.split(':').filter(Boolean);const out=[];for(let i=0;i+2<p.length;i+=3)out.push(`${p[i]} x${p[i+1]} $${p[i+2]}`);return out.join('；');}function hexAmount(v){return/^[0-9a-fA-F]{8}$/.test(v)?parseInt(v,16):'';}function rocToIso(v){if(!/^[0-9]{7}$/.test(v))return'';return`${Number(v.slice(0,3))+1911}-${v.slice(3,5)}-${v.slice(5,7)}`;}function cleanTaxId(v){return/^[0-9]{8}$/.test(v)&&v!=='00000000'?v:'';}function decodeBase64Utf8(v){try{const b=atob(v.replaceAll(' ',''));return new TextDecoder('utf-8').decode(Uint8Array.from(b,c=>c.charCodeAt(0)));}catch(e){return v;}}async function handlePhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;state.imageData=await resizeImage(file);state.imageName=file.name;$('preview').src=state.imageData;setStatus('照片已載入，按「辨識文字」開始 OCR');e.target.value='';}async function handleManualPhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;state.imageData=await resizeImage(file);state.imageName=file.name;$('manualPreview').src=state.imageData;setStatus('照片已載入');e.target.value='';}async function resizeImage(file){const src=await readFile(file);const img=await loadImage(src);const max=1800;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.88);}function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}async function preprocessForOcr(src){const img=await loadImage(src);const max=2200;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const im=ctx.getImageData(0,0,c.width,c.height);const d=im.data;for(let i=0;i<d.length;i+=4){const gray=(d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11);const v=Math.max(0,Math.min(255,(gray-128)*1.55+145));d[i]=v;d[i+1]=v;d[i+2]=v;}ctx.putImageData(im,0,0);return c.toDataURL('image/jpeg',0.92);}async function runOcr(){if(!state.imageData){setStatus('請先拍照或選相簿照片','error');return;}if(!window.Tesseract){setStatus('OCR 套件還沒載入，請重新整理網頁','error');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setStatus('OCR 辨識中，熱感紙可能需要一點時間');try{const image=await preprocessForOcr(state.imageData);const r=await Tesseract.recognize(image,'chi_tra+eng',{logger:m=>{if(m.status==='recognizing text')setProgress(m.progress||0);}});state.ocrText=r.data.text||'';$('ocrText').value=state.ocrText;const parsed=parseOcrText(state.ocrText);applyParsedInvoice(parsed);const got=[];if(parsed.invoiceNo)got.push('發票號碼');if(parsed.invoiceDate)got.push('日期');if(parsed.totalAmount)got.push('金額');setStatus(got.length?`OCR 已填入草稿：${got.join('、')}，儲存前請確認`:'OCR 完成，但沒有抓到可靠欄位，請用手動欄位補資料','warn');}catch(e){setStatus(`OCR 失敗：${e.message||e}`,'error');}finally{$('runOcr').disabled=false;setProgress(0);$('ocrProgress').classList.add('hidden');}}function setProgress(v){$('ocrProgress').querySelector('span').style.width=`${Math.max(0,Math.min(100,Math.round(v*100)))}%`;}function parseOcrText(text){const n=normalizeText(text);const lines=toLines(n);const invoiceNo=findInvoiceNo(n,lines);const ids=findTaxIds(n,lines,invoiceNo);return{invoiceNo:invoiceNo,invoiceDate:findDate(n),sellerName:findSeller(lines),sellerTaxId:ids.sellerTaxId,buyerTaxId:ids.buyerTaxId,totalAmount:findMoney(n,['總計','總金額','總額','合計','應付金額','應付','金額']),taxAmount:findMoney(n,['營業稅','稅額'])};}function normalizeText(t){return String(t||'').replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[，]/g,',').replace(/[：]/g,':').replace(/[－]/g,'-').toUpperCase();}function toLines(t){const nl=String.fromCharCode(10);const cr=String.fromCharCode(13);return t.replaceAll(cr,nl).split(nl).map(s=>s.trim()).filter(Boolean);}function findInvoiceNo(text,lines){const candidates=[];lines.forEach(line=>{const re=/([A-Z]{2})[ -]*([0-9OISBZ]{8})/g;let m;while((m=re.exec(line))){const number=m[1]+fixDigits(m[2]);const near=line.slice(0,m.index);if(/(統編|統一編號|賣方|買方|營業人)/.test(near)&&!/(發票|號碼)/.test(near))continue;if(/^[A-Z]{2}[0-9]{8}$/.test(number))candidates.push(number);}});if(candidates.length)return candidates[0];const compact=removeSpaces(text);const re=/([A-Z]{2})([0-9OISBZ]{8})/g;let m;while((m=re.exec(compact))){const number=m[1]+fixDigits(m[2]);if(/^[A-Z]{2}[0-9]{8}$/.test(number))return number;}return'';}function fixDigits(s){const map={O:'0',I:'1',S:'5',B:'8',Z:'2'};return String(s||'').split('').map(c=>map[c]||c).join('');}function removeSpaces(s){return String(s||'').split('').filter(c=>!isSpace(c)).join('');}function isSpace(c){return c===' '||c===String.fromCharCode(9)||c===String.fromCharCode(10)||c===String.fromCharCode(13);}function findDate(t){let m=t.match(/([0-9]{3})[年./-]([0-9]{1,2})[月./-]([0-9]{1,2})/);if(m)return fmtDate(Number(m[1])+1911,m[2],m[3]);m=t.match(/(20[0-9]{2})[年./-]([0-9]{1,2})[月./-]([0-9]{1,2})/);if(m)return fmtDate(m[1],m[2],m[3]);return'';}function findTaxIds(text,lines,invoiceNo){let sellerTaxId='',buyerTaxId='';lines.forEach(line=>{const ids=idsIn(line).filter(id=>id!==invoiceNo.slice(2));if(!ids.length)return;if(/(買方|買受人|客戶|買受統編)/.test(line)&&!buyerTaxId)buyerTaxId=ids[0];if(/(賣方|銷售人|營業人|統一編號|統編)/.test(line)&&!sellerTaxId)sellerTaxId=ids[0];});const all=idsIn(text).filter(id=>id!==invoiceNo.slice(2));if(!sellerTaxId)sellerTaxId=all[0]||'';if(!buyerTaxId)buyerTaxId=all.find(id=>id!==sellerTaxId)||'';return{sellerTaxId:sellerTaxId,buyerTaxId:buyerTaxId};}function idsIn(t){const out=[];const re=/[0-9]{8}/g;let m;while((m=re.exec(t))){const before=t[m.index-1]||'';const after=t[m.index+8]||'';if(/[0-9]/.test(before)||/[0-9]/.test(after))continue;out.push(m[0]);}return unique(out).filter(id=>id!=='00000000');}function findMoney(text,labels){for(const label of labels){const idxs=indexesOf(text,label);for(const idx of idxs){const chunk=text.slice(idx,idx+36);const nums=moneyNumbers(chunk);if(nums.length)return String(Math.max(...nums));}}const nums=moneyNumbers(text).filter(n=>n>0&&n<1000000);return nums.length?String(Math.max(...nums)):'';}function indexesOf(t,needle){const out=[];let pos=0;while((pos=t.indexOf(needle,pos))>=0){out.push(pos);pos+=needle.length;}return out;}function moneyNumbers(t){const out=[];const re=/[0-9][0-9,]{0,8}/g;let m;while((m=re.exec(t))){const raw=m[0];const n=Number(raw.replaceAll(',',''));if(!Number.isFinite(n))continue;if(String(n).length>=7)continue;out.push(n);}return out;}function findSeller(lines){const banned=/(電子發票|統一發票|證明聯|收據|明細|日期|發票號碼|隨機碼|統編|統一編號|總計|合計|金額|稅額|QR|APP)/;for(const l of lines){if(hasCjk(l)&&!banned.test(l)&&l.length>=2&&l.length<=30)return l;}return'';}function hasCjk(s){for(const c of String(s||'')){const code=c.charCodeAt(0);if(code>=19968&&code<=40959)return true;}return false;}function fmtDate(y,m,d){return`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}function applyParsedInvoice(parsed){Object.entries(parsed).forEach(([k,v])=>{if(k==='itemSummary'){if(v){$('qrItems').textContent=v;if(!$('note').value)$('note').value=v;}return;}if(v!==''&&$(k))$(k).value=v;});}function buildPayload(){const p={};fieldIds.forEach(id=>p[id]=$(id).value.trim());p.sourceType=state.sourceType;p.status='已確認';p.qrLeft=state.qrLeft;p.qrRight=state.qrRight;p.ocrText=state.ocrText||$('ocrText').value;p.imageData=state.imageData;p.imageName=state.imageName;return p;}async function saveInvoice(){const payload=buildPayload();if(!payload.invoiceNo&&!payload.totalAmount){setStatus('請至少填發票號碼或總金額','error');return;}const url=getGasUrl();const token=getApiToken();if(!url||!token){setStatus('請先填 GAS /exec 網址與 API token','error');$('setupPanel').classList.remove('hidden-ready');return;}$('saveInvoice').disabled=true;setStatus('儲存中');try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token,payload})});saveLocal(payload);$('saveHint').textContent='已送出到 Apps Script';setStatus('已送出。請到 Google Sheet 確認資料。');renderRecent(loadRecent());}catch(e){setStatus(`送出失敗：${e.message||e}`,'error');}finally{$('saveInvoice').disabled=false;}}function saveLocal(p){const rows=loadRecent();rows.unshift({createdAt:new Date().toLocaleString('zh-TW'),...p});localStorage.setItem('invoice-recent',JSON.stringify(rows.slice(0,50)));}function loadRecent(){try{return JSON.parse(localStorage.getItem('invoice-recent')||'[]');}catch(e){return[];}}function renderRecent(rows){const list=$('recentList');list.innerHTML='';if(!rows.length){list.innerHTML='<div class=raw>尚無資料</div>';return;}rows.slice(0,8).forEach(r=>{const d=document.createElement('div');d.className='recent-item';d.innerHTML=`<div><div class='recent-title'>${esc(r.invoiceNo||'未填發票號碼')}</div><div class='recent-meta'>${esc(r.invoiceDate||r.createdAt||'')} ${esc(r.sellerName||r.sellerTaxId||'')}</div></div><div class='amount'>$${esc(r.totalAmount||'')}</div>`;list.appendChild(d);});}function resetAll(){fieldIds.forEach(id=>$(id).value='');state.imageData='';state.imageName='';state.ocrText='';$('ocrText').value='';$('preview').removeAttribute('src');$('manualPreview').removeAttribute('src');clearQr();setStatus('已清空');}function setStatus(msg,type){const el=$('status');el.textContent=msg;el.classList.remove('error','warn');if(type)el.classList.add(type);}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}</script></body></html>
