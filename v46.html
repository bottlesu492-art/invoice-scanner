<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描 v46</title>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:760px;margin:40px auto;padding:20px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(22,33,38,.08)}.err{color:#b91c1c;white-space:pre-wrap}</style>
</head>
<body>
<div class="box" id="loader">正在載入 v46：較寬 3:4 OCR 相機...</div>
<script>
(async function(){
  const loader=document.getElementById('loader');
  function fail(label){throw new Error('v46 補丁失敗：'+label);}
  function replaceRegex(html,re,to,label){const next=html.replace(re,to);if(next===html)fail(label);return next;}
  function patchGeminiFunction(html){
    const start=html.indexOf('async function callGeminiInvoice(dataUrl,key){');
    const end=html.indexOf('\nfunction applyGeminiInvoice',start);
    if(start<0||end<0)fail('找不到 Gemini 函式區塊');
    const original=html.slice(start,end);
    const cut=original.indexOf('const res=await fetch(');
    if(cut<0)fail('找不到 Gemini fetch 區塊');
    const prefix=original.slice(0,cut).replace('async function callGeminiInvoice(dataUrl,key){const base64=',"async function callGeminiInvoice(dataUrl,key,model){model=model||'auto';const base64=");
    const fallback="const candidates=model==='auto'?['gemini-3.1-flash-lite-preview','gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-2.5-flash']:[model];let text='';let used='';let lastError='';for(const m of candidates){try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent?key=`+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.error){lastError=(json.error&&json.error.message)||('HTTP '+res.status);continue;}text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;if(text){used=m;break;}lastError='Gemini 沒有回傳文字';}catch(err){lastError=err.message||String(err);}}if(!text)throw new Error(lastError||'所有 Gemini 模型都失敗');setStatus('Gemini 使用模型：'+used);return JSON.parse(String(text).replace(/^\\x60\\x60\\x60(?:json)?\\s*/,'').replace(/\\s*\\x60\\x60\\x60$/,'').trim());}";
    return html.slice(0,start)+prefix+fallback+html.slice(end);
  }
  try{
    let html=await fetch('v28.html?base='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀不到 v28.html，HTTP '+r.status);return r.text();});
    html=html.replaceAll('發票記帳掃描 v28','發票記帳掃描 v46');
    html=html.replace('v28 將偏暗點陣字再壓黑，背景與銳化沿用 v27。','v46 OCR 使用較寬 3:4 網頁相機，發票不用拿那麼遠。');
    html=replaceRegex(html,/<section id="mode-ocr" class="mode">[\s\S]*?<\/section>/,
      '<section id="mode-ocr" class="mode"><div class="hint">v46 改成較寬 3:4 直式相機，發票比較容易整張入鏡。可點影像或右邊按鈕拍下。</div><div class="actions" style="justify-content:flex-end"><button id="ocrAlbum" class="btn ghost" type="button">選相簿辨識</button><button id="runOcr" class="btn blue" type="button">Gemini 判讀</button><button id="ocrCamera" class="btn primary" type="button">拍照辨識</button><input id="ocrCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="ocrAlbumInput" class="hidden" type="file" accept="image/*"></div><div class="progress hidden" id="ocrProgress"><span></span></div><div class="preview-wrap" style="margin-top:14px;grid-template-columns:minmax(0,1fr)"><div style="max-width:460px;margin-left:auto"><video id="ocrVideo" class="preview hidden" playsinline muted style="aspect-ratio:3/4;object-fit:cover;background:#111;cursor:pointer"></video><img id="preview" class="preview" alt="" style="aspect-ratio:3/4;object-fit:contain"></div><textarea id="ocrText" class="ocr-text" placeholder="Gemini 回傳 JSON"></textarea></div></section>',
      'OCR section');
    html=replaceRegex(html,/\$\('ocrCamera'\)\.addEventListener\('click',\(\)=>\$\('ocrCameraInput'\)\.click\(\)\);/,"$('ocrCamera').addEventListener('click',handleWebOcrCamera);",'OCR camera binding');
    html=replaceRegex(html,/async function prepareOcrImage\(file\)\{[^}]+\}/,"async function prepareOcrImage(file){return resizeImage(file,2200,0.95,'grayPlain');}",'prepareOcrImage');
    html=replaceRegex(html,/if\(mode==='tuned'\)applyTunedOcr\(ctx,c\.width,c\.height\);else if\(mode==='mono'\)makeCrispMono\(ctx,c\.width,c\.height\);else if\(mode\)softSharpenCanvas\(ctx,c\.width,c\.height\);/,"if(mode==='grayPlain')applyPlainGray(ctx,c.width,c.height);else if(mode==='tuned')applyTunedOcr(ctx,c.width,c.height);else if(mode==='mono')makeCrispMono(ctx,c.width,c.height);else if(mode)softSharpenCanvas(ctx,c.width,c.height);",'resize gray branch');
    html=replaceRegex(html,/function applyTunedOcr\(ctx,w,h\)\{/,"function applyPlainGray(ctx,w,h){const src=ctx.getImageData(0,0,w,h);const data=src.data;for(let i=0;i<data.length;i+=4){const g=data[i]*.299+data[i+1]*.587+data[i+2]*.114;data[i]=data[i+1]=data[i+2]=Math.max(0,Math.min(255,g));data[i+3]=255;}ctx.putImageData(src,0,0);}function applyMildDarken(ctx,w,h){const src=ctx.getImageData(0,0,w,h);const data=src.data;for(let i=0;i<data.length;i+=4){let g=data[i]*.299+data[i+1]*.587+data[i+2]*.114;g=(g-128)*1.03+122;if(g>210)g=210+(g-210)*.55;g=Math.max(0,Math.min(255,g));data[i]=data[i+1]=data[i+2]=g;data[i+3]=255;}ctx.putImageData(src,0,0);}function applyTunedOcr(ctx,w,h){",'gray and exposure functions');
    html=replaceRegex(html,/async function handlePhotoInput\(e\)\{[^\n]*\}/,
      "async function handlePhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;stopWebOcrCamera();clearFieldsForNewScan();state.imageData=await prepareOcrImage(file);state.imageName=file.name;$('preview').classList.remove('hidden');$('preview').src=state.imageData;setStatus('照片已載入，已套用基本灰白化');e.target.value='';}async function handleWebOcrCamera(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('這個瀏覽器不支援網頁相機，請改用選相簿辨識','error');return;}const video=$('ocrVideo');const preview=$('preview');try{if(!state.ocrStream){const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1440},height:{ideal:1920},aspectRatio:{ideal:0.75},zoom:{ideal:1}},audio:false});state.ocrStream=stream;video.srcObject=stream;video.onclick=handleWebOcrCamera;video.classList.remove('hidden');preview.classList.add('hidden');await video.play();const track=stream.getVideoTracks()[0];if(track&&track.getCapabilities){const caps=track.getCapabilities();const adv={};if(caps.zoom){adv.zoom=Math.max(caps.zoom.min||1,1);}if(caps.exposureCompensation){adv.exposureCompensation=Math.max(caps.exposureCompensation.min||0,Math.min(-0.7,caps.exposureCompensation.max||0));}if(Object.keys(adv).length)track.applyConstraints({advanced:[adv]}).catch(()=>{});} $('ocrCamera').textContent='拍下發票';setStatus('3:4 相機已開啟，可點影像或右邊按鈕拍下');return;}if(!video.videoWidth||!video.videoHeight){setStatus('相機還在準備中，請再等一下','warn');return;}clearFieldsForNewScan();const targetRatio=3/4;let sw=video.videoWidth;let sh=video.videoHeight;let sx=0;let sy=0;if(sw/sh>targetRatio){const nw=Math.round(sh*targetRatio);sx=Math.round((sw-nw)/2);sw=nw;}else{const nh=Math.round(sw/targetRatio);sy=Math.round((sh-nh)/2);sh=nh;}const canvas=document.createElement('canvas');canvas.width=1440;canvas.height=1920;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(video,sx,sy,sw,sh,0,0,canvas.width,canvas.height);applyMildDarken(ctx,canvas.width,canvas.height);state.imageData=canvas.toDataURL('image/jpeg',0.95);state.imageName='web-camera.jpg';preview.src=state.imageData;preview.classList.remove('hidden');stopWebOcrCamera();setStatus('已拍下 3:4 直式發票，已微降曝光');}catch(e){stopWebOcrCamera();setStatus('網頁相機失敗：'+(e.message||e),'error');}}function stopWebOcrCamera(){if(state.ocrStream){state.ocrStream.getTracks().forEach(t=>t.stop());state.ocrStream=null;}const video=$('ocrVideo');if(video){video.pause();video.onclick=null;video.srcObject=null;video.classList.add('hidden');}$('ocrCamera').textContent='拍照辨識';}",
      'web OCR camera functions');
    html=replaceRegex(html,/if\(mode!=='qr'\)stopQrScanner\(\);setStatus\(mode==='qr'\?'QR 模式：本機掃描，不花 Gemini 額度':mode==='ocr'\?'OCR 模式：使用 Gemini':'手動模式'\);/,"if(mode!=='qr')stopQrScanner();if(mode!=='ocr')stopWebOcrCamera();setStatus(mode==='qr'?'QR 模式：本機掃描，不花 Gemini 額度':mode==='ocr'?'OCR 模式：使用 Gemini':'手動模式');",'mode camera cleanup');
    html=replaceRegex(html,/function resetAll\(\)\{fieldIds\.forEach\(id=>\$\(id\)\.value=''\);state\.imageData='';state\.imageName='';state\.ocrText='';\$\('ocrText'\)\.value='';\$\('preview'\)\.removeAttribute\('src'\);\$\('manualPreview'\)\.removeAttribute\('src'\);clearQr\(\);if\(window\.recalcMoney\)window\.recalcMoney\(\);setStatus\('已清空'\);\}/,"function resetAll(){fieldIds.forEach(id=>$(id).value='');state.imageData='';state.imageName='';state.ocrText='';$('ocrText').value='';$('preview').removeAttribute('src');$('manualPreview').removeAttribute('src');stopWebOcrCamera();clearQr();if(window.recalcMoney)window.recalcMoney();setStatus('已清空');}",'reset cleanup');
    html=replaceRegex(html,/const key=getGeminiKey\(\);if\(!key\)\{[\s\S]*?try\{const result=await callGeminiInvoice\(state\.imageData,key\);/,"const key=getGeminiKey();if(!key){setStatus('請先到設定填 Gemini API key','error');$('setupPanel').classList.remove('hidden-ready');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setProgress(12);setStatus('Gemini 正在用自動模式看發票...');try{const result=await callGeminiInvoice(state.imageData,key,'auto');",'runGeminiOcr auto');
    html=patchGeminiFunction(html);
    document.open();document.write(html);document.close();
  }catch(err){loader.className='box err';loader.textContent=(err&&err.stack)||String(err);}
})();
</script>
</body>
</html>
