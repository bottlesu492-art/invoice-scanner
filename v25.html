<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描 v25</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/encoding-japanese@2.0.0/encoding.min.js"></script>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1120px;margin:auto;padding:16px}.topbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.brand h1{margin:0;font-size:24px}.brand p,.hint,.savebar span,.recent-meta{color:#64727a}.status{min-height:38px;max-width:600px;padding:9px 12px;border:1px solid #d9e1e5;border-radius:8px;background:#fff}.status.error{color:#b91c1c;background:#fff7f7;border-color:#fecaca}.status.warn{color:#92400e;background:#fffbeb;border-color:#fde68a}.panel{background:#fff;border:1px solid #d9e1e5;border-radius:8px;box-shadow:0 14px 34px rgba(22,33,38,.08);overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid #d9e1e5;background:#fbfcfd}.panel-head h2{margin:0;font-size:17px}.panel-body{padding:15px}.setup{margin-bottom:16px}.setup.hidden-ready{display:none}.setup-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;background:#dfe8eb;border-radius:8px;margin-bottom:14px}.tab{min-height:40px;border:0;border-radius:6px;background:transparent;color:#39505a;font-weight:700}.tab.active{background:#fff;color:#172126;box-shadow:0 4px 12px rgba(22,33,38,.08)}.mode{display:none}.mode.active{display:block}.reader{min-height:300px;border:1px dashed #aebdc5;border-radius:8px;background:#0f171a;overflow:hidden}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.btn{min-height:42px;padding:0 14px;border:0;border-radius:8px;background:#e7eef1;color:#172126;font-weight:700}.btn.primary{background:#0f766e;color:#fff}.btn.blue{background:#2563eb;color:#fff}.btn.warn{background:#fef3c7;color:#7c2d12}.btn.ghost{background:transparent;color:#64727a;border:1px solid #d9e1e5}.raw{min-height:38px;padding:9px 10px;border:1px solid #d9e1e5;border-radius:8px;background:#f4f7f8;color:#33444c;font-family:Consolas,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}.small-label{margin-top:12px;color:#64727a;font-size:13px;font-weight:750}.preview-wrap{display:grid;grid-template-columns:160px minmax(0,1fr);gap:14px;align-items:start}.preview{width:100%;aspect-ratio:3/4;border:1px solid #d9e1e5;border-radius:8px;background:#f4f7f8;object-fit:contain}.ocr-text{width:100%;min-height:190px;resize:vertical;border:1px solid #d9e1e5;border-radius:8px;padding:10px;background:#fbfcfd}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:750;color:#35464e}input,select,textarea{width:100%;min-height:42px;border:1px solid #d9e1e5;border-radius:8px;padding:9px 10px;background:#fff;color:#172126;box-sizing:border-box}textarea{min-height:82px;resize:vertical}input[readonly]{background:#f4f7f8;color:#61717a}.savebar{position:sticky;bottom:0;display:flex;justify-content:space-between;gap:10px;margin:15px -15px -15px;padding:13px 15px;border-top:1px solid #d9e1e5;background:rgba(255,255,255,.94)}.recent-list{display:grid;gap:8px}.recent-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px;border:1px solid #d9e1e5;border-radius:8px;background:#fbfcfd}.recent-title{font-weight:800;overflow-wrap:anywhere}.amount{color:#115e59;font-weight:850}.progress{height:8px;border-radius:999px;background:#dde7ea;overflow:hidden;margin-top:10px}.progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#0f766e,#2563eb)}.hidden{display:none!important}@media(max-width:920px){.layout{grid-template-columns:1fr}.topbar{display:block}.status{max-width:none;margin-top:10px}}@media(max-width:560px){.app{padding:12px}.preview-wrap,.form-grid,.setup-row{grid-template-columns:1fr}.savebar{flex-direction:column}.reader{min-height:250px}.btn{width:auto}.savebar .btn,.setup-row .btn{width:100%}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><h1>發票記帳掃描 v25</h1><p>QR 混合掃描 + Gemini 高畫質紙本發票判讀</p></div><div id="status" class="status">待命</div></header>
<section id="setupPanel" class="panel setup"><div class="panel-head"><h2>後端設定</h2></div><div class="panel-body"><div class="setup-row"><input id="gasUrl" placeholder="Apps Script /exec 網址"><button id="saveBackend" class="btn primary" type="button">記住</button></div><div class="setup-row" style="margin-top:10px"><input id="apiToken" placeholder="GAS API token"><input id="visionKey" placeholder="Gemini API key"></div><div class="hint">需要重設時，在網址後加 <code>?setup=1</code>。QR 掃描不花 Gemini 額度。</div></div></section>
<section class="layout"><div class="panel"><div class="panel-head"><h2>輸入來源</h2></div><div class="panel-body">
<nav class="tabs"><button class="tab active" data-mode="qr" type="button">QR</button><button class="tab" data-mode="ocr" type="button">OCR</button><button class="tab" data-mode="manual" type="button">手動</button></nav>
<section id="mode-qr" class="mode active"><div class="hint">電子發票請優先掃左邊 QR。品項成功時會用單行格式帶到備註。</div><div id="reader" class="reader"></div><div class="actions"><button id="liveQr" class="btn primary" type="button">即時掃描</button><button id="qrCamera" class="btn ghost" type="button">拍照掃 QR</button><button id="qrAlbum" class="btn ghost" type="button">選相簿 QR</button><button id="stopQr" class="btn ghost" type="button" disabled>停止</button><input id="qrCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="qrAlbumInput" class="hidden" type="file" accept="image/*"><button id="clearQr" class="btn warn" type="button">清除 QR</button></div><div class="small-label">左碼</div><div id="qrLeft" class="raw"></div><div class="small-label">右碼</div><div id="qrRight" class="raw"></div><div class="small-label">QR 品項 / 狀態</div><div id="qrItems" class="raw">尚未讀取</div></section>
<section id="mode-ocr" class="mode"><div class="hint">v25 使用你測到的溫和參數：放大 1.7 / 對比 1.06 / 字加深 2.75 / 銳化 0.35。</div><div class="actions"><button id="ocrCamera" class="btn primary" type="button">拍照辨識</button><button id="ocrAlbum" class="btn ghost" type="button">選相簿辨識</button><button id="runOcr" class="btn blue" type="button">Gemini 判讀</button><input id="ocrCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="ocrAlbumInput" class="hidden" type="file" accept="image/*"></div><div class="progress hidden" id="ocrProgress"><span></span></div><div class="preview-wrap" style="margin-top:14px"><img id="preview" class="preview" alt=""><textarea id="ocrText" class="ocr-text" placeholder="Gemini 回傳 JSON"></textarea></div></section>
<section id="mode-manual" class="mode"><div class="actions"><button id="manualCamera" class="btn primary" type="button">拍照附圖</button><button id="manualAlbum" class="btn ghost" type="button">選相簿附圖</button><input id="manualCameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="manualAlbumInput" class="hidden" type="file" accept="image/*"></div><div class="preview-wrap" style="margin-top:14px"><img id="manualPreview" class="preview" alt=""><div class="raw">手動建立資料時，也可以先拍照留在本機預覽；儲存不會上傳照片。</div></div></section>
</div></div>
<aside class="panel"><div class="panel-head"><h2>確認資料</h2><button id="resetForm" class="btn ghost" type="button">清空</button></div><div class="panel-body"><form id="invoiceForm" class="form-grid"><div class="field"><label for="invoiceNo">發票號碼</label><input id="invoiceNo" maxlength="10"></div><div class="field"><label for="invoiceDate">日期</label><input id="invoiceDate" type="date"></div><div class="field full"><label for="sellerName">賣方名稱</label><input id="sellerName"></div><div class="field"><label for="sellerTaxId">賣方統編</label><input id="sellerTaxId" inputmode="numeric" maxlength="8"></div><div class="field"><label for="buyerTaxId">買方統編</label><input id="buyerTaxId" inputmode="numeric" maxlength="8"></div><div class="field"><label for="totalAmount">含稅金額</label><input id="totalAmount" inputmode="decimal"></div><div class="field"><label for="untaxedAmount">未稅金額</label><input id="untaxedAmount" readonly></div><div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" readonly></div><div class="field"><label for="category">費用類別</label><select id="category"><option value="">未分類</option><option>五金用品</option><option>加油</option><option>停車費</option><option>餐費</option><option>文具</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option></select></div><div class="field"><label for="payer">付款人</label><input id="payer"></div><div class="field full"><label for="note">備註</label><textarea id="note"></textarea></div></form><div class="savebar"><span id="saveHint">確認後寫入試算表</span><button id="saveInvoice" class="btn primary" type="button">儲存</button></div></div></aside>
</section>
<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>最近儲存</h2><button id="refreshRecent" class="btn ghost" type="button">重新整理</button></div><div class="panel-body"><div id="recentList" class="recent-list"></div></div></section>
</main>
<script>
(function(){
const state={mode:'qr',sourceType:'QR',qrLeft:'',qrRight:'',imageData:'',imageName:'',ocrText:'',scanner:null,scanning:false,lastQr:'',lastQrAt:0};
const fieldIds=['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','untaxedAmount','taxAmount','category','payer','note'];
const $=id=>document.getElementById(id);
document.addEventListener('DOMContentLoaded',init);
function init(){bindEvents();loadSettings();setupMoneySync();renderRecent(loadRecent());}
function bindEvents(){document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));$('saveBackend').addEventListener('click',saveSettings);$('liveQr').addEventListener('click',startQrScanner);$('qrCamera').addEventListener('click',()=>$('qrCameraInput').click());$('qrAlbum').addEventListener('click',()=>$('qrAlbumInput').click());$('stopQr').addEventListener('click',stopQrScanner);$('qrCameraInput').addEventListener('change',scanQrFromPhoto);$('qrAlbumInput').addEventListener('change',scanQrFromPhoto);$('clearQr').addEventListener('click',clearQr);$('ocrCamera').addEventListener('click',()=>$('ocrCameraInput').click());$('ocrAlbum').addEventListener('click',()=>$('ocrAlbumInput').click());$('ocrCameraInput').addEventListener('change',handlePhotoInput);$('ocrAlbumInput').addEventListener('change',handlePhotoInput);$('manualCamera').addEventListener('click',()=>$('manualCameraInput').click());$('manualAlbum').addEventListener('click',()=>$('manualAlbumInput').click());$('manualCameraInput').addEventListener('change',handleManualPhotoInput);$('manualAlbumInput').addEventListener('change',handleManualPhotoInput);$('runOcr').addEventListener('click',runGeminiOcr);$('saveInvoice').addEventListener('click',saveInvoice);$('resetForm').addEventListener('click',resetAll);$('refreshRecent').addEventListener('click',()=>renderRecent(loadRecent()));}
function loadSettings(){const url=localStorage.getItem('gas-url')||'';const token=localStorage.getItem('invoice-api-token')||'';const gemini=localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';$('gasUrl').value=url;$('apiToken').value=token;$('visionKey').value=gemini;const forceSetup=new URLSearchParams(location.search).has('setup');$('setupPanel').classList.toggle('hidden-ready',Boolean(url&&token&&gemini&&!forceSetup));}
function saveSettings(){const url=$('gasUrl').value.trim();const token=$('apiToken').value.trim();const gemini=$('visionKey').value.trim();if(!(url.startsWith('https://script.google.com/macros/s/')&&url.endsWith('/exec'))){setStatus('請貼上 Apps Script /exec 結尾網址','error');return;}if(token.length<20){setStatus('請貼上 GAS API token','error');return;}if(gemini.length<20){setStatus('請貼上 Gemini API key','error');return;}localStorage.setItem('gas-url',url);localStorage.setItem('invoice-api-token',token);localStorage.setItem('gemini-api-key',gemini);localStorage.removeItem('vision-api-key');$('setupPanel').classList.add('hidden-ready');setStatus('已記住 GAS 與 Gemini 設定');}
function getGasUrl(){return localStorage.getItem('gas-url')||'';}function getApiToken(){return localStorage.getItem('invoice-api-token')||'';}function getGeminiKey(){return localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';}
function setupMoneySync(){const total=$('totalAmount'),untaxed=$('untaxedAmount'),tax=$('taxAmount');function recalc(){const n=Number(String(total.value||'').replace(/,/g,'').trim());if(!Number.isFinite(n)||n<=0){untaxed.value='';tax.value='';return;}const before=Math.floor(n/1.05);untaxed.value=String(before);tax.value=String(n-before);}window.recalcMoney=recalc;total.addEventListener('input',recalc);total.addEventListener('change',recalc);recalc();}
function clearFieldsForNewScan(){fieldIds.forEach(id=>{if($(id))$(id).value='';});state.ocrText='';$('ocrText').value='';if(window.recalcMoney)window.recalcMoney();}
function setMode(mode){state.mode=mode;state.sourceType=mode==='qr'?'QR':mode==='ocr'?'Gemini OCR':'手動';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('.mode').forEach(s=>s.classList.remove('active'));$(`mode-${mode}`).classList.add('active');if(mode!=='qr')stopQrScanner();setStatus(mode==='qr'?'QR 模式：本機掃描，不花 Gemini 額度':mode==='ocr'?'OCR 模式：使用 Gemini':'手動模式');}
async function startQrScanner(){if(!window.Html5Qrcode){setStatus('QR 套件還沒載入，請重新整理網頁','error');return;}if(state.scanning)return;try{const opt=window.Html5QrcodeSupportedFormats?{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE]}:undefined;state.scanner=state.scanner||new Html5Qrcode('reader',opt);setStatus('正在開啟相機...');$('liveQr').disabled=true;$('stopQr').disabled=true;await state.scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const s=Math.floor(Math.min(w,h)*0.55);return{width:s,height:s};},aspectRatio:1.333},handleQrScan,()=>{});state.scanning=true;$('stopQr').disabled=false;setStatus('掃描中：請先對準左邊 QR');}catch(e){$('liveQr').disabled=false;$('stopQr').disabled=true;setStatus(`無法啟動相機：${e.message||e}`,'error');}}
async function stopQrScanner(){if(!state.scanner||!state.scanning)return;try{await state.scanner.stop();}catch(e){setStatus(`停止掃描失敗：${e.message||e}`,'error');}finally{state.scanning=false;$('liveQr').disabled=false;$('stopQr').disabled=true;}}
async function scanQrFromPhoto(e){const file=e.target.files&&e.target.files[0];if(!file)return;try{await stopQrScanner();setStatus('照片 QR 混合辨識中');const raws=await detectQrCodes(file);if(!raws.length)throw new Error('沒有讀到 QR');raws.forEach(raw=>handleQrScan(raw));if(state.qrLeft)setStatus('照片 QR 已讀取，主資料已填入');else setStatus('照片只讀到右碼，請再拍左邊 QR','warn');}catch(err){setStatus(`照片裡沒有讀到 QR。請只拍 QR 區域，讓 QR 佔畫面 1/3 以上。${err.message?` (${err.message})`:''}`,'warn');}finally{e.target.value='';}}
async function detectQrCodes(file){const out=[];if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const bitmap=await createImageBitmap(file);const codes=await detector.detect(bitmap);if(bitmap.close)bitmap.close();codes.forEach(c=>{if(c.rawValue)out.push(c.rawValue);});}catch(e){}}if(window.Html5Qrcode){try{const scanner=state.scanner||new Html5Qrcode('reader');state.scanner=scanner;const raw=await scanner.scanFile(file,true);if(raw)out.push(raw);}catch(e){}}return unique(out);}
function handleQrScan(rawValue){const raw=String(rawValue||'').trim();if(!raw)return;const now=Date.now();if(raw===state.lastQr&&now-state.lastQrAt<1200)return;state.lastQr=raw;state.lastQrAt=now;const isRight=raw.startsWith('**');if(!isRight){const nextNo=raw.slice(0,10).toUpperCase();const currentNo=(state.qrLeft||'').slice(0,10).toUpperCase();if(nextNo&&nextNo!==currentNo){clearFieldsForNewScan();state.qrLeft='';state.qrRight='';$('qrLeft').textContent='';$('qrRight').textContent='';$('qrItems').textContent='尚未讀取';}}if(isRight)state.qrRight=raw;else state.qrLeft=raw;renderQrState();const parsed=parseTaiwanInvoiceQr(state.qrLeft,state.qrRight);if(parsed){applyData(parsed);const item=parseQrItems(state.qrLeft,state.qrRight);if(item)applyQrItemsToNote(item);setStatus(item?'QR 已讀取，主資料與品項已填入備註':'QR 左碼已讀取，主資料已填入；沒有可靠品項');return;}setStatus(isRight?'已讀到右碼。主資料需要左邊 QR。':'已讀到 QR，但格式不像台灣電子發票左碼。','warn');}
function clearQr(){state.qrLeft='';state.qrRight='';$('qrLeft').textContent='';$('qrRight').textContent='';$('qrItems').textContent='尚未讀取';setStatus('QR 已清除');}
function renderQrState(){ $('qrLeft').textContent=state.qrLeft; $('qrRight').textContent=state.qrRight; const item=parseQrItems(state.qrLeft,state.qrRight); if(item){$('qrItems').textContent=item; applyQrItemsToNote(item);}else if(state.qrLeft){$('qrItems').textContent='已讀取左碼；沒有可靠品項或品項未完整。';}else if(state.qrRight){$('qrItems').textContent='已讀取右碼；請再掃左碼。';}else{$('qrItems').textContent='尚未讀取';} }
function applyQrItemsToNote(item){const note=$('note');if(!note||!item)return;note.value=formatItemsOneLine(item);}
function formatItemsOneLine(value){const rows=Array.isArray(value)?value:String(value||'').replace(/^QR品項[:：]\s*/,'').split(/[\n；;]+/).map(s=>s.trim()).filter(Boolean);const already=rows.every(row=>/^\d+[.)、]\s*/.test(row));return rows.map((row,i)=>{const clean=row.replace(/\s+/g,' ').trim();return already?clean:`${i+1}. ${clean.replace(/^\d+[.)、]\s*/,'')}`;}).join('；');}
function parseTaiwanInvoiceQr(left,right){if(!left||left.startsWith('**')||left.length<77)return null;const invoiceNo=left.slice(0,10).toUpperCase();if(!/^[A-Z]{2}[0-9]{8}$/.test(invoiceNo))return null;const sales=hexAmount(left.slice(21,29));const total=hexAmount(left.slice(29,37));return{invoiceNo,invoiceDate:rocToIso(left.slice(10,17)),sellerTaxId:cleanTaxId(left.slice(45,53)),buyerTaxId:cleanTaxId(left.slice(37,45)),totalAmount:total,untaxedAmount:total?Math.floor(total/1.05):'',taxAmount:total?total-Math.floor(total/1.05):''};}
function parseQrItems(left,right){if(!left||left.startsWith('**')||left.length<78)return'';let tail=left.slice(77);if(right&&right.length>2)tail+=right.startsWith('**')?right.slice(2):right;const parts=tail.split(':');if(parts.length<6)return'';const encoding=(parts[4]||'').trim();let data=parts.slice(5).join(':');data=decodeQrItemData(data,encoding);const tokens=data.split(':').map(cleanDisplayText).filter(Boolean);const rows=[];for(let i=0;i+2<tokens.length;i+=3){const name=tokens[i],qty=tokens[i+1],price=tokens[i+2];if(!name||!/[\u4e00-\u9fffA-Za-z0-9]/.test(name))continue;rows.push(`${name} x${qty} $${price}`);}if(rows.length)return formatItemsOneLine(rows);const fallback=cleanDisplayText(data);return looksReadable(fallback)?formatItemsOneLine(fallback):'';}
function decodeQrItemData(data,encoding){const candidates=[data];if(encoding==='2')candidates.push(decodeBase64Utf8(data));if(encoding==='0'){candidates.push(recoverBig5FromSjis(data));candidates.push(recoverBig5FromLatin1(data));}if(encoding==='1')candidates.push(cleanDisplayText(data));return candidates.map(cleanDisplayText).filter(Boolean).sort((a,b)=>textScore(b)-textScore(a))[0]||cleanDisplayText(data);}
function decodeBase64Utf8(v){try{const bin=atob(String(v||'').replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const utf8=new TextDecoder('utf-8').decode(bytes);let out=utf8;try{const big5=new TextDecoder('big5').decode(bytes);if(textScore(big5)>textScore(out))out=big5;}catch(e){}return out;}catch(e){return'';}}
function recoverBig5FromSjis(str){try{if(!window.Encoding)return'';const unicode=Encoding.stringToCode(str);const sjis=Encoding.convert(unicode,{to:'SJIS',from:'UNICODE'});return new TextDecoder('big5').decode(new Uint8Array(sjis));}catch(e){return'';}}
function recoverBig5FromLatin1(str){try{const bytes=Uint8Array.from(Array.from(String(str||''),c=>c.charCodeAt(0)&255));return new TextDecoder('big5').decode(bytes);}catch(e){return'';}}
function textScore(s){let score=0;for(const c of String(s||'')){const code=c.charCodeAt(0);if(c==='�')score-=20;else if(isKanaOrHangul(c))score-=8;else if(code>=0x4e00&&code<=0x9fff)score+=5;else if(/[A-Za-z0-9]/.test(c))score+=2;else if(' .,:;/-_$%()（）*#&+'.includes(c))score+=1;else score-=2;}return score;}function looksReadable(s){return textScore(s)>Math.max(6,String(s||'').length*.4);}function hexAmount(v){return/^[0-9a-fA-F]{8}$/.test(v)?parseInt(v,16):'';}function rocToIso(v){if(!/^[0-9]{7}$/.test(v))return'';return`${Number(v.slice(0,3))+1911}-${v.slice(3,5)}-${v.slice(5,7)}`;}function cleanTaxId(v){return/^[0-9]{8}$/.test(v)&&v!=='00000000'?v:'';}
async function handlePhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;clearFieldsForNewScan();state.imageData=await prepareOcrImage(file);state.imageName=file.name;$('preview').src=state.imageData;setStatus('照片已載入，已套用溫和文字加深參數');e.target.value='';}
async function handleManualPhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;state.imageData=await resizeImage(file,1800,0.9);state.imageName=file.name;$('manualPreview').src=state.imageData;setStatus('照片已載入');e.target.value='';}
async function prepareOcrImage(file){return resizeImage(file,2200,0.95,'tuned');}
async function resizeImage(file,max=1800,quality=0.9,mode=false){const src=await readFile(file);const img=await loadImage(src);const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d',{willReadFrequently:Boolean(mode)});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);if(mode==='tuned')applyTunedOcr(ctx,c.width,c.height);else if(mode==='mono')makeCrispMono(ctx,c.width,c.height);else if(mode)softSharpenCanvas(ctx,c.width,c.height);return c.toDataURL('image/jpeg',quality);}
function applyTunedOcr(ctx,w,h){const params={contrast:1.06,darken:2.75,highlight:1,sharpen:.35,range:2};const src=ctx.getImageData(0,0,w,h);const data=src.data;const out=new Uint8ClampedArray(data.length);for(let i=0;i<data.length;i+=4){const g=data[i]*.299+data[i+1]*.587+data[i+2]*.114;let v=(g-128)*params.contrast+128;if(v<205)v-=params.darken*(1-(v/255));if(v>218)v=218+(v-218)*params.highlight;v=Math.max(0,Math.min(255,v));out[i]=out[i+1]=out[i+2]=v;out[i+3]=255;}ctx.putImageData(new ImageData(out,w,h),0,0);softSharpenCanvas(ctx,w,h,params.sharpen,params.range);}
function makeCrispMono(ctx,w,h){if(w<3||h<3)return;const src=ctx.getImageData(0,0,w,h);const data=src.data;const gray=new Float32Array(w*h);let sum=0;for(let i=0,p=0;i<data.length;i+=4,p++){const g=data[i]*.299+data[i+1]*.587+data[i+2]*.114;gray[p]=g;sum+=g;}const mean=sum/gray.length;const out=new Uint8ClampedArray(data.length);const contrast=1.55;const darkBoost=24;for(let y=0;y<h;y++){for(let x=0;x<w;x++){const p=y*w+x;const i=p*4;let g=(gray[p]-mean)*contrast+mean;if(g<190)g-=darkBoost;if(g>225)g=245+(g-225)*.25;g=Math.max(0,Math.min(255,g));out[i]=out[i+1]=out[i+2]=g;out[i+3]=255;}}const imgData=new ImageData(out,w,h);ctx.putImageData(imgData,0,0);softSharpenCanvas(ctx,w,h,.48);}
function softSharpenCanvas(ctx,w,h,amount=.32,range=1){if(w<3||h<3)return;const src=ctx.getImageData(0,0,w,h);const data=src.data;const out=new Uint8ClampedArray(data);const r=Math.max(1,Math.round(range));for(let y=r;y<h-r;y++){for(let x=r;x<w-r;x++){const i=(y*w+x)*4;for(let ch=0;ch<3;ch++){const center=data[i+ch];const blur=(data[((y-r)*w+x)*4+ch]+data[((y+r)*w+x)*4+ch]+data[(y*w+x-r)*4+ch]+data[(y*w+x+r)*4+ch])*.25;out[i+ch]=Math.max(0,Math.min(255,center+(center-blur)*amount));}}}ctx.putImageData(new ImageData(out,w,h),0,0);}
function readFile(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function runGeminiOcr(){if(!state.imageData){setStatus('請先拍照或選相簿照片','error');return;}const key=getGeminiKey();if(!key){setStatus('請先到設定填 Gemini API key','error');$('setupPanel').classList.remove('hidden-ready');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setProgress(12);setStatus('Gemini 正在看發票...');try{const result=await callGeminiInvoice(state.imageData,key);setProgress(82);state.ocrText=JSON.stringify(result,null,2);$('ocrText').value=state.ocrText;applyGeminiInvoice(result);setProgress(100);setStatus('Gemini 判讀完成。請檢查欄位，錯的直接手改含稅總額即可。');}catch(e){setStatus('Gemini 失敗：'+(e.message||e),'error');}finally{$('runOcr').disabled=false;setTimeout(()=>setProgress(0),600);$('ocrProgress').classList.add('hidden');}}
async function callGeminiInvoice(dataUrl,key){const base64=String(dataUrl).replace(/^data:image\/[a-zA-Z0-9.+-]+;base64,/,'');const prompt=['你是台灣公司記帳助理。請讀取照片中的台灣發票或收銀機統一發票，只輸出 JSON。','看不清楚或沒有標示就填空字串，不要編造。日期若是民國年請轉西元 YYYY/MM/DD，例如 115/02/15 是 2026/02/15。','發票號碼是兩個英文字母加八個數字。賣方統編通常在 NO、統編、營業人附近。買方統編只有明確標示買方/買受人/客戶統編才填，不能用流水號。','請特別分辨點陣發票數字 0 與 8：0 是單一長橢圓或單一封閉圈，中間可能有斜線或淡色缺口；8 是上下兩個封閉圈，中間有明顯收腰或分隔。不要因為 8 的中間淡掉就自動改成 0，也不要因為 0 中間有斜線就改成 8。','品項右側金額請逐字看右側靠右的金額欄。每個數字都依字形判斷：有上下兩個圈或中間收腰者判為 8；只有單一橢圓、沒有上下分隔者判為 0。不要套用固定金額範例。','可以用總計與品項金額交叉檢查，但不能為了湊總計而改變肉眼清楚的 0/8。備註中的每個品項金額要照照片右側金額欄讀取，不要自行修正成常見數字。','含稅總額抓實際交易總計/合計/總計/稅計，不要抓現金、找零、累計點、本次點、電話、地址、流水號。','收銀機發票品項通常左邊是品名，右邊靠右數字才是本次金額；品名中的 120元、100元、98元可能只是商品名稱的一部分。備註只放品項與右側金額，請用單行格式：1. 品項 金額；2. 品項 金額；不要換行，不要放警告文字。','未稅=floor(含稅總額/1.05)，稅額=含稅總額-未稅。費用類別只能選：五金用品、加油、停車費、餐費、文具、設備、軟體、交際、其他、未分類。'].join('\n');const schema={type:'OBJECT',properties:{invoiceNo:{type:'STRING'},invoiceDate:{type:'STRING'},sellerName:{type:'STRING'},sellerTaxId:{type:'STRING'},buyerTaxId:{type:'STRING'},totalAmount:{type:'INTEGER'},untaxedAmount:{type:'INTEGER'},taxAmount:{type:'INTEGER'},category:{type:'STRING'},note:{type:'STRING'},confidence:{type:'STRING'},warnings:{type:'ARRAY',items:{type:'STRING'}}},required:['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','untaxedAmount','taxAmount','category','note','confidence','warnings']};const body={contents:[{parts:[{text:prompt},{inlineData:{mimeType:'image/jpeg',data:base64}}]}],generationConfig:{temperature:0,responseMimeType:'application/json',responseSchema:schema}};const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.error)throw new Error((json.error&&json.error.message)||('HTTP '+res.status));const text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;if(!text)throw new Error('Gemini 沒有回傳文字');return JSON.parse(String(text).replace(/^\x60\x60\x60(?:json)?\s*/,'').replace(/\s*\x60\x60\x60$/,'').trim());}
function applyGeminiInvoice(r){clearFieldsForNewScan();const total=Number(r.totalAmount)||0;const untaxed=total>0?Math.floor(total/1.05):(Number(r.untaxedAmount)||0);const tax=total>0?total-untaxed:(Number(r.taxAmount)||0);applyData({invoiceNo:r.invoiceNo||'',invoiceDate:toDateInput(r.invoiceDate||''),sellerName:r.sellerName||'',sellerTaxId:r.sellerTaxId||'',buyerTaxId:r.buyerTaxId||'',totalAmount:total||'',untaxedAmount:untaxed||'',taxAmount:tax||'',category:r.category&&r.category!=='未分類'?r.category:'',note:formatItemsOneLine(r.note||'')});}
function toDateInput(v){const m=String(v||'').match(/(20[0-9]{2})[\/.-]([0-9]{1,2})[\/.-]([0-9]{1,2})/);return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):v;}
function applyData(data){Object.entries(data).forEach(([k,v])=>{if($(k))$(k).value=v;});if(window.recalcMoney)window.recalcMoney();}
function setProgress(v){$('ocrProgress').querySelector('span').style.width=`${Math.max(0,Math.min(100,Math.round(v)))}%`;}
function buildPayload(){const p={};fieldIds.forEach(id=>p[id]=$(id).value.trim());p.sourceType=state.sourceType;p.status='已確認';p.note=formatItemsOneLine(p.note);return p;}
async function saveInvoice(){const payload=buildPayload();if(!payload.invoiceNo&&!payload.totalAmount){setStatus('請至少填發票號碼或含稅金額','error');return;}const url=getGasUrl();const token=getApiToken();if(!url||!token){setStatus('缺少 GAS /exec 網址或 API token','error');$('setupPanel').classList.remove('hidden-ready');return;}const sendPayload={sourceType:payload.sourceType,status:payload.status,invoiceNo:payload.invoiceNo,invoiceDate:payload.invoiceDate,sellerTaxId:payload.sellerTaxId,buyerTaxId:payload.buyerTaxId,totalAmount:payload.totalAmount,untaxedAmount:payload.untaxedAmount,taxAmount:payload.taxAmount,category:payload.category,payer:payload.payer,note:payload.note};$('saveInvoice').disabled=true;setStatus('正在送到 Apps Script，只送簡化會計欄位...');try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token,payload:sendPayload})});saveLocal(sendPayload);$('saveHint').textContent='已送出到 Apps Script';setStatus('已送出。若 Google Sheet 沒新增，請檢查 GAS 部署版本或 token。');renderRecent(loadRecent());}catch(e){setStatus('送出失敗：'+(e.message||e),'error');}finally{$('saveInvoice').disabled=false;}}
function saveLocal(p){const rows=loadRecent();rows.unshift({createdAt:new Date().toLocaleString('zh-TW'),...p});localStorage.setItem('invoice-recent',JSON.stringify(rows.slice(0,50)));}function loadRecent(){try{return JSON.parse(localStorage.getItem('invoice-recent')||'[]');}catch(e){return[];}}
function renderRecent(rows){const list=$('recentList');list.innerHTML='';if(!rows.length){list.innerHTML='<div class="raw">尚無資料</div>';return;}rows.slice(0,8).forEach(r=>{const d=document.createElement('div');d.className='recent-item';d.innerHTML=`<div><div class='recent-title'>${esc(r.invoiceNo||'未填發票號碼')}</div><div class='recent-meta'>${esc(r.invoiceDate||r.createdAt||'')} ${esc(r.sellerTaxId||'')}</div></div><div class='amount'>$${esc(r.totalAmount||'')}</div>`;list.appendChild(d);});}
function resetAll(){fieldIds.forEach(id=>$(id).value='');state.imageData='';state.imageName='';state.ocrText='';$('ocrText').value='';$('preview').removeAttribute('src');$('manualPreview').removeAttribute('src');clearQr();if(window.recalcMoney)window.recalcMoney();setStatus('已清空');}
function cleanDisplayText(text){let out='';for(const c of String(text||'')){out+=isKanaOrHangul(c)?' ':isAllowedDisplayChar(c)?c:' ';}return squeezeSpaces(out).trim();}function isKanaOrHangul(c){const code=c.charCodeAt(0);return(code>=0x3040&&code<=0x30ff)||(code>=0x31f0&&code<=0x31ff)||(code>=0xac00&&code<=0xd7af);}function isAllowedDisplayChar(c){const code=c.charCodeAt(0);return(code>=0x4e00&&code<=0x9fff)||(code>=48&&code<=57)||(code>=65&&code<=90)||(code>=97&&code<=122)||' .,:;/-_$%()（）*#&+'.includes(c);}function squeezeSpaces(s){let out='',last=false;for(const c of String(s||'')){const sp=c===' '||c===String.fromCharCode(9);if(sp){if(!last)out+=' ';last=true;}else{out+=c;last=false;}}return out;}function unique(list){return[...new Set(list.map(v=>String(v||'').trim()).filter(Boolean))];}
function setStatus(msg,type){const el=$('status');el.textContent=msg;el.classList.remove('error','warn');if(type)el.classList.add(type);}function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
})();
