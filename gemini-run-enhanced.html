<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gemini 溫和強化判讀測試</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(92vw,460px);padding:22px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 16px 36px rgba(22,33,38,.08)}h1{margin:0 0 10px;font-size:22px}p{margin:0;color:#66757f;line-height:1.6}.error{color:#b91c1c;white-space:pre-wrap}.btn{display:inline-block;margin-top:12px;padding:10px 14px;border-radius:8px;background:#0f766e;color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
<main class="box">
  <h1>正在載入 Gemini 溫和強化版</h1>
  <p id="msg">請稍等...</p>
</main>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    const res=await fetch('gemini-run.html?base=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('讀取 Gemini 測試頁失敗 HTTP ' + res.status);
    let html=await res.text();
    html=html.replace('<title>Gemini 發票判讀測試</title>','<title>Gemini 溫和強化判讀測試</title>');
    html=html.replace('<h1>Gemini 發票判讀測試</h1>','<h1>Gemini 溫和強化判讀測試</h1>');
    html=html.replace('直接把原色照片交給 Gemini 看圖判斷欄位。這頁不會改 v9，也不會寫入試算表。','先用你第一次覺得肉眼最清楚的溫和強化處理照片，再交給 Gemini 看圖判斷欄位。這頁不會改 v9，也不會寫入試算表。');
    html=html.replace('<span class="pill">使用原圖</span>','<span class="pill">使用溫和強化圖</span>');
    html=html.replace('你說原色照片給 Gemini 很準，所以這頁預設完全不做灰階、加深、銳化。Gemini 會自己看版面並回傳固定 JSON 欄位。','這頁會先產生溫和強化圖再送 Gemini：放大 1、對比 0.8、字加深 2.8、亮部保留 1、銳化 1.6、局部範圍 5。');
    html=html.replace('<h2>原圖</h2>','<h2>溫和強化圖</h2>');
    const helpers=String.raw`
const geminiEnhanceParams={scale:1,contrast:.8,ink:2.8,highlight:1,sharp:1.6,local:5};
async function enhanceForGemini(file){const src=await readFile(file);const img=await loadImage(src);const scale=fitGeminiScale(img,geminiEnhanceParams.scale);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d',{willReadFrequently:true});ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,c.width,c.height);const data=ctx.getImageData(0,0,c.width,c.height);enhanceGeminiPixels(data);ctx.putImageData(data,0,0);state.mimeType='image/jpeg';return c.toDataURL('image/jpeg',0.92);}
function fitGeminiScale(img,base){const long=Math.max(img.width,img.height);return Math.min(base,1800/long)||1;}
function enhanceGeminiPixels(imageData){const p=geminiEnhanceParams,d=imageData.data,w=imageData.width,h=imageData.height,len=w*h;const gray=new Uint8ClampedArray(len),hist=new Uint32Array(256);for(let i=0,px=0;i<d.length;i+=4,px++){const g=Math.round(d[i]*.299+d[i+1]*.587+d[i+2]*.114);gray[px]=g;hist[g]++;}const lo=geminiPercentile(hist,len,.01),hi=Math.max(lo+50,geminiPercentile(hist,len,.995));const norm=new Uint8ClampedArray(len);for(let px=0;px<len;px++){let v=(gray[px]-lo)*245/(hi-lo)+8;v=(v-128)*p.contrast+128;norm[px]=geminiClamp(v);}const r=p.local;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const idx=y*w+x;let sum=0,count=0;for(let yy=-r;yy<=r;yy++){const ny=y+yy;if(ny<0||ny>=h)continue;for(let xx=-r;xx<=r;xx++){const nx=x+xx;if(nx<0||nx>=w)continue;sum+=norm[ny*w+nx];count++;}}const local=sum/count;let v=norm[idx];const darker=Math.max(0,local-v);if(darker>3)v-=darker*p.ink;if(x>0&&x<w-1&&y>0&&y<h-1){const blur=(norm[idx-1]+norm[idx+1]+norm[idx-w]+norm[idx+w])/4;v+=(norm[idx]-blur)*p.sharp;}if(v>235)v=235+(v-235)*p.highlight;v=geminiClamp(v);const i=idx*4;d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255;}}
function geminiPercentile(hist,total,pct){let target=Math.max(1,Math.floor(total*pct)),sum=0;for(let i=0;i<hist.length;i++){sum+=hist[i];if(sum>=target)return i;}return 255;}
function geminiClamp(v){return v<0?0:v>255?255:Math.round(v);}
`;
    html=html.replace('const fields=[', helpers + '\nconst fields=[');
    html=html.replace("state.imageData=await resizeForGemini(file);$('preview').src=state.imageData;setStatus('照片已載入，按「Gemini 判讀」。');", "setStatus('正在產生溫和強化圖...');state.imageData=await enhanceForGemini(file);$('preview').src=state.imageData;setStatus('溫和強化圖已產生，按「Gemini 判讀」。');");
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    msg.className='error';
    msg.textContent='載入失敗：' + (err && err.message ? err.message : err);
    const a=document.createElement('a');
    a.className='btn';
    a.href='gemini-run.html?fallback=' + Date.now();
    a.textContent='改開原色 Gemini 頁';
    document.querySelector('.box').appendChild(a);
  }
})();
</script>
</body>
</html>
