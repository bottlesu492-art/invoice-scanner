<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>發票記帳掃描 v10</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(92vw,460px);padding:22px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 16px 36px rgba(22,33,38,.08)}h1{margin:0 0 10px;font-size:22px}p{margin:0 0 14px;color:#66757f;line-height:1.6}.error{color:#b91c1c;white-space:pre-wrap}.btn{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:8px;background:#0f766e;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <h1>正在載入 v10</h1>
    <p>v10：QR 維持原流程，紙本發票改用 Gemini 判讀。</p>
    <p id="msg">請稍等...</p>
  </main>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    const res=await fetch('index.html?v10=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('讀取主程式失敗 HTTP ' + res.status);
    let html=await res.text();

    html=html.replace('<title>發票記帳掃描</title>','<title>發票記帳掃描 v10</title>');
    html=html.replace('發票記帳掃描</h1><p>QR 本機掃描 + Cloud Vision OCR</p>','發票記帳掃描 v10</h1><p>QR 本機掃描 + Gemini 紙本發票判讀</p>');
    html=html.replace('Cloud Vision API key','Gemini API key');
    html=html.replace('貼上已限制 Cloud Vision API + GitHub Pages 網域的 API key','貼上 Google AI Studio 產生的 Gemini API key');
    html=html.replace('OCR 會呼叫 Google Cloud Vision；QR 掃描不會使用 Vision 額度。','紙本 OCR 會呼叫 Gemini API；QR 掃描不會使用 Gemini 額度。');
    html=html.replace('Cloud Vision OCR','Gemini 發票判讀');
    html=html.replace('使用 Cloud Vision','使用 Gemini');
    html=html.replace('辨識文字','Gemini 判讀');
    html=html.replace('總金額</label>','含稅總額</label>');
    html=html.replace('<div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" inputmode="decimal"></div>','<div class="field"><label for="untaxedAmount">未稅金額</label><input id="untaxedAmount" inputmode="decimal" readonly></div><div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" inputmode="decimal" readonly></div>');
    html=html.replace('<option value="">未分類</option><option>交通</option><option>餐費</option><option>文具</option><option>郵資</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option>','<option value="">未分類</option><option>五金用品</option><option>加油</option><option>停車費</option><option>餐費</option><option>文具</option><option>設備</option><option>軟體</option><option>交際</option><option>其他</option>');
    html=html.replace(/'totalAmount',\s*'taxAmount'/, "'totalAmount','untaxedAmount','taxAmount'");
    html=html.replace('function init(){bindEvents();loadSettings();renderRecent(loadRecent());}', 'function init(){bindEvents();loadSettings();setupMoneySyncV10();renderRecent(loadRecent());}');
    html=html.replace('function bindEvents(){', "function setupMoneySyncV10(){const total=$('totalAmount'),untaxed=$('untaxedAmount'),tax=$('taxAmount');if(!total||!untaxed||!tax)return;untaxed.readOnly=true;tax.readOnly=true;window.recalcInvoiceMoneyV10=function(){const n=Number(String(total.value||'').replace(/,/g,'').trim());if(!Number.isFinite(n)||n<=0){untaxed.value='';tax.value='';return;}const before=Math.floor(n/1.05);untaxed.value=String(before);tax.value=String(n-before);};total.addEventListener('input',window.recalcInvoiceMoneyV10);total.addEventListener('change',window.recalcInvoiceMoneyV10);setTimeout(window.recalcInvoiceMoneyV10,0);}function bindEvents(){");
    html=html.replace("const vision=localStorage.getItem('vision-api-key')||'';", "const vision=localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';");
    html=html.replace("localStorage.setItem('vision-api-key',vision);", "localStorage.setItem('gemini-api-key',vision);localStorage.removeItem('vision-api-key');");
    html=html.replace("function getVisionKey(){return localStorage.getItem('vision-api-key')||'';}", "function getVisionKey(){return localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';}");
    html=html.replace('Vision OCR 原文','Gemini 回傳 JSON');

    const geminiRun = String.raw`async function runVisionOcr(){if(!state.imageData){setStatus('請先拍照或選相簿照片','error');return;}const key=getVisionKey();if(!key){setStatus('請先到設定填 Gemini API key','error');$('setupPanel').classList.remove('hidden-ready');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setProgress(12);setStatus('Gemini 正在看發票...');try{const result=await callGeminiInvoiceV10(state.imageData,key);setProgress(82);$('ocrText').value=JSON.stringify(result,null,2);applyGeminiInvoiceV10(result);setProgress(100);setStatus('Gemini 判讀完成。請檢查欄位，錯的直接手改含稅總額即可。');}catch(e){setStatus('Gemini 失敗：'+(e.message||e),'error');}finally{$('runOcr').disabled=false;setTimeout(()=>setProgress(0),600);$('ocrProgress').classList.add('hidden');}}
async function callGeminiInvoiceV10(dataUrl,key){const base64=String(dataUrl).replace(/^data:image\/[a-zA-Z0-9.+-]+;base64,/,'');const prompt=['你是台灣公司記帳助理。請仔細閱讀照片中的台灣發票、收銀機統一發票、傳統紙本發票或電子發票列印紙。','請只根據照片可見資訊填欄位，不要編造。看不清楚或沒有標示就填空字串。','日期若是民國年，請轉成西元 YYYY/MM/DD。例：115/02/15 轉 2026/02/15。','發票號碼格式為兩個英文字母加八個數字，例如 VW32017096。','賣方統編通常在 NO、統編、營業人附近。買方統編只有明確標示買方、買受人、客戶統編時才填；不要把交易流水號、隨機碼、時間旁數字填成買方統編。','含稅總額請抓實際交易總計/合計/總計/稅計後面的金額，不要抓現金、找零、累計點、本次點、電話、地址、流水號。','台灣收銀機點陣字的 0 常常中間有斜線，看起來像 8；判讀數字時請注意 0 和 8 的差異。尤其日期、統編、發票號碼、金額中的 0 不要因斜線誤讀成 8。','收銀機發票的品項通常是左邊品項名稱、右邊靠右對齊金額。品項名稱裡可能有規格或商品名，例如「120元柴語錄」、「100元(柴)超」、「98元不沾黏剪」；這些左邊文字中的 120、100、98 不一定是本次金額。本次品項金額要優先讀同一行最右側靠右對齊的數字，例如右側的 188、90、81。','如果品項列左邊和右邊都有數字，請把左邊數字當作品名/規格的一部分，右邊最後一個獨立金額才當作該品項金額。總額也應該用各品項右側金額或總計列驗算，不要用品名裡的數字相加。','未稅金額與稅額可依含稅總額用台灣 5% 營業稅反推：未稅=floor(含稅總額/1.05)，稅額=含稅總額-未稅。','費用類別只能選：五金用品、加油、停車費、餐費、文具、設備、軟體、交際、其他、未分類。','備註只放品項摘要與品項金額，每行一個品項，格式盡量為「品項  金額」。不要在備註寫提醒、警告、總額不一致、看不清楚、需要人工確認等文字；這些放在 warnings 欄位即可。'].join('\n');const schema={type:'OBJECT',properties:{invoiceNo:{type:'STRING'},invoiceDate:{type:'STRING'},sellerName:{type:'STRING'},sellerTaxId:{type:'STRING'},buyerTaxId:{type:'STRING'},totalAmount:{type:'INTEGER'},untaxedAmount:{type:'INTEGER'},taxAmount:{type:'INTEGER'},category:{type:'STRING'},note:{type:'STRING'},confidence:{type:'STRING'},warnings:{type:'ARRAY',items:{type:'STRING'}}},required:['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','untaxedAmount','taxAmount','category','note','confidence','warnings']};const body={contents:[{parts:[{text:prompt},{inlineData:{mimeType:'image/jpeg',data:base64}}]}],generationConfig:{temperature:0,responseMimeType:'application/json',responseSchema:schema}};const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.error)throw new Error((json.error&&json.error.message)||('HTTP '+res.status));const text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;if(!text)throw new Error('Gemini 沒有回傳文字');return JSON.parse(String(text).replace(/^\x60\x60\x60(?:json)?\s*/,'').replace(/\s*\x60\x60\x60$/,'').trim());}
function applyGeminiInvoiceV10(r){const total=Number(r.totalAmount)||0;const untaxed=total>0?Math.floor(total/1.05):(Number(r.untaxedAmount)||0);const tax=total>0?total-untaxed:(Number(r.taxAmount)||0);const data={invoiceNo:r.invoiceNo||'',invoiceDate:toDateInputV10(r.invoiceDate||''),sellerName:r.sellerName||'',sellerTaxId:r.sellerTaxId||'',buyerTaxId:r.buyerTaxId||'',totalAmount:total||'',untaxedAmount:untaxed||'',taxAmount:tax||'',category:r.category&&r.category!=='未分類'?r.category:'',note:r.note||''};Object.entries(data).forEach(([k,v])=>{if($(k))$(k).value=v;});if(window.recalcInvoiceMoneyV10)window.recalcInvoiceMoneyV10();}
function toDateInputV10(v){const m=String(v||'').match(/(20[0-9]{2})[\/.-]([0-9]{1,2})[\/.-]([0-9]{1,2})/);return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):v;}`;
    html=html.replace(/async function runVisionOcr\(\)\{[\s\S]*?\nasync function callVisionApi/, geminiRun + '\nasync function callVisionApi');
    html=html.replace(/function applyParsedInvoice\(parsed\)\{Object\.entries\(parsed\)\.forEach\(\(\[k,v\]\)=>\{if\(v!==''&&\$\(k\)\)\$\(k\)\.value=v;\}\);\}/, "function applyParsedInvoice(parsed){Object.entries(parsed).forEach(([k,v])=>{if($(k))$(k).value=v;});if(window.recalcInvoiceMoneyV10)window.recalcInvoiceMoneyV10();}");

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    msg.className='error';
    msg.textContent='v10 載入失敗：' + (err && err.message ? err.message : err);
    const a=document.createElement('a');
    a.className='btn';
    a.href='v9.html?fallback=' + Date.now();
    a.textContent='改開 v9';
    document.querySelector('.box').appendChild(a);
  }
})();
</script>
</body>
</html>
