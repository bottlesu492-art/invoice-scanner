<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商家資料庫 POST 讀取測試</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef3f4;color:#172126;margin:0;padding:16px}.box{max-width:820px;margin:auto;background:#fff;border:1px solid #d9e1e5;border-radius:8px;padding:16px}input,button,pre{font:inherit}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d9e1e5;border-radius:8px;margin:6px 0 12px}button{min-height:42px;border:0;border-radius:8px;background:#0f766e;color:#fff;font-weight:700;padding:0 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f8;border:1px solid #d9e1e5;border-radius:8px;padding:12px;min-height:220px}
</style>
</head>
<body>
<div class="box">
<h1>商家資料庫 POST 讀取測試</h1>
<p>只測 v56 使用的 POST + iframe，不寫入、不花 Gemini 額度。</p>
<label>GAS /exec 網址</label><input id="url">
<label>API token</label><input id="token">
<button id="run">測試 POST 讀取</button>
<pre id="out">待命</pre>
</div>
<script>
const $=id=>document.getElementById(id);
$('url').value=localStorage.getItem('gas-url')||'';
$('token').value=localStorage.getItem('invoice-api-token')||'';
$('run').onclick=()=>{
  $('out').textContent='開始 POST iframe 測試...\n';
  const url=$('url').value.trim();
  const token=$('token').value.trim();
  localStorage.setItem('gas-url',url);
  localStorage.setItem('invoice-api-token',token);
  postFrame(url,token);
};
function log(s){$('out').textContent+=s+'\n';}
function postFrame(baseUrl,token){
  const id='vendor_post_diag_'+Date.now();
  const frame=document.createElement('iframe');
  frame.name=id;
  frame.style.cssText='width:100%;height:180px;border:1px solid #d9e1e5;margin-top:12px;background:#fff';
  const form=document.createElement('form');
  form.method='POST';
  form.action=baseUrl;
  form.target=id;
  form.style.display='none';
  function input(name,value){const el=document.createElement('input');el.type='hidden';el.name=name;el.value=value;form.appendChild(el);}
  input('action','vendorsFrame');
  input('token',token);
  input('targetOrigin',location.origin);
  input('t',String(Date.now()));
  const timer=setTimeout(()=>{cleanup(false);log('POST iframe 逾時：沒有收到 postMessage。請看下面 iframe 框框是否顯示 Google 錯誤/登入/空白。');},12000);
  function cleanup(done){clearTimeout(timer);window.removeEventListener('message',onMessage);form.remove();if(done)frame.remove();}
  function onMessage(ev){const data=ev.data;if(!data||data.type!=='invoice-vendors')return;cleanup(true);log('收到 postMessage：');log(JSON.stringify(data,null,2));}
  window.addEventListener('message',onMessage);
  log('POST 到：'+baseUrl);
  log('targetOrigin：'+location.origin);
  document.body.appendChild(frame);
  document.body.appendChild(form);
  form.submit();
}
</script>
</body>
</html>
