<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>發票記帳掃描 v13</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{width:min(92vw,460px);padding:22px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 16px 36px rgba(22,33,38,.08)}h1{margin:0 0 10px;font-size:22px}p{margin:0 0 14px;color:#66757f;line-height:1.6}.error{color:#b91c1c;white-space:pre-wrap}.btn{display:inline-block;margin-top:8px;padding:10px 14px;border-radius:8px;background:#0f766e;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <h1>正在載入 v13</h1>
    <p>v13：直接載入主程式，不再包 v10。</p>
    <p id="msg">請稍等...</p>
  </main>
<script>
(async function(){
  const msg=document.getElementById('msg');
  try{
    const res=await fetch('index.html?v13=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('讀取主程式失敗 HTTP ' + res.status);
    let html=await res.text();

    html=html.replace('<title>發票記帳掃描</title>','<title>發票記帳掃描 v13</title>');
    html=html.replace('發票記帳掃描</h1><p>QR 本機掃描 + Cloud Vision OCR</p>','發票記帳掃描 v13</h1><p>QR 混合掃描 + Gemini 紙本發票判讀</p>');
    html=html.replace('Cloud Vision API key','Gemini API key');
    html=html.replace('貼上已限制 Cloud Vision API + GitHub Pages 網域的 API key','貼上 Google AI Studio 產生的 Gemini API key');
    html=html.replace('OCR 會呼叫 Google Cloud Vision；QR 掃描不會使用 Vision 額度。','紙本 OCR 會呼叫 Gemini API；QR 掃描不會使用 Gemini 額度。照片會先縮小以加快辨識。');
    html=html.replace('Cloud Vision OCR','Gemini 發票判讀');
    html=html.replace('使用 Cloud Vision','使用 Gemini');
    html=html.replace('辨識文字','Gemini 判讀');
    html=html.replace('Vision OCR 原文','Gemini 回傳 JSON');
    html=html.replace('電子發票請優先掃左邊 QR。主資料會自動填入；品項會嘗試 Big5 / UTF-8 / Base64 / Shift-JIS 還原，成功時會同步帶到備註欄，儲存前仍可手動修改。','電子發票請優先掃左邊 QR。v13 會混合 BarcodeDetector 與 html5-qrcode 辨識；掃到新 QR 會先清空舊欄位，品項成功時會帶到備註欄。');
    html=html.replace('Cloud Vision OCR 每按一次「Gemini 判讀」會送出一張照片。語言提示固定為繁體中文與英文：<code>zh-Hant</code>, <code>en</code>。','Gemini 每按一次「Gemini 判讀」會送出一張照片。v13 會先縮小照片，加快上傳和判讀。');
    html=html.replace('總金額</label>','含稅總額</label>');
    html=html.replace('<div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" inputmode="decimal"></div>','<div class="field"><label for="untaxedAmount">未稅金額</label><input id="untaxedAmount" inputmode="decimal" readonly></div><div class="field"><label for="taxAmount">稅額</label><input id="taxAmount" inputmode="decimal" readonly></div>');
    html=html.replace(/'totalAmount',\s*'taxAmount'/, "'totalAmount','untaxedAmount','taxAmount'");
    html=html.replace('function init(){bindEvents();loadSettings();renderRecent(loadRecent());}', 'function init(){bindEvents();loadSettings();setupMoneySyncV13();renderRecent(loadRecent());}');
    html=html.replace('function bindEvents(){', "function setupMoneySyncV13(){const total=$('totalAmount'),untaxed=$('untaxedAmount'),tax=$('taxAmount');if(!total||!untaxed||!tax)return;untaxed.readOnly=true;tax.readOnly=true;window.recalcInvoiceMoneyV13=function(){const n=Number(String(total.value||'').replace(/,/g,'').trim());if(!Number.isFinite(n)||n<=0){untaxed.value='';tax.value='';return;}const before=Math.floor(n/1.05);untaxed.value=String(before);tax.value=String(n-before);};total.addEventListener('input',window.recalcInvoiceMoneyV13);total.addEventListener('change',window.recalcInvoiceMoneyV13);setTimeout(window.recalcInvoiceMoneyV13,0);}function clearFieldsForNewScanV13(){fieldIds.forEach(id=>{if($(id))$(id).value='';});state.ocrText='';if($('ocrText'))$('ocrText').value='';if(window.recalcInvoiceMoneyV13)window.recalcInvoiceMoneyV13();}function bindEvents(){");
    html=html.replace("const vision=localStorage.getItem('vision-api-key')||'';", "const vision=localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';");
    html=html.replace("localStorage.setItem('vision-api-key',vision);", "localStorage.setItem('gemini-api-key',vision);localStorage.removeItem('vision-api-key');");
    html=html.replace("function getVisionKey(){return localStorage.getItem('vision-api-key')||'';}", "function getVisionKey(){return localStorage.getItem('gemini-api-key')||localStorage.getItem('vision-api-key')||'';}");
    html=html.replace("state.sourceType=mode==='qr'?'QR':mode==='ocr'?'Cloud Vision OCR':'手動';", "state.sourceType=mode==='qr'?'QR':mode==='ocr'?'Gemini OCR':'手動';");
    html=html.replace("mode==='ocr'?'OCR 模式：使用 Cloud Vision':'手動模式'", "mode==='ocr'?'OCR 模式：使用 Gemini':'手動模式'");

    const detectQr = `async function detectQrCodes(file){const out=[];if('BarcodeDetector' in window){try{const detector=new BarcodeDetector({formats:['qr_code']});const bitmap=await createImageBitmap(file);const codes=await detector.detect(bitmap);if(bitmap.close)bitmap.close();codes.forEach(c=>{if(c.rawValue)out.push(c.rawValue);});}catch(e){}}if(window.Html5Qrcode){try{const scanner=state.scanner||new Html5Qrcode('reader');state.scanner=scanner;const raw=await scanner.scanFile(file,true);if(raw)out.push(raw);}catch(e){}}return unique(out);}\nfunction handleQrScan`;
    html=html.replace(/async function detectQrCodes\(file\)\{[\s\S]*?\nfunction handleQrScan/, detectQr);

    const handleQr = `function handleQrScan(rawValue){const raw=String(rawValue||'').trim();if(!raw)return;const now=Date.now();if(raw===state.lastQr&&now-state.lastQrAt<1200)return;state.lastQr=raw;state.lastQrAt=now;const isRight=raw.startsWith('**');if(!isRight){const nextNo=raw.slice(0,10).toUpperCase();const currentLeftNo=(state.qrLeft||'').slice(0,10).toUpperCase();if(nextNo&&nextNo!==currentLeftNo){clearFieldsForNewScanV13();state.qrLeft='';state.qrRight='';$('qrLeft').textContent='';$('qrRight').textContent='';$('qrItems').textContent='尚未讀取';}}else if(!state.qrLeft&&!$('invoiceNo').value&&!$('totalAmount').value){clearFieldsForNewScanV13();}if(isRight)state.qrRight=raw;else state.qrLeft=raw;renderQrState();const parsed=parseTaiwanInvoiceQr(state.qrLeft,state.qrRight);if(parsed){applyParsedInvoice(parsed);const item=parseQrItems(state.qrLeft,state.qrRight);if(item)applyQrItemsToNote(item);setStatus(item?'QR 已讀取，主資料與品項已填入備註':'QR 左碼已讀取，主資料已填入；沒有可靠品項');return;}if(isRight)setStatus('已讀到右碼。主資料需要左邊 QR。','warn');else setStatus('已讀到 QR，但格式不像台灣電子發票左碼。','warn');}\nfunction clearQr`;
    html=html.replace(/function handleQrScan\(rawValue\)\{[\s\S]*?\nfunction clearQr/, handleQr);

    const photo = `async function handlePhotoInput(e){const file=e.target.files&&e.target.files[0];if(!file)return;clearFieldsForNewScanV13();state.imageData=await resizeImage(file,1400,0.82);state.imageName=file.name;$('preview').src=state.imageData;setStatus('照片已載入，按「Gemini 判讀」會送出較小照片，加快辨識');e.target.value='';}\nasync function handleManualPhotoInput`;
    html=html.replace(/async function handlePhotoInput\(e\)\{[\s\S]*?\nasync function handleManualPhotoInput/, photo);

    const resize = `async function resizeImage(file,max=1600,quality=0.85){const src=await readFile(file);const img=await loadImage(src);const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',quality);}\nfunction readFile`;
    html=html.replace(/async function resizeImage\(file\)\{[\s\S]*?\nfunction readFile/, resize);

    const gemini = `async function runVisionOcr(){if(!state.imageData){setStatus('請先拍照或選相簿照片','error');return;}const key=getVisionKey();if(!key){setStatus('請先到設定填 Gemini API key','error');$('setupPanel').classList.remove('hidden-ready');return;}$('runOcr').disabled=true;$('ocrProgress').classList.remove('hidden');setProgress(12);setStatus('Gemini 正在看發票...');try{const result=await callGeminiInvoiceV13(state.imageData,key);setProgress(82);$('ocrText').value=JSON.stringify(result,null,2);applyGeminiInvoiceV13(result);setProgress(100);setStatus('Gemini 判讀完成。請檢查欄位，錯的直接手改含稅總額即可。');}catch(e){setStatus('Gemini 失敗：'+(e.message||e),'error');}finally{$('runOcr').disabled=false;setTimeout(()=>setProgress(0),600);$('ocrProgress').classList.add('hidden');}}\nasync function callGeminiInvoiceV13(dataUrl,key){const base64=String(dataUrl).replace(/^data:image\\/[a-zA-Z0-9.+-]+;base64,/,'');const prompt=['你是台灣公司記帳助理。請讀取照片中的台灣發票或收銀機統一發票，只輸出 JSON。','看不清楚或沒有標示就填空字串，不要編造。日期若是民國年請轉西元 YYYY/MM/DD，例如 115/02/15 是 2026/02/15。','發票號碼是兩個英文字母加八個數字。賣方統編通常在 NO、統編、營業人附近。買方統編只有明確標示買方/買受人/客戶統編才填，不能用流水號。','含稅總額抓實際交易總計/合計/總計/稅計，不要抓現金、找零、累計點、本次點、電話、地址、流水號。','收銀機發票品項通常左邊是品名，右邊靠右數字才是本次金額；品名中的 120元、100元、98元可能只是商品名稱的一部分。備註只放品項與右側金額，每行一個品項，不要放警告文字。','未稅=floor(含稅總額/1.05)，稅額=含稅總額-未稅。費用類別只能選：五金用品、加油、停車費、餐費、文具、設備、軟體、交際、其他、未分類。'].join('\\n');const schema={type:'OBJECT',properties:{invoiceNo:{type:'STRING'},invoiceDate:{type:'STRING'},sellerName:{type:'STRING'},sellerTaxId:{type:'STRING'},buyerTaxId:{type:'STRING'},totalAmount:{type:'INTEGER'},untaxedAmount:{type:'INTEGER'},taxAmount:{type:'INTEGER'},category:{type:'STRING'},note:{type:'STRING'},confidence:{type:'STRING'},warnings:{type:'ARRAY',items:{type:'STRING'}}},required:['invoiceNo','invoiceDate','sellerName','sellerTaxId','buyerTaxId','totalAmount','untaxedAmount','taxAmount','category','note','confidence','warnings']};const body={contents:[{parts:[{text:prompt},{inlineData:{mimeType:'image/jpeg',data:base64}}]}],generationConfig:{temperature:0,responseMimeType:'application/json',responseSchema:schema}};const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const json=await res.json().catch(()=>({}));if(!res.ok||json.error)throw new Error((json.error&&json.error.message)||('HTTP '+res.status));const text=json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts&&json.candidates[0].content.parts[0]&&json.candidates[0].content.parts[0].text;if(!text)throw new Error('Gemini 沒有回傳文字');return JSON.parse(String(text).replace(/^\\x60\\x60\\x60(?:json)?\\s*/,'').replace(/\\s*\\x60\\x60\\x60$/,'').trim());}\nfunction applyGeminiInvoiceV13(r){clearFieldsForNewScanV13();const total=Number(r.totalAmount)||0;const untaxed=total>0?Math.floor(total/1.05):(Number(r.untaxedAmount)||0);const tax=total>0?total-untaxed:(Number(r.taxAmount)||0);const data={invoiceNo:r.invoiceNo||'',invoiceDate:toDateInputV13(r.invoiceDate||''),sellerName:r.sellerName||'',sellerTaxId:r.sellerTaxId||'',buyerTaxId:r.buyerTaxId||'',totalAmount:total||'',untaxedAmount:untaxed||'',taxAmount:tax||'',category:r.category&&r.category!=='未分類'?r.category:'',note:r.note||''};Object.entries(data).forEach(([k,v])=>{if($(k))$(k).value=v;});if(window.recalcInvoiceMoneyV13)window.recalcInvoiceMoneyV13();}\nfunction toDateInputV13(v){const m=String(v||'').match(/(20[0-9]{2})[\\/.-]([0-9]{1,2})[\\/.-]([0-9]{1,2})/);return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):v;}\nasync function callVisionApi`;
    html=html.replace(/async function runVisionOcr\(\)\{[\s\S]*?\nasync function callVisionApi/, gemini);

    html=html.replace(/function applyParsedInvoice\(parsed\)\{Object\.entries\(parsed\)\.forEach\(\(\[k,v\]\)=>\{if\(v!==''&&\$\(k\)\)\$\(k\)\.value=v;\}\);\}/, "function applyParsedInvoice(parsed){Object.entries(parsed).forEach(([k,v])=>{if($(k))$(k).value=v;});if(window.recalcInvoiceMoneyV13)window.recalcInvoiceMoneyV13();}");

    const save = `async function saveInvoice(){const payload=buildPayload();if(!payload.invoiceNo&&!payload.totalAmount){setStatus('請至少填發票號碼或含稅總額','error');return;}const url=getGasUrl();const token=getApiToken();if(!url||!token){setStatus('缺少 GAS /exec 網址或 API token，請到第一設定重新貼上並按記住','error');$('setupPanel').classList.remove('hidden-ready');return;}const sendPayload={sourceType:payload.sourceType,status:payload.status,invoiceNo:payload.invoiceNo,invoiceDate:payload.invoiceDate,sellerTaxId:payload.sellerTaxId,buyerTaxId:payload.buyerTaxId,totalAmount:payload.totalAmount,untaxedAmount:payload.untaxedAmount,taxAmount:payload.taxAmount,category:payload.category,payer:payload.payer,note:payload.note};$('saveInvoice').disabled=true;setStatus('正在送到 Apps Script，只送簡化會計欄位...');try{await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token,payload:sendPayload})});saveLocal(sendPayload);$('saveHint').textContent='已送出到 Apps Script；試算表只會寫入簡化欄位';setStatus('已送出。若 Google Sheet 沒新增，請檢查 GAS 部署版本或 token。');renderRecent(loadRecent());}catch(e){setStatus('送出失敗：'+(e.message||e),'error');}finally{$('saveInvoice').disabled=false;}}\nfunction saveLocal`;
    html=html.replace(/async function saveInvoice\(\)\{[\s\S]*?\nfunction saveLocal/, save);

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    msg.className='error';
    msg.textContent='v13 載入失敗：' + (err && err.message ? err.message : err);
    const a=document.createElement('a');
    a.className='btn';
    a.href='v10-savefix.html?fallback=' + Date.now();
    a.textContent='改開 v10';
    document.querySelector('.box').appendChild(a);
  }
})();
</script>
</body>
</html>
