<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>發票記帳掃描 v53</title>
<style>
body{margin:0;background:#eef3f4;color:#172126;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:760px;margin:40px auto;padding:20px;border:1px solid #d9e1e5;border-radius:8px;background:#fff;box-shadow:0 14px 34px rgba(22,33,38,.08)}.err{color:#b91c1c;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box" id="loader">正在載入 v53：商家資料庫 iframe 讀取...</div>
<script>
(async function(){
  const loader=document.getElementById('loader');
  try{
    let page=await fetch('v51.html?base='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('讀不到 v51.html，HTTP '+r.status);return r.text();});
    page=page.replaceAll('發票記帳掃描 v51','發票記帳掃描 v53');
    page=page.replace('正在載入 v51：商家資料庫重讀與狀態欄移位...','正在載入 v53：商家資料庫 iframe 讀取...');
    page=page.replace('v51 會先讀商家資料庫，OCR 後與儲存前都會檢查；狀態提示放在確認資料旁，所有欄位仍可手改。','v53 會用 iframe 從 GAS 讀取商家資料庫，OCR 後與儲存前都會檢查；所有欄位仍可手改。');

    const extraPatches = String.raw`
    html=replaceRegex(html,/function loadVendors\(force=false\)\{[\s\S]*?\}function jsonp/,"function loadVendors(force=false){const url=getGasUrl();const token=getApiToken();if(!url||!token){state.vendorLoaded=false;setStatus('尚未設定 GAS 或 token，無法讀商家資料庫','warn');return Promise.resolve(false);}if(state.vendorLoading&&!force)return state.vendorLoading;state.vendorLoading=readVendorsByFrame(url,token).then(res=>{if(res&&res.ok&&Array.isArray(res.vendors)){state.vendors=res.vendors;state.vendorLoaded=true;setStatus('已讀取商家資料庫：'+state.vendors.length+' 筆');return true;}state.vendorLoaded=false;setStatus('商家資料庫讀取失敗：'+((res&&res.error)||'GAS 沒有回傳 vendors'),'warn');return false;}).catch(err=>{state.vendorLoaded=false;setStatus('商家資料庫讀取失敗：'+(err.message||err),'warn');return false;}).finally(()=>{state.vendorLoading=null;});return state.vendorLoading;}function readVendorsByFrame(baseUrl,token){return new Promise((resolve,reject)=>{const frame=document.createElement('iframe');frame.style.cssText='position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;border:0;';const timer=setTimeout(()=>{cleanup();reject(new Error('iframe 讀取逾時，請確認 GAS 已部署新版 Code.gs'));},12000);function cleanup(){clearTimeout(timer);window.removeEventListener('message',onMessage);frame.remove();}function onMessage(ev){const data=ev.data;if(!data||data.type!=='invoice-vendors')return;cleanup();resolve(data);}window.addEventListener('message',onMessage);const u=new URL(baseUrl);u.searchParams.set('action','vendorsFrame');u.searchParams.set('token',token);u.searchParams.set('targetOrigin',location.origin);u.searchParams.set('t',Date.now());frame.src=u.toString();document.body.appendChild(frame);});}function jsonp",'iframe vendor loader');
`;
    page=page.replace('    html=patchGeminiFunction(html);', extraPatches + '    html=patchGeminiFunction(html);');

    document.open();
    document.write(page);
    document.close();
  }catch(err){
    loader.className='box err';
    loader.textContent=(err&&err.stack)||String(err);
  }
})();
</script>
</body>
</html>
